<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Tlaxcala Trail / El Camino de Tlaxcala</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      background: linear-gradient(135deg, #8B4513 0%, #D2691E 50%, #CD853F 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    #game {
      width: 100%;
      max-width: 780px;
      background: #FFF8EE;
      border-radius: 20px;
      border: 5px solid #8B4513;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
      min-height: 580px;
      position: relative;
      overflow: hidden;
    }

    /* ── HEADER ── */
    #top-bar {
      background: #8B4513;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #top-bar h3 {
      color: #F5E6C8;
      font-size: 15px;
      letter-spacing: 1px;
    }
    #lang-btn {
      background: #F5E6C8;
      border: none;
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 14px;
      font-weight: bold;
      color: #8B4513;
      cursor: pointer;
      transition: transform 0.1s;
    }
    #lang-btn:hover { transform: scale(1.07); }

    /* ── RESOURCE BAR ── */
    #resource-bar {
      background: #4A2500;
      padding: 8px 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .res-item {
      display: flex;
      align-items: center;
      gap: 5px;
      flex: 1;
      min-width: 120px;
    }
    .res-label { color: #F5E6C8; font-size: 13px; min-width: 70px; }
    .res-track {
      flex: 1;
      background: #2A1500;
      border-radius: 8px;
      height: 14px;
      overflow: hidden;
    }
    .res-fill {
      height: 100%;
      border-radius: 8px;
      transition: width 0.6s ease;
    }
    .fill-health  { background: linear-gradient(90deg, #e74c3c, #ff7675); }
    .fill-food    { background: linear-gradient(90deg, #27ae60, #55efc4); }
    .fill-joy     { background: linear-gradient(90deg, #f39c12, #fdcb6e); }
    .fill-friends { background: linear-gradient(90deg, #8e44ad, #a29bfe); }

    /* ── MAIN CONTENT ── */
    #content {
      padding: 24px 28px;
      min-height: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ── SCREENS ── */
    .screen { width: 100%; text-align: center; animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .scene-art {
      font-size: 64px;
      margin-bottom: 14px;
      line-height: 1.2;
      filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.15));
    }
    .chapter-badge {
      display: inline-block;
      background: #8B4513;
      color: #F5E6C8;
      border-radius: 20px;
      padding: 5px 18px;
      font-size: 13px;
      margin-bottom: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    h1.game-title {
      font-size: 36px;
      color: #8B4513;
      margin-bottom: 6px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
    }
    h2.game-title2 {
      font-size: 22px;
      color: #C0392B;
      margin-bottom: 18px;
    }
    h2.screen-title {
      font-size: 26px;
      color: #8B4513;
      margin-bottom: 12px;
    }
    .story-text {
      font-size: 18px;
      color: #3D2000;
      line-height: 1.6;
      margin-bottom: 22px;
      max-width: 640px;
      margin-left: auto;
      margin-right: auto;
    }
    .result-text {
      font-size: 19px;
      color: #1a6020;
      line-height: 1.6;
      margin-bottom: 18px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
      background: #e8f8e8;
      border-radius: 12px;
      padding: 14px 20px;
      border-left: 5px solid #27ae60;
    }
    .result-text.bad {
      color: #7f1010;
      background: #fdecea;
      border-left-color: #e74c3c;
    }
    .fact-box {
      background: linear-gradient(135deg, #FFF3CD, #FFE082);
      border: 3px solid #F39C12;
      border-radius: 16px;
      padding: 18px 24px;
      margin-bottom: 18px;
      max-width: 620px;
      margin-left: auto;
      margin-right: auto;
    }
    .fact-box .fact-icon { font-size: 36px; margin-bottom: 8px; }
    .fact-box p { font-size: 17px; color: #5D4037; line-height: 1.6; }

    .event-box {
      background: linear-gradient(135deg, #E3F2FD, #BBDEFB);
      border: 3px solid #2196F3;
      border-radius: 16px;
      padding: 18px 24px;
      margin-bottom: 18px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    .event-box .event-icon { font-size: 44px; margin-bottom: 8px; }
    .event-box p { font-size: 17px; color: #1A237E; line-height: 1.6; }

    .resource-changes {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .res-change {
      font-size: 16px;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
    }
    .res-change.pos { background: #d4edda; color: #155724; }
    .res-change.neg { background: #f8d7da; color: #721c24; }

    /* ── BUTTONS ── */
    .btn {
      display: inline-block;
      padding: 14px 30px;
      border-radius: 14px;
      border: none;
      font-size: 18px;
      font-family: 'Georgia', serif;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
      margin: 6px;
      min-width: 200px;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.2); }
    .btn:active { transform: translateY(0); }

    .btn-primary {
      background: linear-gradient(135deg, #8B4513, #C0392B);
      color: white;
    }
    .btn-choice {
      background: linear-gradient(135deg, #2471A3, #1ABC9C);
      color: white;
      display: block;
      width: 90%;
      max-width: 520px;
      margin: 8px auto;
      text-align: left;
      font-size: 16px;
      padding: 16px 22px;
    }
    .btn-next {
      background: linear-gradient(135deg, #27AE60, #1E8449);
      color: white;
    }
    .btn-gold {
      background: linear-gradient(135deg, #D4AC0D, #F39C12);
      color: #3D2000;
    }
    .btn-chapter {
      background: linear-gradient(135deg, #8B4513, #A93226);
      color: white;
      font-size: 20px;
      padding: 18px 40px;
    }

    /* ── NAME INPUT ── */
    #name-input {
      font-size: 22px;
      font-family: 'Georgia', serif;
      padding: 12px 20px;
      border: 3px solid #8B4513;
      border-radius: 12px;
      color: #3D2000;
      background: #FFF3E0;
      width: 280px;
      text-align: center;
      margin-bottom: 16px;
    }
    #name-input:focus { outline: none; border-color: #C0392B; }

    /* ── CHAPTER INTRO ── */
    .chapter-intro-bg {
      background: linear-gradient(135deg, #4A2500 0%, #8B4513 100%);
      border-radius: 16px;
      padding: 30px;
      color: white;
      max-width: 640px;
      margin: 0 auto;
    }
    .chapter-intro-bg h2 { font-size: 28px; margin-bottom: 8px; }
    .chapter-intro-bg .ch-year { font-size: 15px; color: #FFD580; margin-bottom: 16px; }
    .chapter-intro-bg p { font-size: 17px; line-height: 1.6; color: #F5E6C8; }

    /* ── SUMMARY ── */
    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      max-width: 440px;
      margin: 0 auto 20px;
    }
    .summary-card {
      background: white;
      border-radius: 12px;
      padding: 14px;
      border: 2px solid #DDD;
      text-align: center;
    }
    .summary-card .sc-icon { font-size: 28px; }
    .summary-card .sc-val { font-size: 24px; font-weight: bold; color: #8B4513; }
    .summary-card .sc-lbl { font-size: 13px; color: #888; }

    /* ── GAME OVER / VICTORY ── */
    .win-screen { background: linear-gradient(135deg, #1a5c1a, #27ae60); border-radius: 16px; padding: 30px; color: white; }
    .lose-screen { background: linear-gradient(135deg, #7f1010, #c0392b); border-radius: 16px; padding: 30px; color: white; }
    .win-screen h2, .lose-screen h2 { font-size: 30px; margin-bottom: 14px; }
    .win-screen p, .lose-screen p { font-size: 18px; line-height: 1.6; color: rgba(255,255,255,0.9); }

    .big-emoji { font-size: 80px; margin-bottom: 10px; }

    /* ── PROGRESS DOTS ── */
    #progress-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      background: #6B3410;
    }
    .dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #4A2500;
      transition: background 0.3s;
    }
    .dot.done { background: #F39C12; }
    .dot.current { background: #FFD700; box-shadow: 0 0 6px #FFD700; }

    @media (max-width: 500px) {
      h1.game-title { font-size: 26px; }
      .story-text { font-size: 16px; }
      .scene-art { font-size: 48px; }
      #content { padding: 16px 14px; }
    }
  </style>
</head>
<body>
<div id="game">
  <div id="top-bar">
    <h3 id="top-title">🌋 The Tlaxcala Trail</h3>
    <button id="lang-btn" onclick="toggleLang()">🌐 Español</button>
  </div>
  <div id="progress-dots"></div>
  <div id="resource-bar" style="display:none">
    <div class="res-item">
      <span class="res-label">❤️ <span data-key="health">Health</span></span>
      <div class="res-track"><div class="res-fill fill-health" id="fill-health"></div></div>
    </div>
    <div class="res-item">
      <span class="res-label">🌽 <span data-key="food">Food</span></span>
      <div class="res-track"><div class="res-fill fill-food" id="fill-food"></div></div>
    </div>
    <div class="res-item">
      <span class="res-label">😊 <span data-key="joy">Joy</span></span>
      <div class="res-track"><div class="res-fill fill-joy" id="fill-joy"></div></div>
    </div>
    <div class="res-item">
      <span class="res-label">🤝 <span data-key="friends">Friends</span></span>
      <div class="res-track"><div class="res-fill fill-friends" id="fill-friends"></div></div>
    </div>
  </div>
  <div id="content"></div>
</div>

<script>
// ═══════════════════════════════════════════════
//  GAME STATE
// ═══════════════════════════════════════════════
let currentLang = 'en';
let playerName  = 'Explorer';
let resources   = { health: 90, food: 80, joy: 70, friends: 60 };
let step        = 0;   // current step in STEPS array
let totalSteps  = 0;

// ═══════════════════════════════════════════════
//  BILINGUAL STRINGS
// ═══════════════════════════════════════════════
const T = {
  topTitle:   { en: '🌋 The Tlaxcala Trail',        es: '🌋 El Camino de Tlaxcala' },
  langBtn:    { en: '🌐 Español',                    es: '🌐 English' },
  health:     { en: 'Health',                        es: 'Salud' },
  food:       { en: 'Food',                          es: 'Comida' },
  joy:        { en: 'Joy',                           es: 'Alegría' },
  friends:    { en: 'Friends',                       es: 'Amigos' },
  next:       { en: '➡️ Continue',                  es: '➡️ Continuar' },
  startGame:  { en: '🎮 Start Adventure!',           es: '🎮 ¡Comenzar Aventura!' },
  enterName:  { en: 'What is your name?',            es: '¿Cómo te llamas?' },
  namePh:     { en: 'Your name here...',             es: 'Tu nombre aquí...' },
  nameGo:     { en: "🌟 Let's Go!",                  es: '🌟 ¡Vamos!' },
  chSummary:  { en: 'Chapter Complete!',             es: '¡Capítulo Completo!' },
  chSumSub:   { en: 'Here is how you are doing:',   es: 'Así vas hasta ahora:' },
  nextCh:     { en: '⭐ Next Chapter!',              es: '⭐ ¡Siguiente Capítulo!' },
  funFact:    { en: '📚 Fun Fact!',                  es: '📚 ¡Dato Curioso!' },
  event:      { en: '🎲 Something Happened!',        es: '🎲 ¡Algo Pasó!' },
  gameOver:   { en: 'Oh no! Game Over.',             es: 'Oh no. Fin del Juego.' },
  gameOverSub:{ en: "Your health ran out! But don't worry — history is full of second chances. Try again!", es: '¡Tu salud se acabó! Pero no te preocupes — la historia está llena de segundas oportunidades. ¡Inténtalo de nuevo!' },
  tryAgain:   { en: '🔄 Try Again!',                es: '🔄 ¡Intentar de Nuevo!' },
  youDid:     { en: 'You did it!',                  es: '¡Lo lograste!' },
  victory:    { en: ({ n }) => `Amazing, ${n}! You journeyed through ancient Tlaxcala, the great encounter with the Spanish, the colonial era, and all the way to Mexican Independence! You are a true Tlaxcalan hero!`,
                es: ({ n }) => `¡Increíble, ${n}! Viajaste por la antigua Tlaxcala, el gran encuentro con los españoles, la era colonial, ¡y hasta la Independencia de México! ¡Eres un verdadero héroe tlaxcalteca!` },
  playAgain:  { en: '🎉 Play Again!',               es: '🎉 ¡Jugar de Nuevo!' },
};

function t(key, vars) {
  const v = T[key];
  if (!v) return key;
  const val = v[currentLang] ?? v.en;
  return typeof val === 'function' ? val(vars || {}) : val;
}

// ═══════════════════════════════════════════════
//  GAME STEPS  (the full script)
// ═══════════════════════════════════════════════
// Each step: { type, ... }
// Types: title | name | chapterIntro | scene | result | event | fact | summary | victory | gameOver

function buildSteps(name) {
  const N = name || playerName;
  return [

  // ──────────────── TITLE ────────────────
  { type: 'title' },

  // ──────────────── NAME ────────────────
  { type: 'name' },

  // ══════════════════════════════════════
  //  CHAPTER 1 — Ancient Tlaxcala
  // ══════════════════════════════════════
  {
    type: 'chapterIntro',
    num: 1,
    art: '🌽🏔️🌺🦅',
    title: {
      en: 'Chapter 1: Ancient Tlaxcala',
      es: 'Capítulo 1: La Antigua Tlaxcala'
    },
    year: { en: 'Long ago, before 1519 CE', es: 'Hace mucho tiempo, antes del año 1519' },
    text: {
      en: ({ n }) => `Welcome, ${n}! You live in Tlaxcala — a proud, free city in Mexico surrounded by the mighty Aztec Empire. Your people speak Nahuatl and are famous for their bravery and delicious corn. Get ready to explore your home!`,
      es: ({ n }) => `¡Bienvenido, ${n}! Vives en Tlaxcala — una ciudad libre y orgullosa en México, rodeada por el poderoso Imperio Azteca. Tu gente habla náhuatl y es famosa por su valentía y su delicioso maíz. ¡Prepárate para explorar tu hogar!`
    }
  },

  // Ch1 Scene 1
  {
    type: 'scene',
    art: '🏪🌽🥑🍅',
    chapter: 1,
    title: { en: 'The Busy Market', es: 'El Mercado Lleno de Vida' },
    text: {
      en: ({ n }) => `${n}, you are at the great Tlaxcalan market! Colorful fabrics, fresh corn, and beautiful pottery fill every stall. You notice a small, hungry child with no food. What do you do?`,
      es: ({ n }) => `${n}, ¡estás en el gran mercado tlaxcalteca! Hay telas de colores, maíz fresco y hermosa cerámica en cada puesto. Notas a un niño pequeño con hambre y sin comida. ¿Qué haces?`
    },
    choices: [
      {
        icon: '🌽',
        text: { en: 'Share your food with the child', es: 'Compartir tu comida con el niño' },
        result: {
          good: true,
          art: '😊🤝',
          text: {
            en: ({ n }) => `How kind, ${n}! The child smiles and says "Tlazohcamati!" (thank you in Nahuatl). You made a new friend today!`,
            es: ({ n }) => `¡Qué amable, ${n}! El niño sonríe y dice "¡Tlazohcamati!" (gracias en náhuatl). ¡Hoy hiciste un nuevo amigo!`
          },
          changes: { food: -15, friends: +20, joy: +10 }
        }
      },
      {
        icon: '🛡️',
        text: { en: 'Keep your food — you might need it later', es: 'Guardar tu comida — podrías necesitarla después' },
        result: {
          good: false,
          art: '😐📦',
          text: {
            en: ({ n }) => `You keep your food safe, ${n}. You feel a little sad seeing the child leave hungry. Sometimes keeping resources is smart, but it can feel lonely.`,
            es: ({ n }) => `Guardas tu comida, ${n}. Te sientes un poco triste al ver al niño irse con hambre. A veces guardar recursos es inteligente, pero puede sentirse solitario.`
          },
          changes: { food: 0, friends: -5, joy: -5 }
        }
      }
    ]
  },

  // Ch1 Scene 2
  {
    type: 'scene',
    art: '👴📖🌿',
    chapter: 1,
    title: { en: 'The Wise Elders', es: 'Los Sabios Ancianos' },
    text: {
      en: ({ n }) => `The village elders are teaching about Tlaxcalan history under the shade of a big tree. But your friends are nearby playing a ball game! What do you choose, ${n}?`,
      es: ({ n }) => `Los ancianos del pueblo enseñan la historia tlaxcalteca bajo la sombra de un árbol grande. ¡Pero tus amigos están cerca jugando pelota! ¿Qué eliges, ${n}?`
    },
    choices: [
      {
        icon: '📖',
        text: { en: 'Listen to the elders and learn', es: 'Escuchar a los ancianos y aprender' },
        result: {
          good: true,
          art: '🧠✨',
          text: {
            en: ({ n }) => `Great choice, ${n}! You learn that Tlaxcala means "Place of Corn Tortillas" in Nahuatl, and that Tlaxcala had FOUR city-states ruled by a council — not one king! That was very special.`,
            es: ({ n }) => `¡Excelente elección, ${n}! Aprendes que Tlaxcala significa "Lugar de las Tortillas de Maíz" en náhuatl, y que Tlaxcala tenía CUATRO ciudades-estado gobernadas por un consejo — ¡no un solo rey! Eso era muy especial.`
          },
          changes: { joy: +20, health: +5 }
        }
      },
      {
        icon: '⚽',
        text: { en: 'Play the ball game with friends', es: 'Jugar pelota con los amigos' },
        result: {
          good: false,
          art: '⚽😄',
          text: {
            en: ({ n }) => `You have so much fun, ${n}! But later you wonder what the elders were teaching. Maybe you can ask them tomorrow!`,
            es: ({ n }) => `¡Te diviertes muchísimo, ${n}! Pero después te preguntas qué enseñaban los ancianos. ¡Tal vez puedes preguntarles mañana!`
          },
          changes: { joy: +10, friends: +10, food: -10 }
        }
      }
    ]
  },

  // Ch1 Scene 3
  {
    type: 'scene',
    art: '🌧️☁️🌽🌾',
    chapter: 1,
    title: { en: 'The Coming Storm!', es: '¡La Tormenta se Acerca!' },
    text: {
      en: ({ n }) => `Dark clouds are rolling in fast, ${n}! A big rainstorm is coming. Your family has corn crops in the field AND animals in the yard. You can only save one!`,
      es: ({ n }) => `¡Las nubes oscuras llegan rápido, ${n}! Se acerca una gran tormenta. Tu familia tiene maíz en el campo Y animales en el patio. ¡Solo puedes salvar uno!`
    },
    choices: [
      {
        icon: '🌽',
        text: { en: 'Run out and harvest the corn!', es: '¡Correr a cosechar el maíz!' },
        result: {
          good: true,
          art: '🌽💧',
          text: {
            en: ({ n }) => `You dash through the rain, ${n}! You saved lots of corn but got very wet. You might catch a little cold, but at least your family won't be hungry!`,
            es: ({ n }) => `¡Corres bajo la lluvia, ${n}! Salvaste mucho maíz pero te mojaste mucho. Quizás te resfríes un poco, ¡pero al menos tu familia no pasará hambre!`
          },
          changes: { food: +25, health: -10, joy: +5 }
        }
      },
      {
        icon: '🐓',
        text: { en: 'Shelter the animals in the barn', es: 'Llevar los animales al refugio' },
        result: {
          good: true,
          art: '🐓🏠',
          text: {
            en: ({ n }) => `The animals are safe! You stayed dry too, ${n}. The corn got a little wet, but your turkey and dogs are happy and healthy. Good thinking!`,
            es: ({ n }) => `¡Los animales están a salvo! Tú también te mantuviste seco, ${n}. El maíz se mojó un poco, pero tu guajolote y perros están contentos y sanos. ¡Bien pensado!`
          },
          changes: { health: +10, friends: +15, food: -10 }
        }
      }
    ]
  },

  // Ch1 Random Event
  {
    type: 'event',
    art: '🎊🎭🎉',
    title: { en: '🎉 Festival Time!', es: '🎉 ¡Tiempo de Festival!' },
    text: {
      en: ({ n }) => `Surprise, ${n}! The Tlaxcalan festival has begun! There is music, dancing, colorful costumes, and delicious food everywhere. Your whole village is celebrating together!`,
      es: ({ n }) => `¡Sorpresa, ${n}! ¡Ha comenzado el festival tlaxcalteca! Hay música, baile, disfraces coloridos y deliciosa comida por todos lados. ¡Todo tu pueblo celebra junto!`
    },
    changes: { joy: +20, friends: +10, food: +5 }
  },

  // Ch1 Fun Fact
  {
    type: 'fact',
    icon: '🌽',
    title: { en: '📚 Fun Fact about Tlaxcala!', es: '📚 ¡Dato Curioso sobre Tlaxcala!' },
    text: {
      en: 'Tlaxcala is the SMALLEST state in all of Mexico — but it has one of the BIGGEST histories! Its name comes from the Nahuatl word "Tlaxcallan" meaning "Place of Corn Tortillas." Corn (maize) was the most important food and was even considered sacred!',

        text: { en: 'Share a little — keep some for family', es: 'Compartir un poco — guardar algo para la familia' },
        result: {
          good: true,
          art: '🤝🌽',
          text: {
            en: ({ n }) => `A smart balance, ${n}! Every bit helps. The fighters are grateful, and your family still has enough to eat. Even small acts of kindness make a big difference in history!`,
            es: ({ n }) => `¡Un equilibrio inteligente, ${n}! Cada poco ayuda. Los luchadores están agradecidos, y tu familia todavía tiene suficiente para comer. ¡Incluso los pequeños actos de bondad hacen una gran diferencia en la historia!`
          },
          changes: { food: -10, friends: +15, joy: +10 }
        }
      }
    ]
  },

  // Ch4 Scene 3
  {
    type: 'scene',
    art: '🎉🇲🇽🦅🎊',
    chapter: 4,
    title: { en: 'Victory! Mexico is Free!', es: '¡Victoria! ¡México es Libre!' },
    text: {
      en: ({ n }) => `September 27, 1821 — Mexico is INDEPENDENT! 🇲🇽 After 11 long years, Mexico is finally free from Spain! There are celebrations everywhere in Tlaxcala. What do you do to mark this amazing day, ${n}?`,
      es: ({ n }) => `27 de septiembre de 1821 — ¡México es INDEPENDIENTE! 🇲🇽 ¡Después de 11 largos años, México finalmente es libre de España! Hay celebraciones en todas partes de Tlaxcala. ¿Qué haces para marcar este día increíble, ${n}?`
    },
    choices: [
      {
        icon: '💃',
        text: { en: 'Dance and celebrate with everyone!', es: '¡Bailar y celebrar con todos!' },
        result: {
          good: true,
          art: '🎊🦅🎉',
          text: {
            en: ({ n }) => `¡VIVA MÉXICO! ¡VIVA TLAXCALA! You dance, ${n}! The music plays all night. Fireworks light up the sky. You laugh and hug your neighbors. This is the happiest day in a very long time!`,
            es: ({ n }) => `¡VIVA MÉXICO! ¡VIVA TLAXCALA! ¡Bailas, ${n}! La música suena toda la noche. Los fuegos artificiales iluminan el cielo. Ríes y abrazas a tus vecinos. ¡Este es el día más feliz en mucho tiempo!`
          },
          changes: { joy: +30, friends: +20, health: +5 }
        }
      },
      {
        icon: '📝',
        text: { en: 'Write down the story so no one forgets', es: 'Escribir la historia para que nadie la olvide' },
        result: {
          good: true,
          art: '📝⭐',
          text: {
            en: ({ n }) => `What a wonderful idea, ${n}! You write everything down — the celebrations, the music, the faces of happy people. Your words will help children 200 years from now understand this incredible day!`,
            es: ({ n }) => `¡Qué idea tan maravillosa, ${n}! Escribes todo — las celebraciones, la música, los rostros de la gente feliz. ¡Tus palabras ayudarán a niños 200 años después a entender este día increíble!`
          },
          changes: { joy: +20, friends: +15, health: +10 }
        }
      }
    ]
  },

  // Ch4 Fun Fact
  {
    type: 'fact',
    icon: '🦅',
    title: { en: '📚 The Grito de Independencia!', es: '📚 ¡El Grito de Independencia!' },
    text: {
      en: 'Every year on the night of September 15, the President of Mexico stands on the balcony of the National Palace and shouts the Grito de Independencia — just like Father Hidalgo did in 1810! Millions of people across Mexico shout back "¡Viva México!" It is the biggest celebration in the whole country. September 16 is Mexican Independence Day!',
      es: 'Cada año, en la noche del 15 de septiembre, el Presidente de México sale al balcón del Palacio Nacional y grita el Grito de Independencia — ¡igual que el Padre Hidalgo lo hizo en 1810! Millones de personas en todo México responden "¡Viva México!" Es la celebración más grande de todo el país. ¡El 16 de septiembre es el Día de la Independencia de México!'
    }
  },

  // VICTORY
  { type: 'victory' }

  ]; // end return
}

// ═══════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════
function clamp(v) { return Math.max(0, Math.min(100, v)); }

function applyChanges(changes) {
  for (const [k, v] of Object.entries(changes)) {
    resources[k] = clamp(resources[k] + v);
  }
  updateResourceBar();
  return resources.health <= 0;
}

function updateResourceBar() {
  document.getElementById('fill-health').style.width  = resources.health  + '%';
  document.getElementById('fill-food').style.width    = resources.food    + '%';
  document.getElementById('fill-joy').style.width     = resources.joy     + '%';
  document.getElementById('fill-friends').style.width = resources.friends + '%';
}

function updateResLabels() {
  document.querySelectorAll('[data-key]').forEach(el => {
    const key = el.getAttribute('data-key');
    if (T[key]) el.textContent = t(key);
  });
}

function toggleLang() {
  currentLang = currentLang === 'en' ? 'es' : 'en';
  document.getElementById('lang-btn').textContent = t('langBtn');
  document.getElementById('top-title').textContent = t('topTitle');
  updateResLabels();
  renderCurrentStep();
}

function buildDots() {
  const el = document.getElementById('progress-dots');
  el.innerHTML = '';
  const chapters = [0, 1, 2, 3];
  // each chapter = scenes within it
  const chapterSteps = STEPS.reduce((acc, s, i) => {
    if (s.type === 'chapterIntro') acc.push(i);
    return acc;
  }, []);
  chapterSteps.forEach((si, ci) => {
    const dot = document.createElement('div');
    dot.className = 'dot' + (step > si ? ' done' : step === si ? ' current' : '');
    el.appendChild(dot);
  });
}

function resBar(show) {
  document.getElementById('resource-bar').style.display = show ? 'flex' : 'none';
}

// ═══════════════════════════════════════════════
//  RENDER ENGINE
// ═══════════════════════════════════════════════
function renderCurrentStep() {
  const s = STEPS[step];
  if (!s) return;
  buildDots();

  switch (s.type) {
    case 'title':     return renderTitle();
    case 'name':      return renderName();
    case 'chapterIntro': return renderChapterIntro(s);
    case 'scene':     return renderScene(s);
    case 'result':    return renderResult(s);
    case 'event':     return renderEvent(s);
    case 'fact':      return renderFact(s);
    case 'summary':   return renderSummary(s);
    case 'victory':   return renderVictory();
    case 'gameOver':  return renderGameOver();
  }
}

function el(html) {
  document.getElementById('content').innerHTML = html;
}

function renderTitle() {
  resBar(false);
  el(`<div class="screen">
    <div class="scene-art">🌋🦅🌽🏔️</div>
    <h1 class="game-title">The Tlaxcala Trail</h1>
    <h2 class="game-title2">El Camino de Tlaxcala</h2>
    <p class="story-text">A kids' adventure through<br>Mexican history! ⭐<br><em>¡Una aventura infantil por la historia de México!</em></p>
    <button class="btn btn-primary" onclick="nextStep()">${t('startGame')}</button>
  </div>`);
}

function renderName() {
  resBar(false);
  el(`<div class="screen">
    <div class="scene-art">✏️🌟</div>
    <h2 class="screen-title">${t('enterName')}</h2>
    <p class="story-text">You will be the hero of this story!<br><em>¡Tú serás el héroe de esta historia!</em></p>
    <input id="name-input" type="text" maxlength="15" placeholder="${t('namePh')}">
    <br>
    <button class="btn btn-gold" onclick="saveName()">${t('nameGo')}</button>
  </div>`);
  setTimeout(() => { const inp = document.getElementById('name-input'); if(inp) inp.focus(); }, 100);
}

function saveName() {
  const inp = document.getElementById('name-input');
  const nm = inp ? inp.value.trim() : '';
  playerName = nm || 'Explorer';
  STEPS = buildSteps(playerName);
  nextStep();
}

function renderChapterIntro(s) {
  resBar(s.num > 1);
  const title = s.title[currentLang] || s.title.en;
  const year  = s.year[currentLang]  || s.year.en;
  const rawText = s.text[currentLang] || s.text.en;
  const text  = typeof rawText === 'function' ? rawText({ n: playerName }) : rawText;
  el(`<div class="screen">
    <div class="scene-art">${s.art}</div>
    <div class="chapter-intro-bg">
      <div class="ch-year">📅 ${year}</div>
      <h2>${title}</h2>
      <p>${text}</p>
    </div>
    <br>
    <button class="btn btn-chapter" onclick="nextStep()">${t('next')}</button>
  </div>`);
}

function renderScene(s) {
  resBar(true);
  const title = s.title[currentLang] || s.title.en;
  const rawText = s.text[currentLang] || s.text.en;
  const text  = typeof rawText === 'function' ? rawText({ n: playerName }) : rawText;
  const choiceButtons = s.choices.map((c, i) => {
    const ct = c.text[currentLang] || c.text.en;
    return `<button class="btn btn-choice" onclick="makeChoice(${i})">${c.icon} ${ct}</button>`;
  }).join('');
  el(`<div class="screen">
    <div class="scene-art">${s.art}</div>
    <div class="chapter-badge">Chapter ${s.chapter}</div>
    <h2 class="screen-title">${title}</h2>
    <p class="story-text">${text}</p>
    <div>${choiceButtons}</div>
  </div>`);
}

function makeChoice(idx) {
  const s = STEPS[step];
  const choice = s.choices[idx];
  const result = choice.result;
  // Push a result step right after current
  STEPS.splice(step + 1, 0, { type: 'result', result, chapterNum: s.chapter });
  nextStep();
}

function renderResult(s) {
  resBar(true);
  const r = s.result;
  const rawText = r.text[currentLang] || r.text.en;
  const text = typeof rawText === 'function' ? rawText({ n: playerName }) : rawText;
  const dead = applyChanges(r.changes);
  const changesHtml = Object.entries(r.changes).map(([k,v]) => {
    const icons = { health:'❤️', food:'🌽', joy:'😊', friends:'🤝' };
    const lbl = t(k);
    return `<span class="res-change ${v >= 0 ? 'pos' : 'neg'}">${icons[k]} ${lbl} ${v >= 0 ? '+' : ''}${v}</span>`;
  }).join('');
  el(`<div class="screen">
    <div class="scene-art">${r.art}</div>
    <div class="result-text ${r.good ? '' : 'bad'}">${text}</div>
    <div class="resource-changes">${changesHtml}</div>
    <button class="btn btn-next" onclick="${dead ? 'showGameOver()' : 'nextStep()'}">${dead ? '😢 Oh no...' : t('next')}</button>
  </div>`);
}

function renderEvent(s) {
  resBar(true);
  const title = s.title[currentLang] || s.title.en;
  const rawText = s.text[currentLang] || s.text.en;
  const text  = typeof rawText === 'function' ? rawText({ n: playerName }) : rawText;
  applyChanges(s.changes);
  const changesHtml = Object.entries(s.changes).map(([k,v]) => {
    const icons = { health:'❤️', food:'🌽', joy:'😊', friends:'🤝' };
    return `<span class="res-change ${v >= 0 ? 'pos' : 'neg'}">${icons[k]} ${v >= 0 ? '+' : ''}${v}</span>`;
  }).join('');
  el(`<div class="screen">
    <div class="event-box">
      <div class="event-icon">${s.art}</div>
      <h2 style="color:#1A237E;margin-bottom:10px;">${title}</h2>
      <p>${text}</p>
    </div>
    <div class="resource-changes">${changesHtml}</div>
    <button class="btn btn-next" onclick="nextStep()">${t('next')}</button>
  </div>`);
}

function renderFact(s) {
  resBar(true);
  const title = s.title[currentLang] || s.title.en;
  const text  = s.text[currentLang]  || s.text.en;
  el(`<div class="screen">
    <div class="fact-box">
      <div class="fact-icon">${s.icon}</div>
      <h2 style="color:#5D4037;margin-bottom:10px;">${title}</h2>
      <p>${text}</p>
    </div>
    <button class="btn btn-gold" onclick="nextStep()">${t('next')}</button>
  </div>`);
}

function renderSummary(s) {
  resBar(true);
  const title = s.title[currentLang] || s.title.en;
  el(`<div class="screen">
    <div class="scene-art">⭐</div>
    <h2 class="screen-title">${title}</h2>
    <p class="story-text">${t('chSumSub')}</p>
    <div class="summary-grid">
      <div class="summary-card"><div class="sc-icon">❤️</div><div class="sc-val">${resources.health}</div><div class="sc-lbl">${t('health')}</div></div>
      <div class="summary-card"><div class="sc-icon">🌽</div><div class="sc-val">${resources.food}</div><div class="sc-lbl">${t('food')}</div></div>
      <div class="summary-card"><div class="sc-icon">😊</div><div class="sc-val">${resources.joy}</div><div class="sc-lbl">${t('joy')}</div></div>
      <div class="summary-card"><div class="sc-icon">🤝</div><div class="sc-val">${resources.friends}</div><div class="sc-lbl">${t('friends')}</div></div>
    </div>
    <button class="btn btn-chapter" onclick="nextStep()">${t('nextCh')}</button>
  </div>`);
}

function renderVictory() {
  resBar(false);
  const total = resources.health + resources.food + resources.joy + resources.friends;
  let stars = '⭐⭐⭐';
  if (total >= 280) stars = '🌟🌟🌟🌟🌟';
  else if (total >= 220) stars = '⭐⭐⭐⭐';
  el(`<div class="screen">
    <div class="win-screen">
      <div class="big-emoji">🦅🇲🇽🎊</div>
      <h2>${t('youDid')}<br>¡Lo Lograste!</h2>
      <p>${t('victory', {n: playerName})}</p>
      <br>
      <p style="font-size:24px;margin:10px 0;">${stars}</p>
      <p style="font-size:16px;opacity:0.8;">Final Score: ${total}/400 · Puntuación Final: ${total}/400</p>
    </div>
    <br>
    <button class="btn btn-gold" onclick="resetGame()">${t('playAgain')}</button>
  </div>`);
}

function renderGameOver() {
  resBar(false);
  el(`<div class="screen">
    <div class="lose-screen">
      <div class="big-emoji">😢💔</div>
      <h2>${t('gameOver')}</h2>
      <p>${t('gameOverSub')}</p>
    </div>
    <br>
    <button class="btn btn-primary" onclick="resetGame()">${t('tryAgain')}</button>
  </div>`);
}

// ═══════════════════════════════════════════════
//  NAVIGATION
// ═══════════════════════════════════════════════
function nextStep() {
  step++;
  if (step >= STEPS.length) {
    step = STEPS.length - 1; // safety
  }
  renderCurrentStep();
  window.scrollTo(0, 0);
}

function showGameOver() {
  STEPS.splice(step + 1, 0, { type: 'gameOver' });
  nextStep();
}

function resetGame() {
  resources = { health: 90, food: 80, joy: 70, friends: 60 };
  step = 0;
  playerName = 'Explorer';
  STEPS = buildSteps();
  renderCurrentStep();
}

// ═══════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════
let STEPS = buildSteps();
document.getElementById('top-title').textContent = t('topTitle');
renderCurrentStep();
</script>
</body>
</html>
