<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
if (typeof THREE === 'undefined') {
  document.getElementById('loading').textContent = "Couldn't load the 3D engine. Check your internet and reload.";
  return;
}

// =====================================================================
// Settings (change these numbers to change the game)
// =====================================================================
var LAND_PRICE = 20000;
var APP_REWARD = 22000;
var RENT = 2000;              // rent per day for every property after your 2nd
var WOLF_REWARD = 500;        // tokens for beating a shadow wolf
var MAX_LIVES = 4;
var DAY_LEN = 240;            // seconds of daytime
var NIGHT_LEN = 120;          // seconds of nighttime
var HUNGER_DROP_SECONDS = 4;  // lose 1 hunger every 4 seconds
var WALK = 5, RUN = 8;

var CELL = 22, PLOT = 16;     // one block of land, and the grass plot inside it
var EDGE = 3;                 // everything past this line (behind you at the start) is forest
var VIEW = 4;                 // how many blocks around you are drawn

// The only workshop, grocery and supply shop are in your town
var SPECIAL = { '0,0': 'plaza', '-1,0': 'workshop', '1,0': 'grocery', '0,1': 'supply' };

var FOODS = [
  { name: 'Apple', price: 300, fill: 10 },
  { name: 'Sandwich', price: 900, fill: 35 },
  { name: 'Big dinner', price: 1800, fill: 75 }
];
// Supply shop: every box has a price and how many come inside
var MATS = {
  wood:  { name: 'Wood planks', price: 300, box: 50000 },
  stone: { name: 'Stone blocks', price: 300, box: 50000 },
  glass: { name: 'Glass', price: 300, box: 50000 },
  roof:  { name: 'Roof tiles', price: 300, box: 100000 },
  door:  { name: 'Doors', price: 1, box: 5 }
};
var MAT_ORDER = ['wood', 'stone', 'glass', 'roof', 'door'];
var MAX_BUILD_HEIGHT = 40;
var REACH = 6;
var HOUSE_NAMES = { 1: 'Small house', 2: 'Big house', 3: 'Mansion' };
var COLORS = { Blue: '#378ADD', Green: '#639922', Purple: '#7F77DD', Orange: '#D85A30', Pink: '#D4537E', Black: '#2C2C2A' };
var ROBOT_NAMES = ['Bolt', 'Gizmo', 'Sprocket', 'Beep', 'Widget', 'Cog', 'Zip', 'Rusty'];

// =====================================================================
// Game state (this is what gets saved)
// =====================================================================
function freshState() {
  return { v: 2, tokens: 0, hunger: 100, lives: MAX_LIVES, land: [], houses: {},
    mat: { wood: 0, stone: 0, glass: 0, roof: 0, door: 0 }, bow: true, meat: 0,
    apps: [], robotLots: [], clock: 15, day: 1, x: 0, z: -1.5, yaw: 0, started: false };
}
var state = freshState();

// =====================================================================
// 3D setup
// =====================================================================
var canvas = document.getElementById('game');
var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: false });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
var scene = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(72, 1, 0.1, 260);
camera.rotation.order = 'YXZ';
scene.add(camera);
var SKY_DAY = new THREE.Color(0x8EC5FF), SKY_DUSK = new THREE.Color(0xF2A26B), SKY_NIGHT = new THREE.Color(0x0B1030);
scene.background = SKY_DAY.clone();
scene.fog = new THREE.Fog(0x8EC5FF, 30, 92);
var hemi = new THREE.HemisphereLight(0xffffff, 0x4a5a2a, 0.9); scene.add(hemi);
var sun = new THREE.DirectionalLight(0xfff2cc, 0.7); scene.add(sun); scene.add(sun.target);
var moonLight = new THREE.DirectionalLight(0x8899ff, 0); scene.add(moonLight); scene.add(moonLight.target);

function resize() {
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

// ---------- Pixel textures (the blocky look) ----------
function clamp255(v) { return Math.max(0, Math.min(255, Math.round(v))); }
function shade(hex, k) {
  var n = parseInt(hex.slice(1), 16);
  return 'rgb(' + clamp255(((n >> 16) & 255) + k) + ',' + clamp255(((n >> 8) & 255) + k) + ',' + clamp255((n & 255) + k) + ')';
}
function makeTex(draw) {
  var c = document.createElement('canvas'); c.width = c.height = 16;
  var x = c.getContext('2d'); draw(x);
  var t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
function noise(x, base, v) {
  for (var i = 0; i < 16; i++) for (var j = 0; j < 16; j++) { x.fillStyle = shade(base, (Math.random() - 0.5) * v); x.fillRect(i, j, 1, 1); }
}
var T = {
  grass: makeTex(function (x) { noise(x, '#5DA130', 40); }),
  fgrass: makeTex(function (x) { noise(x, '#3E7A22', 36); }),
  gravel: makeTex(function (x) { noise(x, '#8F8B83', 44); }),
  planks: makeTex(function (x) {
    noise(x, '#B5884E', 18); x.fillStyle = '#7A5A30';
    for (var r = 0; r < 4; r++) { x.fillRect(0, r * 4 + 3, 16, 1); x.fillRect((r % 2) ? 4 : 11, r * 4, 1, 3); }
  }),
  log: makeTex(function (x) { noise(x, '#6B4A2B', 26); x.fillStyle = '#4E3420'; for (var i = 1; i < 16; i += 4) x.fillRect(i, 0, 1, 16); }),
  leaves: makeTex(function (x) {
    noise(x, '#3F8E2A', 50);
    for (var k = 0; k < 40; k++) { x.fillStyle = Math.random() < 0.5 ? '#2C6B1C' : '#58A83A'; x.fillRect(Math.random() * 16 | 0, Math.random() * 16 | 0, 1, 1); }
  }),
  stone: makeTex(function (x) { noise(x, '#8A8A8A', 34); }),
  sbrick: makeTex(function (x) {
    noise(x, '#9A9A96', 24); x.fillStyle = '#6E6E6A';
    x.fillRect(0, 7, 16, 1); x.fillRect(0, 15, 16, 1); x.fillRect(7, 0, 1, 7); x.fillRect(15, 8, 1, 7);
  }),
  brick: makeTex(function (x) {
    noise(x, '#A5503A', 26); x.fillStyle = '#D6CCBC';
    for (var r = 0; r < 4; r++) { x.fillRect(0, r * 4 + 3, 16, 1); var o = (r % 2) ? 0 : 4; x.fillRect(o, r * 4, 1, 3); x.fillRect(o + 8, r * 4, 1, 3); }
  }),
  roof: makeTex(function (x) { noise(x, '#7A3B2E', 22); x.fillStyle = '#5A281E'; for (var r = 0; r < 4; r++) x.fillRect(0, r * 4 + 3, 16, 1); }),
  slate: makeTex(function (x) { noise(x, '#4A5468', 22); x.fillStyle = '#353C4A'; for (var r = 0; r < 4; r++) x.fillRect(0, r * 4 + 3, 16, 1); }),
  water: makeTex(function (x) { noise(x, '#3A7FD5', 30); }),
  metal: makeTex(function (x) { noise(x, '#9AA3AD', 16); })
};
function lam(opts) { return new THREE.MeshLambertMaterial(opts); }
var M = {
  grass: lam({ map: T.grass }), fgrass: lam({ map: T.fgrass }), gravel: lam({ map: T.gravel }),
  planks: lam({ map: T.planks }), log: lam({ map: T.log }), leaves: lam({ map: T.leaves }),
  stone: lam({ map: T.stone }), sbrick: lam({ map: T.sbrick }), brick: lam({ map: T.brick }),
  roof: lam({ map: T.roof }), slate: lam({ map: T.slate }), water: lam({ map: T.water }), metal: lam({ map: T.metal }),
  glass: lam({ color: 0xBFE6FF, transparent: true, opacity: 0.55, depthWrite: false }),
  lamp: lam({ color: 0xFFE9A8, emissive: 0xFFD66B, emissiveIntensity: 0.6 }),
  screen: lam({ color: 0x1D9E75, emissive: 0x5DCAA5, emissiveIntensity: 0.7 }),
  redEye: lam({ color: 0xFF2020, emissive: 0xFF2020, emissiveIntensity: 1 }),
  cyanEye: lam({ color: 0x66F0FF, emissive: 0x66F0FF, emissiveIntensity: 1 })
};
var colorCache = {};
function col(hex) { if (!colorCache[hex]) colorCache[hex] = lam({ color: hex }); return colorCache[hex]; }

// Box shapes whose texture repeats once per block (so nothing looks stretched)
var geoCache = {};
function geo(w, h, d) {
  var key = w + 'x' + h + 'x' + d;
  if (geoCache[key]) return geoCache[key];
  var g = new THREE.BoxGeometry(w, h, d);
  var uv = g.attributes.uv;
  var dims = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
  for (var f = 0; f < 6; f++) for (var v = 0; v < 4; v++) {
    var idx = f * 4 + v;
    uv.setXY(idx, uv.getX(idx) * dims[f][0], uv.getY(idx) * dims[f][1]);
  }
  uv.needsUpdate = true;
  geoCache[key] = g;
  return g;
}

// Words painted on signs
var signCache = {};
function signMat(text, bg, fg) {
  var key = text + bg + fg;
  if (signCache[key]) return signCache[key];
  var c = document.createElement('canvas'); c.width = 512; c.height = 128;
  var x = c.getContext('2d');
  x.fillStyle = bg; x.fillRect(0, 0, 512, 128);
  x.strokeStyle = fg; x.lineWidth = 8; x.strokeRect(8, 8, 496, 112);
  x.fillStyle = fg; x.textAlign = 'center'; x.textBaseline = 'middle';
  var lines = text.split('\n');
  var size = lines.length > 1 ? 40 : 58;
  x.font = 'bold ' + size + 'px Arial, sans-serif';
  lines.forEach(function (l, i) { x.fillText(l, 256, 64 + (i - (lines.length - 1) / 2) * (size + 6)); });
  var t = new THREE.CanvasTexture(c);
  signCache[key] = lam({ map: t });
  return signCache[key];
}

// Simple seeded random numbers, so the same forest grows every time
function rng(a, b) {
  var s = ((a * 73856093) ^ (b * 19349663) ^ 0x9E3779B9) >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// =====================================================================
// Building the world
// =====================================================================
// A chunk is one 22x22 block of the world: a plot of land, a shop, or a piece of forest.
var chunks = {};

function addBox(c, w, h, d, x, y, z, mat, solid) {
  var m = new THREE.Mesh(geo(w, h, d), mat);
  m.position.set(x, y + h / 2, z);
  c.group.add(m);
  if (solid) c.cols.push({ minX: x - w / 2, maxX: x + w / 2, minZ: z - d / 2, maxZ: z + d / 2, top: y + h });
  return m;
}

function addSign(c, text, x, z, w, bg, fg, postH) {
  postH = postH || 1.6;
  addBox(c, 0.18, postH, 0.18, x - w / 2 + 0.3, 0, z, M.planks, false);
  addBox(c, 0.18, postH, 0.18, x + w / 2 - 0.3, 0, z, M.planks, false);
  var h = w / 4;
  addBox(c, w, h, 0.12, x, postH - 0.1, z, M.planks, false);
  var face = new THREE.Mesh(new THREE.PlaneGeometry(w - 0.1, h - 0.1), signMat(text, bg || '#F3E3C0', fg || '#4A2E12'));
  face.position.set(x, postH - 0.1 + h / 2, z + 0.07);
  c.group.add(face);
}

function wallSign(c, text, x, y, z, w, bg, fg) {
  var face = new THREE.Mesh(new THREE.PlaneGeometry(w, w / 4), signMat(text, bg, fg));
  face.position.set(x, y, z);
  c.group.add(face);
}

// A building you can walk inside. The door faces the road in front (+z).
function hollow(c, x, z, w, d, h, wallMat, floorMat, zone) {
  var t = 0.4, door = 2.2, doorH = 3;
  addBox(c, w, 0.1, d, x, 0, z, floorMat, false);
  addBox(c, w, t, d, x, h - t, z, wallMat, false);
  addBox(c, w, h, t, x, 0, z - d / 2 + t / 2, wallMat, true);
  addBox(c, t, h, d, x - w / 2 + t / 2, 0, z, wallMat, true);
  addBox(c, t, h, d, x + w / 2 - t / 2, 0, z, wallMat, true);
  var seg = (w - door) / 2;
  addBox(c, seg, h, t, x - door / 2 - seg / 2, 0, z + d / 2 - t / 2, wallMat, true);
  addBox(c, seg, h, t, x + door / 2 + seg / 2, 0, z + d / 2 - t / 2, wallMat, true);
  addBox(c, door, h - doorH, t, x, doorH, z + d / 2 - t / 2, wallMat, false);
  zone.minX = x - w / 2 + t; zone.maxX = x + w / 2 - t;
  zone.minZ = z - d / 2 + t; zone.maxZ = z + d / 2 - t;
  c.zones.push(zone);
}

function windows(c, x, z, w, d, ys) {
  ys.forEach(function (y) {
    addBox(c, 0.12, 1.4, 1.6, x - w / 2 - 0.03, y, z - d / 5, M.glass, false);
    addBox(c, 0.12, 1.4, 1.6, x + w / 2 + 0.03, y, z - d / 5, M.glass, false);
    addBox(c, 0.12, 1.4, 1.6, x - w / 2 - 0.03, y, z + d / 5, M.glass, false);
    addBox(c, 0.12, 1.4, 1.6, x + w / 2 + 0.03, y, z + d / 5, M.glass, false);
    addBox(c, 1.6, 1.4, 0.12, x - w / 4 - 0.4, y, z + d / 2 + 0.03, M.glass, false);
    addBox(c, 1.6, 1.4, 0.12, x + w / 4 + 0.4, y, z + d / 2 + 0.03, M.glass, false);
  });
}

function steppedRoof(c, x, z, w, d, h, mat) {
  for (var k = 0; ; k++) {
    var rw = w + 1 - k * 2, rd = d + 1 - k * 2;
    if (rw < 1.5 || rd < 1.5) break;
    addBox(c, rw, 0.7, rd, x, h + k * 0.7, z, mat, false);
  }
}

// A blocky person or robot. Faces +z.
function makePerson(shirt, skin, robot) {
  var g = new THREE.Group();
  var body = robot ? M.metal : col(shirt);
  var head = robot ? M.metal : col(skin);
  var legs = [], arms = [];
  [-0.2, 0.2].forEach(function (lx) {
    var lg = new THREE.Group(); lg.position.set(lx, 0.9, 0);
    var lm = new THREE.Mesh(geo(0.3, 0.9, 0.3), robot ? M.metal : col('#3C3489')); lm.position.y = -0.45; lg.add(lm);
    g.add(lg); legs.push(lg);
  });
  var b = new THREE.Mesh(geo(0.8, 0.95, 0.45), body); b.position.y = 1.38; g.add(b);
  [-0.55, 0.55].forEach(function (ax) {
    var ag = new THREE.Group(); ag.position.set(ax, 1.8, 0);
    var am = new THREE.Mesh(geo(0.28, 0.85, 0.28), robot ? M.metal : col(skin)); am.position.y = -0.42; ag.add(am);
    g.add(ag); arms.push(ag);
  });

function buildChunk(i, j) {

function updateChunks(force) {
  var ci = Math.round(player.x / CELL), cj = Math.floor(-player.z / CELL);

// Building with blocks (like Minecraft creative)

// Block types: 1 wood, 2 stone, 3 glass, 4 roof, 5 door (facing one way), 7 door (other way), 6 bed
// 8 and 9 are the top halves of doors.
var BT = { WOOD: 1, STONE: 2, GLASS: 3, ROOF: 4, DOORX: 5, BED: 6, DOORZ: 7, DOORXT: 8, DOORZT: 9 };
var SOLID = { 1: true, 2: true, 3: true, 4: true };

T.door = makeTex(function (x) {
  noise(x, '#8A5A2B', 16); x.fillStyle = '#5A3A1A'; x.fillRect(0, 0, 16, 1); x.fillRect(0, 15, 16, 1); x.fillRect(0, 0, 1, 16); x.fillRect(15, 0, 1, 16);
  x.fillStyle = '#BFE6FF'; x.fillRect(3, 3, 4, 4); x.fillRect(9, 3, 4, 4); x.fillStyle = '#E8C060'; x.fillRect(12, 9, 2, 2);
});

M.door = lam({ map: T.door });
M.bed = lam({ map: T.bed });
M.glassBlock = lam({ color: 0xCFEFFF, transparent: true, opacity: 0.45, depthWrite: false });
var BLOCK_GEO = {
  1: geo(1, 1, 1), 2: geo(1, 1, 1), 3: geo(1, 1, 1), 4: geo(1, 1, 1),
  5: geo(1, 1, 0.18), 8: geo(1, 1, 0.18), 7: geo(0.18, 1, 1), 9: geo(0.18, 1, 1), 6: geo(1, 0.55, 1)
};
var BLOCK_MAT = { 1: M.planks, 2: M.stone, 3: M.glassBlock, 4: M.roof, 5: M.door, 8: M.door, 7: M.door, 9: M.door, 6: M.bed };

var voxels = new Map();     // "x,y,z" -> block type, for all of your land
var plotVox = {};           // land key -> Map(local index -> type)
var blockGroups = {};       // land key -> 3D group
var dirtyPlots = {};

function plotKeyAt(x, z) { return Math.round(x / CELL) + ',' + Math.floor(-z / CELL); }
function plotBounds(key) {
  var p = key.split(','), cx = +p[0] * CELL, cz = -(+p[1] * CELL + CELL / 2);
  return { x0: cx - PLOT / 2, z0: cz - PLOT / 2 };
}
// Can you build in the block at (x, y, z)? Only inside your own land.
function canBuildAt(x, y, z) {
  if (y < 0 || y >= MAX_BUILD_HEIGHT) return null;
  var key = plotKeyAt(x + 0.5, z + 0.5);
  if (state.land.indexOf(key) === -1) return null;
  var b = plotBounds(key);
  if (x < b.x0 || x >= b.x0 + PLOT || z < b.z0 || z >= b.z0 + PLOT) return null;
  return key;
}
function vkey(x, y, z) { return x + ',' + y + ',' + z; }
function getVox(x, y, z) { return voxels.get(vkey(x, y, z)) || 0; }
function setVox(key, x, y, z, t) {
  var b = plotBounds(key);
  var idx = (y * PLOT + (z - b.z0)) * PLOT + (x - b.x0);
  if (!plotVox[key]) plotVox[key] = new Map();
  if (t) { voxels.set(vkey(x, y, z), t); plotVox[key].set(idx, t); }
  else { voxels.delete(vkey(x, y, z)); plotVox[key].delete(idx); }
}
function solidAt(x, y, z) { return !!SOLID[getVox(x, y, z)]; }

// Turn a plot's blocks into short text for saving: 3 characters of position + 1 of type
function encodePlot(key) {
  var out = [], m = plotVox[key];
  if (!m) return '';
  m.forEach(function (t, idx) { out.push(('00' + idx.toString(36)).slice(-3) + t); });
  return out.join('');
}
function decodePlot(key, s) {
  var b = plotBounds(key);
  plotVox[key] = new Map();
  for (var i = 0; i + 4 <= (s || '').length; i += 4) {
    var idx = parseInt(s.substr(i, 3), 36), t = +s.charAt(i + 3);
    if (!t) continue;
    var lx = idx % PLOT, lz = Math.floor(idx / PLOT) % PLOT, y = Math.floor(idx / (PLOT * PLOT));
    setVox(key, b.x0 + lx, y, b.z0 + lz, t);
  }
}

function refreshBlocks(key) {
  if (blockGroups[key]) { scene.remove(blockGroups[key]); blockGroups[key].children.forEach(function (m) { m.dispose && m.dispose(); }); }
  var g = new THREE.Group(), byType = {};
  var b = plotBounds(key), m = plotVox[key];
  if (m) m.forEach(function (t, idx) {
    (byType[t] = byType[t] || []).push([b.x0 + idx % PLOT, Math.floor(idx / (PLOT * PLOT)), b.z0 + Math.floor(idx / PLOT) % PLOT]);
  });
  for (var t in byType) {
    var list = byType[t];
    var inst = new THREE.InstancedMesh(BLOCK_GEO[t], BLOCK_MAT[t], list.length);
    var h = t == BT.BED ? 0.275 : 0.5;
    for (var i = 0; i < list.length; i++) {
      tmpP.set(list[i][0] + 0.5, list[i][1] + h, list[i][2] + 0.5); tmpS.set(1, 1, 1);
      tmpM.compose(tmpP, tmpQ, tmpS); inst.setMatrixAt(i, tmpM);
    }
    inst.frustumCulled = false;
    g.add(inst);
  }

// Find the block you're looking at (a fast "grid walk" along your line of sight)
function raycastBlocks() {
  var o = camera.position, d = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
  var ix = Math.floor(o.x), iy = Math.floor(o.y), iz = Math.floor(o.z);
  var sx = d.x > 0 ? 1 : -1, sy = d.y > 0 ? 1 : -1, sz = d.z > 0 ? 1 : -1;
  var tdx = Math.abs(1 / d.x), tdy = Math.abs(1 / d.y), tdz = Math.abs(1 / d.z);
  var tx = (sx > 0 ? ix + 1 - o.x : o.x - ix) * tdx, ty = (sy > 0 ? iy + 1 - o.y : o.y - iy) * tdy, tz = (sz > 0 ? iz + 1 - o.z : o.z - iz) * tdz;
  var n = [0, 0, 0], t = 0;
  for (var step = 0; step < 64; step++) {
    if (iy < 0) return { x: ix, y: iy, z: iz, n: n, ground: true, dir: d };
    var v = getVox(ix, iy, iz);
    if (v) return { x: ix, y: iy, z: iz, n: n, type: v, dir: d };
    if (tx < ty && tx < tz) { t = tx; ix += sx; tx += tdx; n = [-sx, 0, 0]; }
    else if (ty < tz) { t = ty; iy += sy; ty += tdy; n = [0, -sy, 0]; }
    else { t = tz; iz += sz; tz += tdz; n = [0, 0, -sz]; }
    if (t > REACH) return null;
  }
  return null;
}

var outline = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1.01, 1.01, 1.01)), new THREE.LineBasicMaterial({ color: 0x111111 }));
outline.visible = false;

var target = null;
function updateTarget() {
  target = null; outline.visible = false;
  if (player.z > EDGE || modalOpen) return;
  var hit = raycastBlocks();
  if (!hit) return;
  if (hit.ground) {
    var py = 0;
    if (!canBuildAt(hit.x, py, hit.z)) return;
    target = { place: [hit.x, 0, hit.z], dir: hit.dir };
    outline.position.set(hit.x + 0.5, 0.01, hit.z + 0.5); outline.scale.set(1, 0.02, 1);
  } else {
    var key = canBuildAt(hit.x, hit.y, hit.z);
    if (!key) return;
    target = { block: [hit.x, hit.y, hit.z], type: hit.type, key: key,
      place: [hit.x + hit.n[0], hit.y + hit.n[1], hit.z + hit.n[2]], dir: hit.dir };
    outline.position.set(hit.x + 0.5, hit.y + 0.5, hit.z + 0.5); outline.scale.set(1, 1, 1);
  }
  outline.visible = true;
}

var lastBuildWarn = 0;

function placeBlock() {
  if (modalOpen) return;

  if (!target) { buildWarn(player.z > EDGE ? "You can't build in the forest." : 'You can only build on your own land. Look at the ground or a block on your land.'); return; }
  var p = target.place, key = canBuildAt(p[0], p[1], p[2]);
  if (!key) { buildWarn('You can only build inside your own land.'); return; }

// Your bow, shown in your hand
var bowModel = new THREE.Group();

function blockedByVoxels(x, z) {
  var x0 = Math.floor(x - RADIUS), x1 = Math.floor(x + RADIUS - 1e-6), z0 = Math.floor(z - RADIUS), z1 = Math.floor(z + RADIUS - 1e-6);
  var y0 = Math.floor(player.y + 0.05), y1 = Math.floor(player.y + 1.75);

  return false;
}
function voxelGround(x, z) {
  var best = 0;
  var x0 = Math.floor(x - RADIUS), x1 = Math.floor(x + RADIUS - 1e-6), z0 = Math.floor(z - RADIUS), z1 = Math.floor(z + RADIUS - 1e-6);
  var top = Math.min(MAX_BUILD_HEIGHT, Math.floor(player.y + 0.3));
  for (var ix = x0; ix <= x1; ix++) for (var iz = z0; iz <= z1; iz++)
    for (var iy = top - 1; iy >= 0; iy--) if (solidAt(ix, iy, iz)) { best = Math.max(best, iy + 1); break; }
  return best;
}
function blocked(x, z) {
  if (voxels.size && blockedByVoxels(x, z)) return true;
  for (var k in chunks) {
    var cs = chunks[k].cols;
    for (var i = 0; i < cs.length; i++) {
      var b = cs[i];

      if (x + RADIUS > b.minX && x - RADIUS < b.maxX && z + RADIUS > b.minZ && z - RADIUS < b.maxZ) return true;
    }
  }

}
function groundAt(x, z) {

  for (var k in chunks) {
    var cs = chunks[k].cols;
    for (var i = 0; i < cs.length; i++) {
      var b = cs[i];
      if (b.top <= 1.2 && player.y >= b.top - 0.3 && x + RADIUS > b.minX && x - RADIUS < b.maxX && z + RADIUS > b.minZ && z - RADIUS < b.maxZ)

window.addEventListener('keydown', function (e) {

var dragButton = 0;
canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

// Touch: joystick on the left, drag anywhere else to look

function spawnAround(minR, maxR, minZ) {
  for (var tries = 0; tries < 10; tries++) {
    var a = Math.random() * Math.PI * 2, r = minR + Math.random() * (maxR - minR);
    var x = player.x + Math.cos(a) * r, z = player.z + Math.sin(a) * r;
    if (z > minZ) return { x: x, z: z };
  }
  return null;
}

function isNight() { return state.clock >= DAY_LEN; }

var spawnTimer = 0;
function updateSpawns(dt) {
  spawnTimer -= dt;
  if (spawnTimer > 0) return;
  spawnTimer = 1;
  // Remove things that are far away
  animals = animals.filter(function (a) { if (dist2(a.mesh.position) > 75 * 75) { scene.remove(a.mesh); return false; } return true; });
  wolves = wolves.filter(function (w) { if (dist2(w.mesh.position) > 75 * 75) { scene.remove(w.mesh); return false; } return true; });
  if (player.z < EDGE - 10) return;
  if (animals.length < 8) {
    var p = spawnAround(14, 38, EDGE + 6);
    if (p) {
      var type = Math.random() < 0.55 ? 'pig' : 'deer';
      var m = makeAnimal(type); m.position.set(p.x, 0, p.z); scene.add(m);
      animals.push({ mesh: m, type: type, dir: Math.random() * 6.28, timer: 2, speed: type === 'deer' ? 2.2 : 1.4 });
    }
  }
  var depth = Math.max(0, player.z - EDGE);
  var maxWolves = (isNight() ? 4 : 1) + Math.floor(depth / 120);
  if (player.z > EDGE + 8 && wolves.length < maxWolves && Math.random() < (isNight() ? 0.5 : 0.15)) {
    var q = spawnAround(24, 40, EDGE + 18);
    if (q) {
      var wm = makeWolf(); wm.position.set(q.x, 0, q.z); scene.add(wm);
      wolves.push({ mesh: wm, hp: 2, dir: Math.random() * 6.28, timer: 2 });
    }
  }
}

function dist2(p) { var dx = p.x - player.x, dz = p.z - player.z; return dx * dx + dz * dz; }

function animateLegs(m, speed, dt) {
  var u = m.userData; u.step += dt * speed * 3;
  var s = Math.sin(u.step) * 0.6 * Math.min(1, speed);
  u.legs.forEach(function (l, i) { l.rotation.x = (i % 2 === (i < 2 ? 0 : 1)) ? s : -s; });
  if (u.arms) u.arms.forEach(function (a, i) { a.rotation.x = i ? s : -s; });
}

function moveCritter(o, dt, speed, minZ) {
  var p = o.mesh.position;
  var nx = p.x + Math.sin(o.dir) * speed * dt, nz = p.z + Math.cos(o.dir) * speed * dt;
  if (nz < minZ) { nz = minZ; o.dir = Math.random() * 3 - 1.5; }
  p.x = nx; p.z = nz;
  o.mesh.rotation.y = o.dir;
  animateLegs(o.mesh, speed, dt);
}

function updateCritters(dt) {
  animals.forEach(function (a) {
    a.timer -= dt;
    var d2 = dist2(a.mesh.position);
    if (d2 < 36) { a.dir = Math.atan2(a.mesh.position.x - player.x, a.mesh.position.z - player.z); a.timer = 1.5; moveCritter(a, dt, a.speed * 2, EDGE + 5); return; }
    if (a.timer <= 0) { a.timer = 2 + Math.random() * 3; a.dir = Math.random() * 6.28; a.still = Math.random() < 0.35; }
    if (a.still) animateLegs(a.mesh, 0, dt); else moveCritter(a, dt, a.speed, EDGE + 5);
  });
  var night = isNight();
  wolves.forEach(function (w) {
    var p = w.mesh.position;
    var d2 = dist2(p), chase = night ? 32 : 18;
    var playerInForest = player.z > EDGE;
    if (playerInForest && d2 < chase * chase) {
      w.dir = Math.atan2(player.x - p.x, player.z - p.z);
      moveCritter(w, dt, night ? 4.4 : 3.6, EDGE + 1.5);
      if (d2 < 1.3 * 1.3 && player.hurtTimer <= 0 && !modalOpen) loseLife('A shadow wolf got you!');
    } else {
      w.timer -= dt;
      if (w.timer <= 0) { w.timer = 2 + Math.random() * 2; w.dir = Math.random() * 6.28; }
      moveCritter(w, dt, 1.6, EDGE + 1.5);
    }

}

// Robots walk along the streets of the town
var INTER = function (a, b) { return { x: a * CELL + CELL / 2, z: -b * CELL }; };
function spawnRobot(i) {
  var m = makePerson('#9AA3AD', '#9AA3AD', true);
  var a = Math.round(player.x / CELL) + Math.floor(Math.random() * 7) - 3;
  var b = Math.max(0, Math.floor(-player.z / CELL) + Math.floor(Math.random() * 5) - 2);
  var p = INTER(a, b);
  m.position.set(p.x, 0, p.z);
  scene.add(m);
  return { mesh: m, a: a, b: b, ta: a, tb: b, name: ROBOT_NAMES[i % ROBOT_NAMES.length] };
}
function updateRobots(dt) {
  while (robots.length < 8) robots.push(spawnRobot(robots.length));
  robots.forEach(function (r, idx) {
    var p = r.mesh.position;
    if (dist2(p) > 95 * 95) { scene.remove(r.mesh); robots[idx] = spawnRobot(idx); return; }
    var t = INTER(r.ta, r.tb);
    var dx = t.x - p.x, dz = t.z - p.z, d = Math.sqrt(dx * dx + dz * dz);
    if (d < 0.1) {
      r.a = r.ta; r.b = r.tb;
      var opts = [[1, 0], [-1, 0], [0, 1], [0, -1]].filter(function (o) { return r.b + o[1] >= 0; });
      var o = opts[Math.floor(Math.random() * opts.length)];
      r.ta = r.a + o[0]; r.tb = r.b + o[1];
      return;
    }
    var step = Math.min(d, 2.2 * dt);
    p.x += dx / d * step; p.z += dz / d * step;
    r.mesh.rotation.y = Math.atan2(dx, dz);

  });
}

var arrowGeo = geo(0.06, 0.06, 0.9), arrowMat = col('#C9A46A');
function shoot() {
  if (modalOpen) return;
  var dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
  var m = new THREE.Mesh(arrowGeo, arrowMat);
  m.position.copy(camera.position).addScaledVector(dir, 0.6);

  arrows.push({ mesh: m, vel: dir.multiplyScalar(42), life: 3, stuck: false });
}
var tmpV = new THREE.Vector3();
function updateArrows(dt) {
  arrows = arrows.filter(function (ar) {
    ar.life -= dt;
    if (ar.life <= 0) { scene.remove(ar.mesh); return false; }
    if (ar.stuck) return true;
    ar.vel.y -= 9.8 * dt;
    ar.mesh.position.addScaledVector(ar.vel, dt);
    tmpV.copy(ar.mesh.position).add(ar.vel);
    ar.mesh.lookAt(tmpV);

        return false;
      }
    }
    for (var j = 0; j < wolves.length; j++) {

        w.mesh.position.x += ar.vel.x * 0.04; w.mesh.position.z += ar.vel.z * 0.04;
        if (w.hp <= 0) {

        } else toast('Hit! One more arrow!');

}

// =====================================================================
// Day and night
// =====================================================================
var lastNight = null;
function updateSky(dt) {
  if (!modalOpen) state.clock += dt;
  if (state.clock >= DAY_LEN + NIGHT_LEN) { state.clock -= DAY_LEN + NIGHT_LEN; newDay(); }
  var night = isNight();
  if (lastNight !== null && night !== lastNight) toast(night ? "It's nighttime! The forest gets more dangerous." : 'Good morning!');
  lastNight = night;

  var sky = new THREE.Color();
  var t, light;
  if (!night) {
    t = state.clock / DAY_LEN;
    var edge = Math.min(t, 1 - t) * 10;
    sky.copy(SKY_DUSK).lerp(SKY_DAY, Math.min(1, edge));
    light = 0.45 + 0.5 * Math.min(1, edge);
  } else {
    t = (state.clock - DAY_LEN) / NIGHT_LEN;
    var e2 = Math.min(t, 1 - t) * 10;
    sky.copy(SKY_DUSK).lerp(SKY_NIGHT, Math.min(1, e2));
    light = 0.45 - 0.2 * Math.min(1, e2);
  }
  scene.background.copy(sky);
  scene.fog.color.copy(sky);
  hemi.intensity = light;
  var ang = night ? Math.PI * (1 + t) : Math.PI * t;
  var sx = Math.cos(ang) * 120, sy = Math.sin(ang) * 120;
  sunBox.position.set(player.x + sx, (night ? -1 : 1) * Math.abs(sy) + 10, player.z - 60);
  moonBox.position.set(player.x - sx, (night ? 1 : -1) * Math.abs(sy) + 10, player.z - 60);
  sunBox.lookAt(camera.position); moonBox.lookAt(camera.position);
  sunBox.visible = !night; moonBox.visible = night;
  sun.intensity = night ? 0 : 0.6 * Math.max(0.2, Math.sin(ang));
  sun.position.set(player.x + sx, Math.abs(sy) + 5, player.z + 30); sun.target.position.set(player.x, 0, player.z);
  moonLight.intensity = night ? 0.3 : 0;
  moonLight.position.set(player.x - 40, 80, player.z + 20); moonLight.target.position.set(player.x, 0, player.z);
  var lampGlow = night ? 1.2 : 0.3;
  M.lamp.emissiveIntensity = lampGlow;
}

function clockText() {
  var left, label;
  if (isNight()) { left = DAY_LEN + NIGHT_LEN - state.clock; label = 'Day in '; }
  else { left = DAY_LEN - state.clock; label = 'Night in '; }
  left = Math.max(0, Math.ceil(left));
  return label + Math.floor(left / 60) + ':' + ('0' + (left % 60)).slice(-2);
}

function newDay() {
  state.day++;
  var msgs = [];
  if (state.lives < MAX_LIVES) { state.lives++; msgs.push('You got a life back.'); }
  var extra = Math.max(0, state.land.length - 2);
  if (extra > 0) {
    var cost = extra * RENT;
    if (state.tokens >= cost) { state.tokens -= cost; msgs.push('You paid ' + fmt(cost) + ' tokens rent.'); }
    else { state.tokens = 0; msgs.push("You couldn't pay all your rent!"); }
  }
  // A robot buys some land
  var ci = player.z < EDGE ? Math.round(player.x / CELL) : 0;
  for (var tries = 0; tries < 30; tries++) {
    var i = ci + Math.floor(Math.random() * 13) - 6, j = Math.floor(Math.random() * 8);
    var key = i + ',' + j;
    if (SPECIAL[key] || lotOwner(key)) continue;
    state.robotLots.push(key);
    if (state.robotLots.length > 60) state.robotLots.shift();
    rebuildChunk(key);
    msgs.push('Robot ' + ROBOT_NAMES[Math.floor(Math.random() * ROBOT_NAMES.length)] + ' bought some land.');
    break;
  }
  toast('Day ' + state.day + '! ' + msgs.join(' '));
  saveNow();
}

// =====================================================================
// Lives and going home
// =====================================================================
function homeSpot() {
  var withHouse = state.land.filter(function (k) { return state.houses[k]; });
  var key = withHouse[0] || state.land[0];
  if (!key) return { x: 0, z: -1.5, yaw: 0 };
  var p = key.split(','), cx = +p[0] * CELL, cz = -(+p[1] * CELL + CELL / 2);
  return { x: cx, z: cz + PLOT / 2 + 1.2, yaw: 0 };
}
function goHome() {
  if (modalOpen) return;
  var h = homeSpot();
  player.x = h.x; player.z = h.z; player.y = 0; player.vy = 0; player.yaw = h.yaw; player.pitch = 0;
  updateChunks(true);
  toast(state.land.length ? "You're home!" : "You don't own land yet, so you're back in the town square.");
}
function loseLife(why) {
  state.lives--;
  player.hurtTimer = 3;
  wolves.forEach(function (w) { scene.remove(w.mesh); }); wolves = [];
  if (state.lives <= 0) {
    saveNow();
    openModal('<h2>Game over</h2><p>' + esc(why) + " You're out of lives.</p><p>Start a new game and try again!</p>" +
      '<div class="row"><button class="btn main" id="restart">Start a new game</button></div>');
    document.getElementById('restart').onclick = function () {
      robots.forEach(function (r) { scene.remove(r.mesh); }); robots = [];
      animals.forEach(function (a) { scene.remove(a.mesh); }); animals = [];
      state.land.forEach(function (k) { plotVox[k] = new Map(); dirtyPlots[k] = true; if (blockGroups[k]) scene.remove(blockGroups[k]); });
      voxels.clear(); blockGroups = {};
      state = freshState(); state.started = true;
      for (var k in chunks) removeChunk(k);
      player.x = 0; player.z = -1.5; player.yaw = 0;
      updateChunks(true); saveNow(); closeModal();
    };
    return;
  }
  var h = homeSpot();
  player.x = h.x; player.z = h.z; player.y = 0; player.vy = 0; player.yaw = 0;
  updateChunks(true);
  toast(why + ' You lost a life. ' + state.lives + (state.lives === 1 ? ' life' : ' lives') + ' left.');
  saveNow();
}

// =====================================================================
// What's around you (what the E button does)
// =====================================================================
function getSpot() {
  for (var k in chunks) {
    var zs = chunks[k].zones;
    for (var i = 0; i < zs.length; i++) {
      var z = zs[i];
      if (player.x > z.minX && player.x < z.maxX && player.z > z.minZ && player.z < z.maxZ) return z;
    }
  }
  if (player.z > EDGE) return { type: 'forest' };
  var ci = Math.round(player.x / CELL), cj = Math.floor(-player.z / CELL);
  var key = ci + ',' + cj, cx = ci * CELL, cz = -(cj * CELL + CELL / 2);
  if (SPECIAL[key]) return null;
  if (Math.abs(player.x - cx) < PLOT / 2 && Math.abs(player.z - cz) < PLOT / 2)
    return { type: 'lot', key: key, owner: lotOwner(key), level: state.houses[key] || 0 };
  return null;
}

var promptEl = document.getElementById('prompt'), useBtn = document.getElementById('useBtn');
var currentAction = null, lastPromptKey = '';
function updatePrompt() {
  var s = getSpot(), text = '', act = null, label = '';
  if (s) {
    if (s.type === 'workshop') { text = 'The workshop. Talk to the builder to make an app.'; label = 'Build an app'; act = openWorkshop; }
    else if (s.type === 'grocery') { text = 'The grocery store.'; label = 'Buy food'; act = openGrocery; }
    else if (s.type === 'supply') { text = 'The supply shop: building materials and bows.'; label = 'Buy supplies'; act = openSupply; }
    else if (s.type === 'house' && s.owner === 'me') { text = 'Your ' + HOUSE_NAMES[s.level].toLowerCase() + '.'; label = 'Relax'; act = openRelax; }
    else if (s.type === 'house') { text = "A robot lives here. It's not your house!"; }
    else if (s.type === 'lot' && !s.owner) { text = 'This land is for sale.'; label = 'Buy land (20,000)'; act = function () { openBuyLand(s.key); }; }
    else if (s.type === 'lot' && s.owner === 'robot') { text = 'A robot owns this land.'; }
    else if (s.type === 'lot') { text = isTouch ? 'Your land! Pick a block below, aim, and tap Place or Break.' : 'Your land! Pick a block (1-7). Right-click places, left-click breaks.'; }
    else if (s.type === 'forest') {
      var far = Math.round(player.z - EDGE);
      text = 'The forest. Town is ' + far + ' steps back.' + (isNight() ? ' Watch out, it\'s night!' : '') + ' Lost? Press Home.';
    }
  } else if (player.hunger <= 0) text = "You're starving! Go eat something.";
  if (target && target.block && (target.type === BT.BED)) { text = 'Your bed.'; label = 'Sleep or relax'; act = openRelax; }
  if (state.hunger <= 0) text = "You're starving and slow! Eat something. " + text;
  currentAction = act;
  var key = text + '|' + label;
  if (key === lastPromptKey) return;
  lastPromptKey = key;
  promptEl.textContent = text; promptEl.style.display = text ? 'block' : 'none';
  if (act) { useBtn.textContent = label + (isTouch ? '' : '  (E)'); useBtn.style.display = 'block'; }
  else useBtn.style.display = 'none';
}
useBtn.addEventListener('click', function () { doAction(); });
function doAction() { if (!modalOpen && currentAction) currentAction(); }

function esc(s) {

// ---------- Workshop ----------
var QUESTIONS = [
  { k: 'name', q: "What's your app called?", ph: 'Dog Feeder' },
  { k: 'does', q: 'What does your app do?', ph: 'Reminds me to feed my dog' },
  { k: 'who', q: 'Who is it for?', ph: 'Me and my family' },
  { k: 'feature', q: "What's the most important button or feature?", ph: 'A big "Fed" button' },
  { k: 'color', q: 'What color should it be?', choices: Object.keys(COLORS) }
];
var draft = {};
function openWorkshop() {
  draft = {};
  openModal('<h2>Workshop</h2><p>"Hi! I\'m the builder. Tell me about the app you want to make, and I\'ll help you build it. ' +
    'When it\'s done, you earn <b>' + fmt(APP_REWARD) + ' tokens</b>."</p>' +
    '<div class="row"><button class="btn main" id="startApp">Start a new app</button><button class="btn" id="leave">Leave</button></div>');
  bind('startApp', function () { askQuestion(0); }); bind('leave', closeModal);
}
function askQuestion(n) {
  if (n >= QUESTIONS.length) { buildApp(); return; }
  var Q = QUESTIONS[n];
  var body = '<p class="small">Question ' + (n + 1) + ' of ' + QUESTIONS.length + '</p><h2>' + esc(Q.q) + '</h2>';
  if (Q.choices) {
    body += '<div class="row" id="choices">';
    Q.choices.forEach(function (c) { body += '<button class="btn" data-c="' + c + '"><span class="swatch" style="background:' + COLORS[c] + '"></span>' + c + '</button>'; });
    body += '</div>';
  } else body += '<input id="answer" maxlength="50" placeholder="' + esc(Q.ph) + '" value="' + esc(draft[Q.k] || '') + '">';
  body += '<div class="err" id="err"></div><div class="row">' + (n > 0 ? '<button class="btn" id="back">Back</button>' : '') +
    '<button class="btn main" id="next">' + (n === QUESTIONS.length - 1 ? 'Build it!' : 'Next') + '</button><button class="btn" id="leave">Leave</button></div>';
  openModal(body);
  var err = document.getElementById('err');
  if (Q.choices) {
    var btns = modal.querySelectorAll('#choices .btn');
    btns.forEach(function (b) {
      if (draft[Q.k] === b.getAttribute('data-c')) b.classList.add('picked');
      b.onclick = function () { btns.forEach(function (x) { x.classList.remove('picked'); }); b.classList.add('picked'); draft[Q.k] = b.getAttribute('data-c'); err.textContent = ''; };
    });
  } else {
    var input = document.getElementById('answer');
    setTimeout(function () { input.focus(); }, 50);
    input.oninput = function () { err.textContent = ''; };
    input.onkeydown = function (e) { e.stopPropagation(); if (e.key === 'Enter') document.getElementById('next').click(); };
    input.onkeyup = function (e) { e.stopPropagation(); };
  }
  bind('next', function () {
    if (!Q.choices) draft[Q.k] = document.getElementById('answer').value.trim();
    if (!draft[Q.k]) { err.textContent = Q.choices ? 'Pick a color first' : 'Type an answer first'; return; }
    askQuestion(n + 1);
  });
  bind('back', function () { if (!Q.choices) draft[Q.k] = document.getElementById('answer').value.trim(); askQuestion(n - 1); });
  bind('leave', closeModal);
}
function buildApp() {
  var steps = ['Drawing the screens…', 'Writing the code…', 'Adding the ' + draft.feature + '…', 'Fixing bugs…', 'Testing every button…', 'Done!'];
  openModal('<h2>Building ' + esc(draft.name) + '</h2><p id="buildStep">' + esc(steps[0]) + '</p><div class="progress"><div id="buildBar"></div></div>');
  var i = 0;
  var timer = setInterval(function () {
    i++;
    var bar = document.getElementById('buildBar');
    if (!bar) { clearInterval(timer); return; }
    bar.style.width = Math.min(100, i / (steps.length - 1) * 100) + '%';
    document.getElementById('buildStep').textContent = steps[Math.min(i, steps.length - 1)];
    if (i >= steps.length - 1) { clearInterval(timer); setTimeout(finishApp, 600); }
  }, 800);
}
function finishApp() {
  var app = { name: draft.name, does: draft.does, who: draft.who, feature: draft.feature, color: draft.color };
  state.apps.push(app);
  if (state.apps.length > 20) state.apps.shift();
  state.appsMade = (state.appsMade || 0) + 1;
  state.tokens += APP_REWARD;
  saveNow();
  openModal('<h2>Your app is finished!</h2><p>You earned <b>' + fmt(APP_REWARD) + ' tokens</b>.</p>' + appCard(app) +
    '<div class="row"><button class="btn main" id="another">Build another</button><button class="btn" id="leave">Leave the workshop</button></div>');
  bind('another', function () { draft = {}; askQuestion(0); }); bind('leave', closeModal);
}
function appCard(a) {
  return '<div class="appcard" style="border-left:6px solid ' + (COLORS[a.color] || '#888') + '"><div class="name">' + esc(a.name) + '</div>' +
    '<div class="small">' + esc(a.does) + '</div><div class="small">For: ' + esc(a.who) + ' · Main feature: ' + esc(a.feature) + '</div></div>';
}

// Saving
// =====================================================================
var hasServer = typeof google !== 'undefined' && google.script && google.script.run;
var saveTimer = null;
function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 1500); }
function saveNow() {
  state.x = Math.round(player.x * 10) / 10; state.z = Math.round(player.z * 10) / 10; state.yaw = Math.round(player.yaw * 100) / 100;
  state.hunger = Math.round(state.hunger * 10) / 10; state.clock = Math.round(state.clock);
  var json = JSON.stringify(state);
  while (json.length > 8800 && state.apps.length) { state.apps.shift(); json = JSON.stringify(state); }
  if (hasServer) google.script.run.saveGame(json);
  else { try { localStorage.setItem('appBuilderTownSave', json); } catch (e) {} }
  for (var k in dirtyPlots) {
    var data = encodePlot(k);
    if (hasServer) google.script.run.saveBlocks(k, data);
    else { try { localStorage.setItem('abtBlocks_' + k, data); } catch (e) {} }
  }
  dirtyPlots = {};
}
function applySave(json) {
  if (!json) return;
  try {
    var d = JSON.parse(json), s = freshState();
    if (d.v !== 2) {
      // Coming from version 1: keep your tokens and apps, and refund land (the map changed)
      s.tokens = (d.tokens || 0) + ((d.land && d.land.length) || 0) * LAND_PRICE;
      s.apps = d.apps || []; s.started = !!d.started;
      state = s;
      return;
    }
    for (var k in s) if (k in d) s[k] = d[k];
    s.appsMade = d.appsMade; s.bow = true;
    for (var m in freshState().mat) if (typeof s.mat[m] !== 'number') s.mat[m] = 0;
    state = s;
  } catch (e) {}
}
function loadThenStart() {
  if (hasServer) {
    google.script.run.withSuccessHandler(function (json) {
      applySave(json);
      google.script.run.withSuccessHandler(function (all) { loadAllBlocks(all || {}); start(); }).withFailureHandler(function () { start(); }).loadBlocks(state.land);
    }).withFailureHandler(function () { start(); }).loadGame();
  } else {
    var json = '';
    try { json = localStorage.getItem('appBuilderTownSave') || ''; } catch (e) {}
    applySave(json);
    var all = {};
    state.land.forEach(function (k) { try { all[k] = localStorage.getItem('abtBlocks_' + k) || ''; } catch (e) {} });
    loadAllBlocks(all); start();
  }
}
function loadAllBlocks(all) { for (var k in all) { decodePlot(k, all[k]); refreshBlocks(k); } }
function loadNewPlot(key) {
  // If you owned this land before (in an old game), its old blocks are cleared
  plotVox[key] = new Map(); dirtyPlots[key] = true; saveSoon();
}

// =====================================================================
// Main loop
// =====================================================================
var fwd = new THREE.Vector3(), lastT = performance.now(), saveClock = 0, promptClock = 0;
function loop(now) {
  var dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (!modalOpen) {
    // Turning with arrow keys
    if (keys['arrowleft']) player.yaw += 2.2 * dt;
    if (keys['arrowright']) player.yaw -= 2.2 * dt;
    if (keys['i']) player.pitch = Math.min(1.45, player.pitch + 1.6 * dt);
    if (keys['k']) player.pitch = Math.max(-1.45, player.pitch - 1.6 * dt);
    var mx = 0, mz = 0;
    if (keys['w'] || keys['arrowup']) mz += 1;
    if (keys['s'] || keys['arrowdown']) mz -= 1;
    if (keys['a']) mx -= 1;
    if (keys['d']) mx += 1;
    if (joyId !== null) { mx += joyX; mz -= joyY; }
    if (keys[' ']) jump();
    var len = Math.sqrt(mx * mx + mz * mz);
    if (len > 0) {
      if (len > 1) { mx /= len; mz /= len; }
      var speed = (keys['shift'] || (joyId !== null && len > 0.95)) ? RUN : WALK;
      if (state.hunger <= 0) speed *= 0.5;
      var sy = Math.sin(player.yaw), cy = Math.cos(player.yaw);
      var vx = (-sy * mz + cy * mx) * speed * dt, vz = (-cy * mz - sy * mx) * speed * dt;
      if (!blocked(player.x + vx, player.z)) player.x += vx;
      if (!blocked(player.x, player.z + vz)) player.z += vz;
    }
    // Gravity and jumping
    player.vy -= 18 * dt;
    player.y += player.vy * dt;
    if (player.vy > 0 && voxels.size) {
      var hy = Math.floor(player.y + 1.85);
      for (var cx2 = Math.floor(player.x - RADIUS); cx2 <= Math.floor(player.x + RADIUS); cx2++)
        for (var cz2 = Math.floor(player.z - RADIUS); cz2 <= Math.floor(player.z + RADIUS); cz2++)
          if (solidAt(cx2, hy, cz2)) player.vy = 0;
    }
    var g = groundAt(player.x, player.z);
    if (player.y <= g) { player.y = g; player.vy = 0; player.onGround = true; }
    player.hurtTimer -= dt;
    state.hunger = Math.max(0, state.hunger - dt / HUNGER_DROP_SECONDS);

    updateSpawns(dt);
    updateCritters(dt);
    updateRobots(dt);
    updateArrows(dt);
  }
  updateSky(dt);
  updateChunks(false);
  placeGround();

  camera.position.set(player.x, player.y + EYE, player.z);
  camera.rotation.set(player.pitch, player.yaw, 0);
  camera.updateMatrixWorld();
  updateTarget();

  promptClock -= dt;
  if (promptClock <= 0) { promptClock = 0.15; updatePrompt(); updateHud(); }
  saveClock += dt;
  if (saveClock > 10) { saveClock = 0; saveNow(); }

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

function start() {
  player.x = state.x; player.z = state.z; player.yaw = state.yaw || 0;
  updateChunks(true);
  updateHotbar();
  document.getElementById('loading').style.display = 'none';
  if (!state.started) {
    state.started = true;
    openModal('<h2>Welcome to Appsnapp 1.0!</h2>' +
      '<p>Build apps at the <b>Workshop</b> to earn tokens. Buy food at the <b>Grocery</b>, and land, building supplies and a bow at the <b>Supply Shop</b>.</p>' +
      '<p>Buy land, then build your house yourself, block by block, like Minecraft creative. The town is always safe. The forest behind you has animals to hunt, but shadow wolves hunt <i>you</i>, especially at night. You have 4 lives.</p>' +
      '<p class="small">' + controlsText() + '</p>' +
      '<div class="row"><button class="btn main" id="go">Let\'s go!</button></div>');
    bind('go', closeModal);
    saveNow();
  }
  lastT = performance.now();
  requestAnimationFrame(loop);
}

// For testing in a browser console
window.__game = { place: placeBlock, brk: breakBlock, sel: selectSlot, target: function () { return target; }, voxels: voxels, state: function () { return state; }, player: player, chunks: chunks, getSpot: getSpot, newDay: newDay, wolves: function () { return wolves; }, animals: function () { return animals; } };

loadThenStart();
})();
</script>
