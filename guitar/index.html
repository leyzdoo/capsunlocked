<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0907">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<title>The Set · Caps Unlocked</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Caveat:wght@500;700&family=Special+Elite&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --floor:#0b0907; --paper:#f3ecdc; --paper2:#e9dfc8;
    --marker:#191714; --pen:#1f2a52; --pencil:#6d675c;
    --amber:#e8b45a; --amber-dim:#9c7a3f; --rust:#c24f36; --sage:#7fa36f;
    --chalk:#cfc6b4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  html{overflow-x:hidden;}
  body{background:var(--floor);color:var(--chalk);font-family:'Source Serif 4',Georgia,serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  button,input,textarea{font:inherit;color:inherit;}
  button{cursor:pointer;-webkit-tap-highlight-color:transparent;}
  :focus-visible{outline:2px solid var(--amber);outline-offset:3px;}
  [hidden]{display:none!important;}

  /* ===================== THE STAGE FLOOR ===================== */
  .floor{
    position:relative;min-height:100svh;padding:72px 20px 130px;overflow:hidden;
    background:
      radial-gradient(ellipse 60% 50% at 50% 38%, rgba(255,214,150,0.16), rgba(0,0,0,0) 70%),
      repeating-linear-gradient(90deg, rgba(0,0,0,0) 0 118px, rgba(0,0,0,0.55) 118px 120px),
      repeating-linear-gradient(90deg, #15100b 0 40px, #18120c 40px 80px, #130e0a 80px 120px),
      #120d09;
  }
  .home{position:absolute;top:18px;left:20px;z-index:3;font-family:'Caveat',cursive;font-weight:700;font-size:1.3rem;color:var(--chalk);text-decoration:none;opacity:0.75;}
  .home:hover{opacity:1;}
  .gaff{
    position:absolute;height:34px;width:120px;z-index:2;
    background:linear-gradient(180deg,#2c2b29,#1f1e1c);
    box-shadow:0 1px 2px rgba(0,0,0,0.6);
    clip-path:polygon(0 6%,3% 0,6% 10%,9% 0,100% 0,97% 15%,100% 32%,97% 50%,100% 68%,97% 84%,100% 100%,0 100%,3% 82%,0 64%,3% 46%,0 28%);
  }

  .setlist{
    position:relative;z-index:1;width:min(640px, 100%);margin:0 auto;
    padding:46px 44px 40px 58px;
    background:
      linear-gradient(90deg, rgba(0,0,0,0) 34px, rgba(194,79,54,0.25) 34px 35px, rgba(0,0,0,0) 35px),
      linear-gradient(180deg,var(--paper),var(--paper2));
    color:var(--marker);transform:rotate(-1.2deg);
    box-shadow:0 30px 60px rgba(0,0,0,0.7);
    clip-path:polygon(0 1%,4% 0,12% 0.6%,25% 0,40% 0.8%,58% 0,74% 0.5%,90% 0,100% 0.7%,99.4% 20%,100% 45%,99.5% 70%,100% 99%,85% 100%,66% 99.3%,48% 100%,30% 99.4%,14% 100%,0 99.2%,0.5% 75%,0 50%,0.6% 25%);
  }
  .setlist .ring{position:absolute;right:30px;bottom:60px;width:120px;height:120px;border-radius:50%;border:7px solid rgba(120,80,40,0.10);box-shadow:inset 0 0 8px rgba(120,80,40,0.12);pointer-events:none;}
  .sl-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px;}
  .sl-title{font-family:'Permanent Marker',cursive;font-weight:400;font-size:clamp(1.9rem,6vw,2.6rem);line-height:1;margin:0;outline:none;min-width:4ch;}
  .sl-title:focus{background:rgba(232,180,90,0.25);}
  .sl-when{font-family:'Caveat',cursive;font-size:1.35rem;color:var(--pen);display:flex;align-items:center;gap:6px;}
  .sl-when input{font-family:'Caveat',cursive;font-size:1.25rem;border:0;background:none;color:var(--pen);width:9.5em;padding:0;}
  .sl-when .count{color:var(--rust);font-weight:700;}
  .sl-sub{font-family:'Caveat',cursive;font-size:1.2rem;color:var(--pencil);margin:0 0 18px;}

  .songs{list-style:none;margin:0;padding:0;}
  .song{position:relative;display:grid;grid-template-columns:2.2em 1fr auto;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid rgba(31,42,82,0.12);cursor:pointer;}
  .song:hover .s-title{text-decoration:underline wavy rgba(194,79,54,0.6);text-underline-offset:6px;}
  .s-num{font-family:'Permanent Marker',cursive;font-size:1.3rem;color:var(--pencil);}
  .s-title{font-family:'Permanent Marker',cursive;font-size:clamp(1.35rem,4.4vw,1.8rem);line-height:1.1;}
  .s-note{display:block;font-family:'Caveat',cursive;font-size:1.15rem;color:var(--pen);line-height:1;margin-top:2px;}
  .s-right{display:flex;align-items:center;gap:10px;}
  .tally{display:inline-flex;gap:7px;align-items:center;height:26px;}
  .tally .five{position:relative;display:inline-flex;gap:3px;}
  .tally i{display:block;width:2px;height:22px;background:var(--pen);border-radius:1px;transform:rotate(4deg);}
  .tally .five.full::after{content:"";position:absolute;left:-4px;right:-4px;top:10px;height:2px;background:var(--pen);transform:rotate(-24deg);}
  .star{font-family:'Caveat',cursive;font-weight:700;font-size:1.1rem;color:var(--rust);border:2px solid var(--rust);border-radius:50%;padding:0 6px;transform:rotate(-8deg);white-space:nowrap;}
  .song .edit{display:none;gap:2px;}
  .editing .song .edit{display:flex;}
  .editing .song .tally,.editing .song .star{display:none;}
  .edit button{border:0;background:none;font-family:'Caveat',cursive;font-size:1.5rem;color:var(--pen);width:34px;height:34px;}
  .edit button:hover{color:var(--rust);}

  .pencil-row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px;}
  .pencil{border:0;background:none;padding:4px 0;font-family:'Caveat',cursive;font-weight:700;font-size:1.35rem;color:var(--pencil);}
  .pencil:hover{color:var(--marker);}
  .demo-note{font-family:'Caveat',cursive;font-size:1.1rem;color:var(--pencil);margin-top:14px;line-height:1.2;}
  .demo-note button{border:0;background:none;padding:0;font:inherit;color:var(--rust);text-decoration:underline;}

  .showtime{
    position:fixed;right:max(18px, env(safe-area-inset-right));bottom:max(18px, env(safe-area-inset-bottom));z-index:5;
    border:0;padding:16px 26px;font-family:'Permanent Marker',cursive;font-size:1.35rem;letter-spacing:0.04em;color:#f6f0e2;
    background:linear-gradient(180deg,#2c2b29,#1c1b19);
    clip-path:polygon(0 6%,3% 0,6% 10%,9% 0,100% 0,97% 15%,100% 32%,97% 50%,100% 68%,97% 84%,100% 100%,0 100%,3% 82%,0 64%,3% 46%,0 28%);
    box-shadow:0 6px 16px rgba(0,0,0,0.6);transform:rotate(-2deg);
  }
  .showtime:hover{color:var(--amber);}
  .floor-hint{max-width:600px;margin:34px auto 0;text-align:center;font-family:'Caveat',cursive;font-size:1.35rem;color:var(--chalk);opacity:0.72;line-height:1.3;}

  /* ===================== CUE CARD ===================== */
  .overlay{position:fixed;inset:0;z-index:20;background:rgba(5,4,3,0.82);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto;}
  .cue{
    position:relative;width:min(720px,100%);margin:auto;padding:34px 34px 28px 52px;
    background:
      repeating-linear-gradient(180deg, rgba(0,0,0,0) 0 31px, rgba(80,120,190,0.28) 31px 32px),
      linear-gradient(90deg, rgba(0,0,0,0) 36px, rgba(194,79,54,0.45) 36px 37px, rgba(0,0,0,0) 37px),
      #fbf8ef;
    color:var(--marker);transform:rotate(0.6deg);box-shadow:0 30px 70px rgba(0,0,0,0.8);
  }
  .cue .x,.addsheet .x{position:absolute;top:10px;right:14px;border:0;background:none;font-family:'Caveat',cursive;font-size:1.8rem;color:var(--pencil);}
  .cue h2{margin:0;font-family:'Permanent Marker',cursive;font-weight:400;font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.05;}
  .cue .by{font-family:'Caveat',cursive;font-size:1.35rem;color:var(--pen);}
  .cue .facts{display:flex;gap:16px;flex-wrap:wrap;font-family:'Caveat',cursive;font-weight:700;font-size:1.45rem;color:var(--rust);margin:6px 0 14px;}
  .prog-row{display:grid;grid-template-columns:7.5em 1fr;gap:10px;align-items:center;margin:6px 0;}
  .prog-row .lab{font-family:'Caveat',cursive;font-weight:700;font-size:1.3rem;color:var(--pen);}
  .prog-row .ch{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .prog-row .ch b{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:1.05rem;padding:3px 9px;border:2px solid var(--marker);border-radius:4px;background:#fff;}
  .memline{display:flex;gap:3px;margin:16px 0 6px;flex-wrap:wrap;}
  .memline span{width:14px;height:10px;border-radius:2px;background:#ddd3bd;}
  .memline span.m1{background:#d8c08c;} .memline span.m2{background:#c9a65a;} .memline span.m3{background:#8fae79;} .memline span.m4{background:#5f8b52;}
  .memcap{font-family:'Caveat',cursive;font-size:1.25rem;color:var(--pencil);}
  .cue-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px;align-items:center;}
  .tape-btn{
    border:0;padding:12px 20px;font-family:'Permanent Marker',cursive;font-size:1.15rem;color:#f6f0e2;
    background:linear-gradient(180deg,#2c2b29,#1c1b19);
    clip-path:polygon(0 6%,3% 0,6% 10%,9% 0,100% 0,97% 15%,100% 32%,97% 50%,100% 68%,97% 84%,100% 100%,0 100%,3% 82%,0 64%,3% 46%,0 28%);
  }
  .tape-btn.red{background:linear-gradient(180deg,#b9472f,#8e3523);}
  .tape-btn:hover{filter:brightness(1.15);}
  .cue .notes{font-family:'Caveat',cursive;font-size:1.3rem;color:var(--pen);margin-top:10px;white-space:pre-wrap;}

  /* ===================== TELEPROMPTER ===================== */
  .prompter{position:fixed;inset:0;z-index:30;background:#050403;color:#efe7d6;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;}
  .prompter::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 40% at 50% 42%, rgba(232,180,90,0.08), rgba(0,0,0,0) 70%);}
  .p-top{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;gap:14px;padding:14px 18px;padding-top:max(14px, env(safe-area-inset-top));background:linear-gradient(180deg,#050403 60%,rgba(5,4,3,0));}
  .p-top .x{border:1px solid #2a251e;background:none;border-radius:4px;color:var(--chalk);font-family:'IBM Plex Mono',monospace;font-size:0.75rem;padding:7px 11px;}
  .p-top .tt{flex:1;font-family:'Permanent Marker',cursive;font-size:1.25rem;color:#f3ecdc;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
  .p-top .meta{font-family:'IBM Plex Mono',monospace;font-size:0.72rem;color:var(--amber-dim);white-space:nowrap;}
  .p-dots{display:flex;gap:3px;position:absolute;left:18px;right:18px;top:max(60px, calc(env(safe-area-inset-top) + 46px));z-index:3;}
  .p-dots span{flex:1;height:3px;border-radius:2px;background:#2a251e;}
  .p-dots span.ok{background:var(--sage);} .p-dots span.peek{background:var(--amber);} .p-dots span.now{background:#efe7d6;}
  .track{position:absolute;left:0;right:0;top:0;transition:transform 380ms cubic-bezier(.2,.7,.2,1);padding:0 7vw;}
  .pline{max-width:1100px;margin:0 auto;padding:14px 0;opacity:0.26;transition:opacity 300ms ease, font-size 300ms ease;font-size:clamp(1.15rem,2.6vw,1.6rem);}
  .pline.past{opacity:0.14;}
  .pline.now{opacity:1;font-size:clamp(1.7rem,5.2vw,3.1rem);}
  .pline.next{opacity:0.5;}
  .p-sec{font-family:'Permanent Marker',cursive;font-size:0.55em;letter-spacing:0.08em;color:var(--amber-dim);text-transform:uppercase;margin-bottom:0.25em;}
  .now .p-sec{color:var(--amber);}
  .lyr{line-height:1.15;}
  .seg{display:inline-flex;flex-direction:column;vertical-align:bottom;}
  .seg .c{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:0.62em;color:var(--amber);min-height:1.35em;padding-right:0.55em;white-space:nowrap;}
  .seg .w{white-space:pre;}
  .seg .c.ghost::before{content:"?";color:#5b4a2c;}
  .gap{color:transparent;border-bottom:2px dotted rgba(239,231,214,0.28);letter-spacing:-0.18em;}
  .now .gap{border-bottom-color:rgba(239,231,214,0.5);}
  .instr{font-family:'Caveat',cursive;font-size:0.8em;color:#8d8471;}
  .pline.peeked .w{color:var(--amber);}
  .p-zones{position:absolute;inset:0;z-index:2;display:grid;grid-template-columns:1fr 2fr;}
  .p-zones button{border:0;background:none;}
  .p-help{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 18px calc(12px + env(safe-area-inset-bottom));font-family:'IBM Plex Mono',monospace;font-size:0.72rem;color:#7d7466;background:linear-gradient(0deg,#050403 55%,rgba(5,4,3,0));pointer-events:none;}
  .p-help b{color:var(--chalk);font-weight:500;}
  .p-card{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(5,4,3,0.95);overflow:auto;}
  .p-card .inner{max-width:620px;text-align:center;margin:auto;}
  .p-card .big{font-family:'Permanent Marker',cursive;font-size:clamp(2rem,6vw,3.4rem);line-height:1.05;color:#f3ecdc;margin:6px 0 10px;}
  .p-card .small{font-family:'Caveat',cursive;font-size:1.6rem;color:var(--amber);}
  .p-card p{font-size:1.15rem;line-height:1.5;color:var(--chalk);}
  .p-card .memline,.p-card .cue-actions{justify-content:center;}
  .p-card .pencil{color:var(--chalk);}
  .p-card .upnext{margin-top:22px;font-family:'Caveat',cursive;font-size:1.7rem;color:var(--amber);}
  .p-card .keys{font-family:'IBM Plex Mono',monospace;font-size:0.72rem;color:#7d7466;margin-top:16px;}

  /* ===================== ADD A SONG ===================== */
  .addsheet{position:relative;width:min(760px,100%);margin:auto;padding:30px 30px 24px;background:linear-gradient(180deg,var(--paper),var(--paper2));color:var(--marker);box-shadow:0 30px 70px rgba(0,0,0,0.8);transform:rotate(-0.4deg);}
  .addsheet h2{margin:0 0 4px;font-family:'Permanent Marker',cursive;font-weight:400;font-size:2rem;}
  .addsheet > p{margin:0 0 14px;font-family:'Caveat',cursive;font-size:1.3rem;color:var(--pen);line-height:1.2;}
  .fields{display:grid;grid-template-columns:2fr 1.4fr 0.7fr 0.7fr;gap:10px;margin-bottom:10px;}
  .fields label,.notes-label{display:grid;gap:2px;font-family:'Caveat',cursive;font-weight:700;font-size:1.1rem;color:var(--pencil);}
  .fields input,.notes-label input{border:0;border-bottom:2px solid rgba(25,23,20,0.35);background:none;padding:4px 2px;font-family:'Caveat',cursive;font-weight:700;font-size:1.45rem;color:var(--marker);width:100%;}
  .notes-label{margin-top:10px;}
  .addsheet textarea{width:100%;min-height:300px;border:1px solid rgba(25,23,20,0.2);background:rgba(255,255,255,0.55);padding:12px;font-family:'IBM Plex Mono',monospace;font-size:0.85rem;line-height:1.5;white-space:pre;resize:vertical;color:#1d1a16;}
  .add-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px;}
  .add-row label.pencil{cursor:pointer;}
  .add-status{font-family:'Caveat',cursive;font-size:1.25rem;color:var(--rust);}

  .toast{position:fixed;left:50%;top:20px;transform:translateX(-50%) rotate(-1deg);z-index:60;background:#f6e27a;color:var(--marker);padding:10px 16px;font-family:'Caveat',cursive;font-weight:700;font-size:1.35rem;box-shadow:0 8px 18px rgba(0,0,0,0.5);max-width:90vw;}

  @media (max-width: 640px){
    .floor{padding:64px 10px 130px;}
    .setlist{padding:36px 18px 30px 44px;transform:rotate(-0.6deg);background:linear-gradient(90deg, rgba(0,0,0,0) 28px, rgba(194,79,54,0.25) 28px 29px, rgba(0,0,0,0) 29px),linear-gradient(180deg,var(--paper),var(--paper2));}
    .song{grid-template-columns:1.7em 1fr auto;}
    .tally .five:nth-child(n+3){display:none;}
    .cue{padding:28px 20px 22px 44px;}
    .prog-row{grid-template-columns:1fr;gap:2px;}
    .fields{grid-template-columns:1fr 1fr;}
    .track{padding:0 5vw;}
    .p-help span:last-child{display:none;}
    .seg .w{white-space:pre-wrap;}
    .seg{display:inline;}
    .seg .c{display:inline-block;vertical-align:1.25em;width:0;overflow:visible;padding:0;}
    .lyr{line-height:2.35;}
    .pline{padding:6px 0;}
  }
</style>
</head>
<body>

<div class="floor" id="floor">
  <a class="home" href="/">&larr; caps unlocked</a>
  <span class="gaff" aria-hidden="true" style="top:46px;left:calc(50% - min(300px, 47vw));transform:rotate(-38deg);"></span>
  <span class="gaff" aria-hidden="true" style="top:42px;left:calc(50% + min(200px, 47vw - 120px));transform:rotate(32deg);"></span>

  <section class="setlist" id="setlist" aria-label="Set list">
    <span class="ring" aria-hidden="true"></span>
    <div class="sl-head">
      <h1 class="sl-title" id="slTitle" contenteditable="true" spellcheck="false" aria-label="Show name (tap to edit)"></h1>
      <div class="sl-when"><input type="date" id="slDate" aria-label="Show date"><span class="count" id="slCount"></span></div>
    </div>
    <p class="sl-sub" id="slSub"></p>
    <ol class="songs" id="songs"></ol>
    <div class="pencil-row">
      <button class="pencil" type="button" id="addBtn">+ add a song</button>
      <button class="pencil" type="button" id="editBtn">rearrange</button>
    </div>
    <div class="demo-note" id="demoNote"></div>
  </section>

  <p class="floor-hint">Tap a song to rehearse it. Each line you get right without peeking fades a little more next time, until you're playing it from memory.</p>

  <button class="showtime" type="button" id="showtimeBtn">Showtime ▶</button>
</div>

<div id="layer"></div>

<script>
(function(){
'use strict';

 {title:'Wayfaring Stranger', artist:'Traditional', key:'Am', capo:0, runs:0, notes:'Slow. Let the E ring before the turnaround.', chart:
"[Verse 1]\n      Am                    Dm     Am\nI am a poor wayfaring stranger\n                                   E\nWhile traveling through this world of woe\n        Am                        Dm       Am\nYet there's no sickness, toil nor danger\n                         E           Am\nIn that bright world to which I go\n\n[Chorus]\n     F              C\nI'm going there to see my father\n     F              E\nI'm going there no more to roam\n     Am                   Dm    Am\nI'm only going over Jordan\n     Am            E      Am\nI'm only going over home\n\n[Verse 2]\n      Am                   Dm      Am\nI know dark clouds will gather round me\n                          E\nI know my way is rough and steep\n       Am                      Dm    Am\nYet beauteous fields lie just before me\n                          E        Am\nWhere God's redeemed their vigils keep\n\n[Chorus]\n     F              C\nI'm going there to see my mother\n     F                      E\nShe said she'd meet me when I come\n     Am                   Dm    Am\nI'm only going over Jordan\n     Am            E      Am\nI'm only going over home"},

/* ---------------------------------------------------------------
   Storage (this browser only)
---------------------------------------------------------------- */
var KEY = 'cu-the-set-v2';
function inWeeks(n){ return new Date(Date.now() + n * 7 * 864e5).toISOString().slice(0,10); }
function seed(){
  return {
    name:'Fall Show', date: inWeeks(3), editing:false,
    songs: DEMO.map(function(d, i){ return Object.assign({}, d, {id:'demo' + i, demo:true, mem:(d.mem || []).slice(), last: d.runs ? Date.now() - (i + 1) * 864e5 : 0}); }),
    order:['demo0','demo2','demo1','demo3']
  };
}
var state = (function(){ try { var s = JSON.parse(localStorage.getItem(KEY)); if (s && s.songs) return s; } catch(e){} return seed(); })();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){ toast('Couldn\'t save on this device'); } }
function byId(id){ return state.songs.find(function(s){ return s.id === id; }); }
function setSongs(){ return state.order.map(byId).filter(Boolean); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

/* ---------------------------------------------------------------
   Chart parsing: chords-over-lyrics -> performable lines
---------------------------------------------------------------- */
var CHORD_RE = /^\(?([A-G])([#b]?)((?:maj|min|m|M|dim|aug|sus|add|°|\+|-)?[0-9]*(?:(?:sus|add|maj|b|#|\+|-)[0-9]+)*)(?:\/([A-G][#b]?))?\)?\*?$/;
var DECOR_RE = /^(\||\|\||-+|–|\/|x\d+|\d+x|\(x?\d+x?\)|n\.?c\.?|%|\(|\)|\*)$/i;
function isChord(t){ return CHORD_RE.test(t); }
function isChordLine(l){
  var t = l.trim().split(/\s+/).filter(Boolean), n = 0;
  if (!t.length) return false;
  for (var i = 0; i < t.length; i++){ if (isChord(t[i])) n++; else if (!DECOR_RE.test(t[i])) return false; }
  return n > 0 && !(t.length === 1 && t[0] === 'A' && l.trim() === l);
}
var SEC_RE = /^\s*[\[\(]?\s*(intro|verse|chorus|pre-?chorus|bridge|outro|solo|instrumental|interlude|refrain|coda|tag|break|ending|turnaround)\b([^\]\)\n:]{0,20})[\]\)]?\s*:?\s*$/i;
function normalise(src){
  var s = String(src || '').replace(/\r\n?/g,'\n').replace(/\t/g,'    ').replace(/ /g,' ').replace(/\[\/?tab\]/gi,'');
  s = s.replace(/\[ch\]([^\[]*?)\[\/ch\]/gi, '$1');
  s = s.replace(/^\{(start_of_|so)(chorus|verse|bridge|c|v|b)[^}]*\}\s*$/gim, function(_, a, b){ var n = {c:'Chorus',v:'Verse',b:'Bridge'}[b] || b; return '[' + n.charAt(0).toUpperCase() + n.slice(1) + ']'; });
  s = s.replace(/^\{[^}]*\}\s*$/gm, '');
  return s.split('\n').map(function(l){ // ChordPro [G]inline chords
    if (!/\[[A-G][^\]\s]{0,8}\]/.test(l) || !l.replace(/\[[^\]]*\]/g,'').trim()) return l;
    var c = '', w = '', re = /\[([^\]]+)\]/g, last = 0, m;
    while ((m = re.exec(l))){ w += l.slice(last, m.index); while (c.length < w.length) c += ' '; while (w.length < c.length) w += ' '; c += m[1] + ' '; last = re.lastIndex; }
    return c.replace(/\s+$/,'') + '\n' + w + l.slice(last);
  }).join('\n');
}
function lineItems(chart){
  var raw = normalise(chart).split('\n'), items = [], sec = '', pending = '';
  function chordsOf(l){ var out = [], re = /\S+/g, m; while ((m = re.exec(l))) if (isChord(m[0])) out.push({col:m.index, ch:m[0].replace(/[()*]/g,'')}); return out; }
  for (var i = 0; i < raw.length; i++){
    var l = raw[i].replace(/\s+$/,'');
    if (!l.trim()) continue;
    var sm = l.match(SEC_RE);
    if (sm){ sec = (sm[1] + (sm[2] || '')).trim(); sec = sec.charAt(0).toUpperCase() + sec.slice(1); pending = sec; continue; }
    if (isChordLine(l)){
      var nx = raw[i + 1] != null ? raw[i + 1].replace(/\s+$/,'') : '';
      if (nx.trim() && !isChordLine(nx) && !SEC_RE.test(nx)){ items.push({sec:pending, section:sec, chords:chordsOf(l), lyric:nx}); i++; }
      else items.push({sec:pending, section:sec || 'Intro', chords:chordsOf(l), lyric:''});
      pending = ''; continue;
    }
    items.push({sec:pending, section:sec, chords:[], lyric:l}); pending = '';
  }
  return items;
}
function progression(items){
  var secs = [], cur = null;
  items.forEach(function(it){
    if (it.sec || !cur){ cur = {name: it.section || 'Song', chords: []}; secs.push(cur); }
    it.chords.forEach(function(c){ if (cur.chords[cur.chords.length - 1] !== c.ch) cur.chords.push(c.ch); });
  });
  var out = [];
  secs.forEach(function(s){
    if (!s.chords.length) return;
    var key = s.chords.join(' '), base = s.name.replace(/\s*\d+$/, '');
    var same = out.find(function(o){ return o.key === key && o.name === base; });
    if (same){ same.times++; return; }
    out.push({name: base, key: key, chords: s.chords, times: 1});
  });
  return out;
}

/* ---------------------------------------------------------------
   Memory: each line has a level 0 (everything shows) .. 4 (nothing)
---------------------------------------------------------------- */
function maskLyric(text, lvl){
  if (!lvl) return text;
  var w = -1;
  return text.replace(/\S+/g, function(word){
    w++;
    if (lvl === 1 && w % 3 !== 2) return word;
    var keepFirst = lvl === 2 || (lvl === 3 && w === 0);
    var first = word.search(/[\p{L}\p{N}]/u);
    return word.replace(/[\p{L}\p{N}'’]/gu, function(ch, idx){ return keepFirst && idx === first ? ch : '_'; });
  });
}
function avgMem(s){ var n = lineItems(s.chart).length; if (!n) return 0; var t = 0; for (var i = 0; i < n; i++) t += (s.mem && s.mem[i]) || 0; return t / (n * 4); }

function ago(t){ var d = Math.floor((Date.now() - t) / 864e5); return d <= 0 ? 'today' : d === 1 ? 'yesterday' : d + ' days ago'; }

/* ---------------------------------------------------------------
   The set list on the floor
---------------------------------------------------------------- */
var songsEl = document.getElementById('songs'), layer = document.getElementById('layer');
function tallyHTML(n){
  if (!n) return '';

  while (left > 0){ var k = Math.min(5, left); out += '<span class="five' + (k === 5 ? ' full' : '') + '">' + '<i></i>'.repeat(Math.min(k, 4)) + '</span>'; left -= k; }
  return '<span class="tally" title="' + n + ' run-through' + (n > 1 ? 's' : '') + '">' + out + '</span>';
}
function renderFloor(){
  var t = document.getElementById('slTitle');

  document.getElementById('slDate').value = state.date || '';

  if (state.date){ var days = Math.ceil((new Date(state.date + 'T20:00') - Date.now()) / 864e5); cnt.textContent = days > 1 ? days + ' days!' : days === 1 ? 'tomorrow!' : days === 0 ? 'TONIGHT' : 'played it'; }
  else cnt.textContent = '';
  var list = setSongs();
  var mins = list.reduce(function(a, s){ return a + Math.max(2.5, lineItems(s.chart).length * 0.28); }, 0);

  document.getElementById('slSub').textContent = list.length ? list.length + ' songs · about ' + Math.round(mins) + ' min · ' + heart + ' by heart' : 'no songs yet';
  songsEl.innerHTML = list.map(function(s, i){
    var note = [s.key ? '(' + s.key + ')' : '', +s.capo ? 'capo ' + s.capo : '', s.artist && !s.demo ? s.artist : ''].filter(Boolean).join('  ');
    return '<li class="song" data-id="' + s.id + '" tabindex="0" role="button" aria-label="Rehearse ' + esc(s.title) + '">' +
      '<span class="s-num">' + (i + 1) + '.</span>' +
      '<span><span class="s-title">' + esc(s.title) + '</span>' + (note ? '<span class="s-note">' + esc(note) + '</span>' : '') + '</span>' +
      '<span class="s-right">' + (avgMem(s) >= 0.85 ? '<span class="star">by heart!</span>' : '') + tallyHTML(s.runs || 0) +
        '<span class="edit"><button type="button" data-a="up" aria-label="Move up">↑</button><button type="button" data-a="down" aria-label="Move down">↓</button><button type="button" data-a="del" aria-label="Take off the set list">✕</button></span></span>' +
    '</li>';
  }).join('');
  document.getElementById('setlist').classList.toggle('editing', !!state.editing);
  document.getElementById('editBtn').textContent = state.editing ? 'done' : 'rearrange';
  var hasDemo = state.songs.some(function(s){ return s.demo; });
  document.getElementById('demoNote').innerHTML = hasDemo
    ? 'Demo: these four are public-domain folk songs so you can try it out. Add your own with "+ add a song" (they stay private, in this browser). <button type="button" id="clearDemo">clear the demo</button>'
    : 'Your songs stay private, in this browser only.';
  var cd = document.getElementById('clearDemo');
  if (cd) cd.addEventListener('click', function(){ state.songs = state.songs.filter(function(s){ return !s.demo; }); state.order = state.order.filter(byId); save(); renderFloor(); });
}
document.getElementById('slTitle').addEventListener('input', function(e){ state.name = e.target.textContent.trim() || 'The Show'; save(); });
document.getElementById('slTitle').addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); e.target.blur(); } });
document.getElementById('slDate').addEventListener('change', function(e){ state.date = e.target.value; save(); renderFloor(); });
document.getElementById('editBtn').addEventListener('click', function(){ state.editing = !state.editing; save(); renderFloor(); });
songsEl.addEventListener('click', function(e){
  var li = e.target.closest('.song'); if (!li) return;
  var id = li.getAttribute('data-id'), a = e.target.closest('[data-a]');
  if (a){
    var i = state.order.indexOf(id), act = a.getAttribute('data-a');
    if (act === 'up' && i > 0){ state.order.splice(i,1); state.order.splice(i-1,0,id); }
    if (act === 'down' && i < state.order.length - 1){ state.order.splice(i,1); state.order.splice(i+1,0,id); }
    if (act === 'del') state.order.splice(i,1);
    save(); renderFloor(); return;
  }
  if (!state.editing) openCue(id);
});
songsEl.addEventListener('keydown', function(e){ if (e.key === 'Enter' && e.target.classList.contains('song')) openCue(e.target.getAttribute('data-id')); });

/* ---------------------------------------------------------------
   Cue card
---------------------------------------------------------------- */
function openCue(id){
  var s = byId(id); if (!s) return;
  var items = lineItems(s.chart), prog = progression(items), pct = Math.round(avgMem(s) * 100);
  layer.innerHTML = '<div class="overlay" id="ov"><article class="cue" role="dialog" aria-label="' + esc(s.title) + '">' +
    '<button class="x" type="button" data-x="close" aria-label="Close">✕</button>' +

    '<div class="facts">' + (s.key ? '<span>key of ' + esc(s.key) + '</span>' : '') + '<span>' + (+s.capo ? 'capo ' + esc(s.capo) : 'no capo') + '</span><span>' + items.length + ' lines</span></div>' +
    prog.map(function(p){ return '<div class="prog-row"><span class="lab">' + esc(p.name) + (p.times > 1 ? ' ×' + p.times : '') + '</span><span class="ch">' + p.chords.map(function(c){ return '<b>' + esc(c) + '</b>'; }).join('') + '</span></div>'; }).join('') +
    (s.notes ? '<div class="notes">' + esc(s.notes) + '</div>' : '') +
    memStrip(s) +
    '<div class="memcap">' + (s.runs ? pct + '% from memory · ' + s.runs + ' run' + (s.runs > 1 ? 's' : '') + (s.last ? ', last ' + ago(s.last) : '') : 'Not rehearsed yet. The first time through, everything shows.') + '</div>' +
    '<div class="cue-actions"><button class="tape-btn red" type="button" data-x="rehearse">Rehearse ▶</button>' +
      '<button class="tape-btn" type="button" data-x="read">Just read it</button>' +
      (state.order.indexOf(s.id) < 0 ? '<button class="pencil" type="button" data-x="addset">+ back on the set list</button>' : '') +
      '<button class="pencil" type="button" data-x="edit">edit</button>' +
      (s.runs ? '<button class="pencil" type="button" data-x="reset">start over</button>' : '') + '</div>' +
  '</article></div>';
  var ov = document.getElementById('ov');
  ov.addEventListener('click', function(e){
    if (e.target === ov) return closeLayer();
    var b = e.target.closest('[data-x]'); if (!b) return;
    var x = b.getAttribute('data-x');
    if (x === 'close') closeLayer();
    if (x === 'rehearse') startPrompter([s.id], true);
    if (x === 'read') startPrompter([s.id], false);
    if (x === 'edit') openAdd(s.id);
    if (x === 'addset'){ state.order.push(s.id); save(); renderFloor(); openCue(s.id); }
    if (x === 'reset'){ s.mem = []; s.runs = 0; s.last = 0; save(); renderFloor(); openCue(s.id); }

function closeLayer(){ layer.innerHTML = ''; }
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && layer.firstChild && !P) closeLayer(); });

/* ---------------------------------------------------------------
   Teleprompter: one line at a time, hands stay on the guitar
---------------------------------------------------------------- */
var P = null, wake = null;
function startPrompter(ids, memMode){
  P = {ids: ids, si: 0, memMode: memMode};
  layer.innerHTML = '<div class="prompter" id="pr" role="application" aria-label="Rehearsal">' +
    '<div class="p-top"><button class="x" type="button" id="pClose">✕ stop</button><span class="tt" id="pTitle"></span><span class="meta" id="pMeta"></span></div>' +
    '<div class="p-dots" id="pDots"></div><div class="track" id="track"></div>' +
    '<div class="p-zones"><button type="button" id="zPeek" aria-label="Peek at this line"></button><button type="button" id="zNext" aria-label="Next line"></button></div>' +
    '<div class="p-help"><span><b>tap left</b> or <b>←</b> peek</span><span><b>tap right</b>, <b>space</b> or <b>→</b> next line</span><span>a page-turner foot pedal works too</span></div>' +
  '</div>';
  document.getElementById('pClose').addEventListener('click', function(e){ e.stopPropagation(); stopPrompter(); });
  document.getElementById('zNext').addEventListener('click', next);
  document.getElementById('zPeek').addEventListener('click', peek);
  document.addEventListener('keydown', pKey);
  window.addEventListener('resize', place);
  try { navigator.wakeLock && navigator.wakeLock.request('screen').then(function(w){ wake = w; }).catch(function(){}); } catch(e){}
  loadSong();
}
function loadSong(){
  var s = byId(P.ids[P.si]);
  P.song = s; P.items = lineItems(s.chart); P.i = 0; P.peeked = {};
  document.getElementById('pTitle').textContent = s.title;
  document.getElementById('pMeta').textContent = [s.key ? 'key ' + s.key : '', +s.capo ? 'capo ' + s.capo : '', P.ids.length > 1 ? (P.si + 1) + '/' + P.ids.length : '', P.memMode ? '' : 'reading'].filter(Boolean).join(' · ');
  document.getElementById('track').innerHTML = P.items.map(function(it, i){ return '<div class="pline" data-i="' + i + '">' + lineHTML(it, i) + '</div>'; }).join('') + '<div style="height:60vh"></div>';
  update();
}
function lvlFor(i){ return P.memMode ? Math.min(4, (P.song.mem && P.song.mem[i]) || 0) : 0; }
function lineHTML(it, i, show){
  var lvl = show ? 0 : lvlFor(i), hideChords = lvl >= 3;
  var head = it.sec ? '<div class="p-sec">' + esc(it.sec) + '</div>' : '';
  if (!it.lyric){
    return head + '<div class="lyr">' + it.chords.map(function(c){ return '<span class="seg"><span class="c' + (hideChords ? ' ghost' : '') + '">' + (hideChords ? '' : esc(c.ch)) + '</span><span class="w instr"> </span></span>'; }).join('') + '<span class="instr"> (instrumental)</span></div>';
  }
  var lyric = maskLyric(it.lyric, lvl);
  var cs = it.chords.slice().sort(function(a,b){ return a.col - b.col; }), segs = [];
  if (!cs.length || cs[0].col > 0) segs.push({c:'', t: lyric.slice(0, cs.length ? cs[0].col : lyric.length)});
  cs.forEach(function(c, k){ segs.push({c: c.ch, t: lyric.slice(c.col, k + 1 < cs.length ? cs[k+1].col : undefined)}); });
  return head + '<div class="lyr">' + segs.map(function(sg){
    var t = sg.t ? esc(sg.t).replace(/_+/g, function(m){ return '<span class="gap">' + m + '</span>'; }) : ' ';
    return '<span class="seg"><span class="c' + (sg.c && hideChords ? ' ghost' : '') + '">' + (sg.c && !hideChords ? esc(sg.c) : '') + '</span><span class="w">' + t + '</span></span>';
  }).join('') + '</div>';
}
function drawDots(){
  document.getElementById('pDots').innerHTML = P.items.map(function(_, i){ return '<span class="' + (i < P.i ? (P.peeked[i] ? 'peek' : 'ok') : i === P.i ? 'now' : '') + '"></span>'; }).join('');
}
function update(){
  document.querySelectorAll('#track .pline').forEach(function(el, i){
    el.classList.toggle('now', i === P.i); el.classList.toggle('next', i === P.i + 1); el.classList.toggle('past', i < P.i);
    if (i < P.i && !el.dataset.full){ el.innerHTML = lineHTML(P.items[i], i, true); el.dataset.full = '1'; }
  });
  drawDots(); requestAnimationFrame(place);
}
function place(){
  var cur = document.querySelector('#track .pline.now'); if (!cur) return;
  document.getElementById('track').style.transform = 'translateY(' + (window.innerHeight * 0.42 - (cur.offsetTop + cur.offsetHeight / 2)) + 'px)';
}
function next(){
  if (!P || document.getElementById('pCard')) return;
  P.i++;
  if (P.i >= P.items.length) return finishSong();
  update();
}
function peek(){
  if (!P || document.getElementById('pCard')) return;
  var el = document.querySelector('#track .pline.now'); if (!el) return;
  if (P.peeked[P.i] || lvlFor(P.i) === 0){ // nothing hidden here: step back a line instead
    if (lvlFor(P.i) === 0 && !P.peeked[P.i] && P.memMode){ P.peeked[P.i] = true; drawDots(); return; }
    if (P.i > 0){ P.i--; update(); }
    return;
  }
  P.peeked[P.i] = true;
  el.innerHTML = lineHTML(P.items[P.i], P.i, true); el.classList.add('peeked');
  drawDots(); place();
}
function finishSong(){
  var s = P.song, clean = 0, weak = [];
  if (P.memMode){
    s.mem = s.mem || [];
    P.items.forEach(function(it, i){
      var cur = s.mem[i] || 0;
      if (P.peeked[i]){ s.mem[i] = Math.max(0, cur - 1); if (it.section && weak.indexOf(it.section.replace(/\s*\d+$/,'').toLowerCase()) < 0) weak.push(it.section.replace(/\s*\d+$/,'').toLowerCase()); }
      else { s.mem[i] = Math.min(4, cur + 1); clean++; }
    });
    s.runs = (s.runs || 0) + 1; s.last = Date.now(); save(); renderFloor();
  }
  var nextSong = P.si < P.ids.length - 1 ? byId(P.ids[P.si + 1]) : null;
  var card = document.createElement('div');
  card.className = 'p-card'; card.id = 'pCard';
  card.innerHTML = '<div class="inner">' +
    (P.memMode
      ? '<div class="small">' + (clean === P.items.length ? 'clean run!' : 'one more tally on the set list') + '</div><div class="big">' + clean + ' of ' + P.items.length + ' lines<br>from memory</div>' + memStrip(s) +
        '<p>' + (weak.length ? 'You peeked in the ' + weak.join(' and ') + '. Those lines will stay clearer next time; the rest fade a little more.' : 'Every line fades a little more next time.') + ' This song is ' + Math.round(avgMem(s) * 100) + '% from memory now.</p>'
      : '<div class="small">read-through done</div><div class="big">' + esc(s.title) + '</div><p>Ready to rehearse it? The words start fading from your next run.</p>') +
    (nextSong ? '<div class="upnext">Next up: ' + esc(nextSong.title) + (nextSong.key ? ' · ' + esc(nextSong.key) : '') + ' · ' + (+nextSong.capo ? 'capo ' + nextSong.capo : 'no capo') + '</div>' : '') +
    '<div class="cue-actions">' + (nextSong ? '<button class="tape-btn red" type="button" data-c="next">Next song ▶</button>' : '') +
      '<button class="tape-btn' + (nextSong ? '' : ' red') + '" type="button" data-c="again">' + (P.memMode ? 'Run it again' : 'Rehearse it ▶') + '</button>' +
      '<button class="pencil" type="button" data-c="stop">back to the set list</button></div>' +
    '<div class="keys">space / → ' + (nextSong ? 'next song' : (P.memMode ? 'run it again' : 'rehearse')) + ' · esc set list</div>' +
  '</div>';
  document.getElementById('pr').appendChild(card);
  card.addEventListener('click', function(e){ var b = e.target.closest('[data-c]'); if (b) cardAction(b.getAttribute('data-c')); });
  P.card = nextSong ? 'next' : 'again';
}
function cardAction(c){
  var card = document.getElementById('pCard'); if (card) card.remove();
  if (c === 'stop') return stopPrompter();
  if (c === 'next'){ P.si++; loadSong(); return; }
  if (c === 'again'){ P.memMode = true; loadSong(); }
}
function stopPrompter(){
  P = null; try { wake && wake.release(); } catch(e){} wake = null;
  document.removeEventListener('keydown', pKey); window.removeEventListener('resize', place);
  closeLayer(); renderFloor();
}
function pKey(e){
  if (!P) return;
  var k = e.key;
  if (document.getElementById('pCard')){
    if (k === ' ' || k === 'ArrowRight' || k === 'PageDown' || k === 'Enter'){ e.preventDefault(); cardAction(P.card); }
    else if (k === 'Escape') stopPrompter();
    return;
  }
  if (k === ' ' || k === 'ArrowRight' || k === 'PageDown' || k === 'ArrowDown' || k === 'Enter'){ e.preventDefault(); next(); }
  else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'ArrowUp'){ e.preventDefault(); peek(); }
  else if (k === 'Escape') stopPrompter();
}
document.getElementById('showtimeBtn').addEventListener('click', function(){
  var ids = state.order.filter(function(id){ var s = byId(id); return s && lineItems(s.chart).length; });
  if (!ids.length) return toast('Put a song on the set list first');
  startPrompter(ids, true);
});

/* ---------------------------------------------------------------
   Add / edit a song: paste text or use a PDF
---------------------------------------------------------------- */
var pdfjs = null;
function loadPdfjs(){
  if (!pdfjs) pdfjs = import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs').then(function(lib){
    lib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.mjs'; return lib; });
  return pdfjs;
}
async function pdfText(file){
  var lib = await loadPdfjs();
  var doc = await lib.getDocument({data: await file.arrayBuffer(), isEvalSupported:false}).promise;
  if (doc.numPages > 12) throw new Error('That looks like a whole songbook (' + doc.numPages + ' pages). Add songs one at a time.');
  var out = [];
  for (var p = 1; p <= doc.numPages; p++){
    var tc = await (await doc.getPage(p)).getTextContent();
    var items = tc.items.filter(function(it){ return it.str && it.str.trim(); }), lines = [], cw = [];
    if (!items.length) continue;
    items.forEach(function(it){ if (it.str.length > 2 && it.width) cw.push(it.width / it.str.length); });
    cw.sort(function(a,b){ return a - b; }); var w = cw[Math.floor(cw.length / 2)] || 5;
    items.forEach(function(it){
      var y = it.transform[5], h = Math.abs(it.transform[3]) || 10, ln = lines.find(function(l){ return Math.abs(l.y - y) < h * 0.45; });
      if (!ln){ ln = {y: y, items: []}; lines.push(ln); }
      ln.items.push({x: it.transform[4], s: it.str});
    });
    lines.sort(function(a,b){ return b.y - a.y; });
    var minX = Math.min.apply(null, lines.map(function(l){ return Math.min.apply(null, l.items.map(function(i){ return i.x; })); }));
    var prevY = null;
    lines.forEach(function(l){
      if (prevY !== null && prevY - l.y > 26) out.push('');
      prevY = l.y; l.items.sort(function(a,b){ return a.x - b.x; });
      var s = '';
      l.items.forEach(function(it){ var col = Math.max(0, Math.round((it.x - minX) / w)); if (s.length < col) s += ' '.repeat(col - s.length); else if (s && !/\s$/.test(s)) s += ' '; s += it.s; });
      out.push(s.replace(/\s+$/,''));
    });
  }
  var text = out.join('\n').replace(/\n{3,}/g, '\n\n').trim();
  if (text.replace(/\s/g,'').length < 40) throw new Error('That PDF is a scanned picture, so there\'s no text to read. Type or paste the song instead.');
  return text;
}
function fromFilename(name){
  var b = name.replace(/\.[^.]+$/, '').replace(/_/g, ' '), capo = 0, m = b.match(/\(\s*capo\s*(?:on\s*)?(\d+)\s*\)/i);
  if (m){ capo = +m[1]; b = b.replace(m[0], ''); }
  b = b.replace(/\s+e-?chords\b.*$/i, '').replace(/^chords\s+[-–]\s+/i, '').replace(/\s+chords\b/i, '').replace(/\s*\((corrected|wilco)\)\s*/i, ' ');
  var d = b.match(/^(.*?)\s+[-–]\s+(.*)$/), artist = '';
  if (d){ b = d[1]; artist = d[2]; }
  return {title: b.replace(/\s+/g,' ').trim(), artist: artist.trim(), capo: capo};
}
function guessKey(items){
  for (var i = items.length - 1; i >= 0; i--) if (items[i].chords.length){ var c = items[i].chords[items[i].chords.length - 1].ch.match(CHORD_RE); if (c) return c[1] + c[2] + (/^m(?!aj)/.test(c[3]) ? 'm' : ''); }
  return '';
}
function openAdd(editId){
  var s = editId ? byId(editId) : null;
  layer.innerHTML = '<div class="overlay" id="ov"><form class="addsheet" id="addForm" autocomplete="off">' +
    '<button class="x" type="button" data-x="close" aria-label="Close">✕</button>' +
    '<h2>' + (s ? 'Edit ' + esc(s.title) : 'Add a song') + '</h2>' +
    '<p>' + (s ? 'Fix a chord or a line, then save. Your progress on unchanged lines stays.' : 'Paste chords-over-lyrics (copied from Ultimate Guitar, a website or your notes), or pick one of your PDF chord sheets.') + '</p>' +
    '<div class="fields"><label>song<input name="title" required value="' + esc(s ? s.title : '') + '"></label>' +
      '<label>artist<input name="artist" value="' + esc(s ? s.artist : '') + '"></label>' +
      '<label>key<input name="key" value="' + esc(s ? s.key : '') + '" placeholder="auto"></label>' +
      '<label>capo<input name="capo" inputmode="numeric" value="' + esc(s && +s.capo ? s.capo : '') + '" placeholder="0"></label></div>' +
    '<textarea name="chart" spellcheck="false" placeholder="[Verse 1]\n       G              D\nchords sit on the line above the words\n       Em             C\nlike this; [Chorus] labels are optional">' + esc(s ? s.chart : '') + '</textarea>' +
    '<label class="notes-label">notes to self<input name="notes" value="' + esc(s ? s.notes || '' : '') + '" placeholder="strum pattern, the tricky change…"></label>' +
    '<div class="add-row"><label class="pencil">use a PDF instead<input type="file" id="pdfPick" accept="application/pdf,.pdf,.txt,.cho,.chopro" hidden></label><span class="add-status" id="addStatus"></span>' +
      '<span style="display:flex;gap:12px;align-items:center;">' + (s ? '<button class="pencil" type="button" data-x="delete" style="color:var(--rust)">delete song</button>' : '') +
      '<button class="tape-btn red" type="submit">' + (s ? 'Save' : 'Put it on the set list') + '</button></span></div>' +
  '</form></div>';
  var ov = document.getElementById('ov'), f = document.getElementById('addForm'), st = document.getElementById('addStatus');
  ov.addEventListener('click', function(e){
    if (e.target === ov) return closeLayer();
    var b = e.target.closest('[data-x]'); if (!b) return;
    if (b.getAttribute('data-x') === 'close') closeLayer();
    if (b.getAttribute('data-x') === 'delete'){
      if (!confirm('Delete "' + s.title + '"?')) return;
      state.songs = state.songs.filter(function(x){ return x.id !== s.id; }); state.order = state.order.filter(function(x){ return x !== s.id; }); save(); closeLayer(); renderFloor();
    }
  });
  document.getElementById('pdfPick').addEventListener('change', async function(e){
    var file = e.target.files[0]; if (!file) return;
    var meta = fromFilename(file.name);
    if (!f.title.value) f.title.value = meta.title;
    if (!f.artist.value) f.artist.value = meta.artist;
    if (meta.capo && !f.capo.value) f.capo.value = meta.capo;
    st.textContent = 'reading the PDF…';
    try { f.chart.value = /\.pdf$/i.test(file.name) ? await pdfText(file) : await file.text(); st.textContent = 'got it! check it over, then save'; }
    catch(err){ st.textContent = err.message || 'couldn\'t read that PDF'; }
  });
  f.addEventListener('submit', function(e){
    e.preventDefault();
    var chart = normalise(f.chart.value).trim(), items = lineItems(chart);
    if (!items.length){ st.textContent = 'paste the song first'; return; }
    var fields = {title: f.title.value.trim() || 'Untitled', artist: f.artist.value.trim(), key: f.key.value.trim() || guessKey(items), capo: parseInt(f.capo.value, 10) || 0, chart: chart, notes: f.notes.value.trim()};
    if (s){ if (s.chart !== chart) s.mem = (s.mem || []).slice(0, items.length); Object.assign(s, fields); }
    else { s = Object.assign({id:'s' + Date.now().toString(36), demo:false, runs:0, last:0, mem:[]}, fields); state.songs.push(s); state.order.push(s.id); }
    save(); renderFloor(); toast(editId ? 'Saved' : 'On the set list: ' + s.title); openCue(s.id);
  });
  (s ? f.chart : f.title).focus();
}
document.getElementById('addBtn').addEventListener('click', function(){ openAdd(); });

var tt;
function toast(m){ var t = document.querySelector('.toast'); if (!t){ t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status'); document.body.appendChild(t); } t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(function(){ t.hidden = true; }, 2400); }

renderFloor();
window.__theSet = {lineItems: lineItems, progression: progression, maskLyric: maskLyric};
})();
