<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shopping | Caps Unlocked</title><style> *{box-sizing:border-box}body{margin:0;background:#f4f0e6;color:#29271f;font:17px system-ui,sans-serif}main{max-width:560px;margin:auto;padding:24px}a{color:inherit}h1{font:36px Georgia,serif;margin:24px 0 8px}p{color:#64645b}label{display:flex;align-items:center;gap:16px;padding:18px 0;border-bottom:1px solid #d8d2c6;cursor:pointer}input[type=checkbox]{appearance:none;flex:none;width:30px;height:30px;border:2px solid #777e68;border-radius:50%;margin:0;display:grid;place-items:center}input:checked{background:#536b4b;border-color:#536b4b}input:checked:after{content:'✓';color:white;font-size:21px}input:checked+span{text-decoration:line-through;color:#777}button{font:inherit;background:transparent;border:1px solid #777e68;border-radius:8px;padding:10px 16px;margin-top:24px;cursor:pointer}input:focus-visible,button:focus-visible{outline:3px solid #b18442;outline-offset:3px}</style></head><body><main><a href="/">← Caps Unlocked</a><h1>Shopping 🛒</h1><p>Roasted turban squash &amp; coconut curry</p><p id="count" aria-live="polite"></p><div id="list"></div><button id="reset">Reset checkmarks</button></main><script>const items=['Fresh cilantro','Jasmine rice','Roasted, unsalted peanuts','2 limes','Fish sauce','Fresh sugar snap peas (optional)'];const key='caps-shopping-20261123';let checked=[];try{checked=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(checked))checked=[]}catch{}const list=document.getElementById('list');function save(){try{localStorage.setItem(key,JSON.stringify(checked))}catch{}document.getElementById('count').textContent=checked.length+' of '+items.length+' collected'}function render(){list.replaceChildren();items.forEach((item,i)=>{const label=document.createElement('label'),input=document.createElement('input'),span=document.createElement('span');input.type='checkbox';input.checked=checked.includes(i);span.textContent=item;input.addEventListener('change',()=>{checked=checked.filter(n=>n!==i);if(input.checked)checked.push(i);save()});label.append(input,span);list.append(label)});save()}document.getElementById('reset').onclick=()=>{checked=[];render()};render();</script></body></html>
