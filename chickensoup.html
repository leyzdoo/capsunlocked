ont-size:25px;animation:heart 1.6s ease-out forwards;text-shadow:0 2px 8px #ae476e}@keyframes heart{to{transform:translateY(-105px) rotate(18deg);opacity:0}}.hotspot{position:absolute;left:17%;top:18%;width:65%;height:55%;cursor:pointer;background:transparent;border:0}.hint{position:absolute;top:20%;right:7%;font-family:Caveat,cursive;font-size:29px;transform:rotate(-8deg);text-shadow:0 2px 8px #292135}.tv{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:39%;aspect-ratio:1.77;background:#10455d;border:7px solid #282532;border-radius:8px;display:none;overflow:hidden}.tv span{display:grid;place-items:center;height:100%;font-size:clamp(17px,4vw,32px);font-weight:900;text-align:center}.tv.attack{background:radial-gradient(circle at 58% 60%,#a92c46 0 15%,#143d5d 42%,#092d46);animation:flash .3s 3}.tv.reef{background:linear-gradient(#2b9cae,#83bcb0)}@keyframes flash{50%{filter:brightness(1.8)}}@media(max-width:520px){.app{height:94svh}.painting{background-size:contain;background-position:center}.content{padding:18px 13px 28px}.content p{font-size:14px}.top{font-size:20px}}

function playRealisticSharks(){let i=0;const el=$('tvtext');const nextShot=()=>{if(scene!=='tv')return;el.style.backgroundImage='url("'+realisticSharkFrames[i]+'")';i++;if(i<realisticSharkFrames.length)schedule(nextShot,4300)};nextShot()}
function playSharkWeek(){const screen=$('tvtext');let i=0;const render=()=>{if(scene!=='tv')return;screen.style.backgroundImage='url("'+sharkPicture(i)+'")';screen.style.filter=i<2?'contrast(1.12) saturate(.78)':'saturate(.9)';if(i===2)$('description').textContent='The excitement fades into a peaceful ocean. Relax and enjoy the show. ♡';i++;if(i<6)schedule(render,i===1?1400:2200)};render()}
function pet(){if(scene!=='pet')return;pets++;puppySqueak();puppyReaction();$('description').textContent=['','Oh, look at that tail wag! ♡','He loves you so much! ♡','One more pet and he’ll roll over…'][Math.min(pets,3)];if(pets>=4){$('hotspot').style.pointerEvents='none';schedule(()=>{if(scene==='pet')next('belly');$('hotspot').style.pointerEvents='auto'},850)}}$('hotspot').onclick=()=>{if(scene==='pet')pet();};function finish(off){try{window.speechSynthesis?.cancel()}catch(e){}$('app').style.filter=off?'brightness(.7)':'none';next('ending')}

let puppyContext=null,puppyCount=0;
// Short playful two-part yips; temporary until the user's Pixabay MP3 is supplied.
function puppySqueak(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;puppyContext??=new AC();const ctx=puppyContext;if(ctx.state==='suspended')ctx.resume();const start=ctx.currentTime,base=420+(puppyCount++%3)*35;[0,.14].forEach((offset,i)=>{const t=start+offset,osc=ctx.createOscillator(),gain=ctx.createGain(),filter=ctx.createBiquadFilter();osc.type='sawtooth';filter.type='lowpass';filter.frequency.setValueAtTime(1250,t);filter.frequency.exponentialRampToValueAtTime(570,t+.12);osc.frequency.setValueAtTime(base*(i?.94:1),t);osc.frequency.exponentialRampToValueAtTime(base*1.7,t+.045);osc.frequency.exponentialRampToValueAtTime(base*.68,t+.15);gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.018,t+.018);gain.gain.exponentialRampToValueAtTime(.0001,t+.16);osc.connect(filter);filter.connect(gain);gain.connect(ctx.destination);osc.start(t);osc.stop(t+.17)})}catch(e){}}
function announceSharkWeek(){try{if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('Next on Shark Week…');u.lang='en-US';u.rate=.83;u.pitch=.72;u.volume=.6;window.speechSynthesis.speak(u)}catch(e){}}

function showFrame(src,caption,kind,index,total){$('painting').style.backgroundImage='url("'+src+'")';const el=$('frameVisual');el.style.display='none';return;el.style.backgroundImage='url("'+src+'")';el.className='frame-visual visible '+kind;$('frameCaption').textContent=caption||'';const dots=$('frameDots');dots.replaceChildren();if(total>1){dots.className='frame-dots show';for(let j=0;j<total;j++){const i=document.createElement('i');i.className=j===index?'on':'';dots.append(i)}}else dots.className='frame-dots'}
function hideFrame(){$('frameVisual').style.display='none';$('frameVisual').className='frame-visual';$('frameDots').className='frame-dots';$('frameVisual').querySelectorAll('.ingredient-fall,.steam-cloud').forEach(n=>n.remove())}
function puppyReaction(){const captions=['That little face! ♡','He loves your attention!','Belly rub bliss ♡','Completely content ♡'];const i=(pets-1)%4;showFrame(puppyFrames[i],captions[i],'puppy',i,4);hearts(3)}
function animateSoup(){const captions=['Fresh carrots and celery','Chicken goes into the pot','Pour in the broth','Stir and let it simmer','A warm bowl, made with love ♡'];let i=0;const step=()=>{if(scene!=='soup')return;showFrame(soupFrames[i],captions[i],'soup',i,5);const el=$('frameVisual');el.querySelectorAll('.ingredient-fall,.steam-cloud').forEach(n=>n.remove());if(false&&i>=1&&i<=3){for(let k=0;k<7;k++){let drop=document.createElement('span');drop.className='ingredient-fall';drop.textContent=['🥕','🥬','✦'][k%3];drop.style.left=(25+Math.random()*50)+'%';drop.style.animationDelay=(k*.12)+'s';el.append(drop)}}if(false&&i>=2){let steam=document.createElement('div');steam.className='steam-cloud';el.append(steam)}if(++i<5)schedule(step,1250)};step()}

next('start');
</script></body></html>
