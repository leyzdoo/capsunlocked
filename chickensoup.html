function showFrame(src,caption,kind,index,total){const el=$('frameVisual');el.style.backgroundImage='url("'+src+'")';el.className='frame-visual visible '+kind;$('frameCaption').textContent=caption||'';const dots=$('frameDots');dots.replaceChildren();if(total>1){dots.className='frame-dots show';for(let j=0;j<total;j++){const i=document.createElement('i');i.className=j===index?'on':'';dots.append(i)}}else dots.className='frame-dots'}
function hideFrame(){$('frameVisual').className='frame-visual';$('frameDots').className='frame-dots';$('frameVisual').querySelectorAll('.ingredient-fall,.steam-cloud').forEach(n=>n.remove())}
function puppyReaction(){const captions=['That little face! ♡','He loves your attention!','Belly rub bliss ♡','Completely content ♡'];const i=(pets-1)%4;showFrame(puppyFrames[i],captions[i],'puppy',i,4);hearts(3)}
function animateSoup(){const captions=['Fresh carrots and celery','Chicken goes into the pot','Pour in the broth','Stir and let it simmer','A warm bowl, made with love ♡'];let i=0;const step=()=>{if(scene!=='soup')return;showFrame(soupFrames[i],captions[i],'soup',i,5);const el=$('frameVisual');el.querySelectorAll('.ingredient-fall,.steam-cloud').forEach(n=>n.remove());if(i>=1&&i<=3){for(let k=0;k<7;k++){let drop=document.createElement('span');drop.className='ingredient-fall';drop.textContent=['🥕','🥬','✦'][k%3];drop.style.left=(25+Math.random()*50)+'%';drop.style.animationDelay=(k*.12)+'s';el.append(drop)}}if(i>=2){let steam=document.createElement('div');steam.className='steam-cloud';el.append(steam)}if(++i<5)schedule(step,1250)};step()}

next('start');
</script></body></html>
