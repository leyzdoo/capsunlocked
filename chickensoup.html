<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#33275f">
<title>Chicken Soup ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#3b2d70; --bg2:#2a2052; --cream:#f4ecd8; --ink:#4a3424; --rose:#ffd9e4;
    --hand:'Caveat','Bradley Hand','Segoe Print','Comic Sans MS',cursive;
    --ui:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg2);color:#fff;font-family:var(--ui);overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  body{display:flex;flex-direction:column;height:100dvh;
    background:radial-gradient(120% 80% at 50% 35%,#45367f 0%,var(--bg1) 45%,var(--bg2) 100%);
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

  /* ---------- top bar ---------- */
  .top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 0;min-height:48px}
  .brand{font-family:var(--hand);font-size:22px;letter-spacing:.3px;opacity:.85}
  .iconbtn{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;
    display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .iconbtn svg{width:19px;height:19px}
  .iconbtn:active{transform:scale(.92)}
  .tools{display:flex;gap:8px}

  /* ---------- stage ---------- */
  .stage{flex:1;position:relative;container-type:size;margin:6px 12px}
  .slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    opacity:0;transition:opacity .9s ease;pointer-events:none}
  .slide.on{opacity:1;pointer-events:auto;z-index:2}
  .frame{position:relative;aspect-ratio:var(--r);width:min(100cqw, calc(100cqh * var(--r)));
    border-radius:14px;overflow:hidden;box-shadow:0 18px 50px rgba(10,5,35,.55),0 0 0 1px rgba(255,255,255,.08)}
  .kb{position:absolute;inset:0;transform-origin:50% 45%}
  .frame{container-type:inline-size}
  .say{position:absolute;z-index:4;font-family:var(--hand);font-weight:500;line-height:1.08;color:#fffaf0;
    text-shadow:0 2px 10px rgba(30,15,50,.55),0 0 2px rgba(0,0,0,.25);pointer-events:none;white-space:nowrap}
  .slide[data-id=sorry] .frame{cursor:pointer}
  .slide.on .kb.move{animation:kb var(--d,6s) ease-out forwards}
  @keyframes kb{from{transform:scale(1)}to{transform:scale(1.045)}}
  .kb img{width:100%;height:100%;display:block;object-fit:cover;pointer-events:none}

  /* puppy */
  .pup .frame{cursor:pointer;touch-action:manipulation}
  .pup .kb.wiggle{animation:wig .45s ease}
  @keyframes wig{0%{transform:scale(1) rotate(0)}25%{transform:scale(.97) rotate(-1.2deg)}55%{transform:scale(1.025) rotate(1deg)}100%{transform:scale(1) rotate(0)}}
  .heart{position:absolute;pointer-events:none;width:var(--s,28px);height:var(--s,28px);z-index:5;
    animation:float var(--t,1.6s) ease-out forwards;filter:drop-shadow(0 2px 4px rgba(120,40,80,.35))}
  @keyframes float{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}
    15%{transform:translate(-50%,-60%) scale(1.1);opacity:1}
    100%{transform:translate(calc(-50% + var(--dx,0px)),calc(-50% - var(--dy,140px))) scale(.9) rotate(var(--rot,0deg));opacity:0}}
  .ambient{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:4}
  .ambient .heart{animation-timing-function:ease-in-out}

  /* overlay buttons sitting exactly on the painted ones */
  .hot{position:absolute;border:0;background:transparent;border-radius:999px;cursor:pointer;z-index:6;
    transition:box-shadow .25s, background .25s, transform .15s}
  .hot:active{transform:scale(.95)}
  .hot.pick{box-shadow:0 0 0 3px #fff,0 0 22px 6px rgba(255,236,180,.85);background:rgba(255,245,215,.18)}
  .hot.pulse{animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,240,200,.0)}50%{box-shadow:0 0 0 4px rgba(255,240,200,.55)}}

  /* lights */
  .lights{position:absolute;left:31.3%;top:43.7%;width:59%;height:30.6%;border-radius:6px;pointer-events:none;z-index:3;
    box-shadow:0 0 0 2000px rgba(8,4,28,.5),0 0 60px 18px rgba(90,150,255,.45);opacity:0;transition:opacity 1s ease}
  .lights.off{opacity:1}
  .lamp{position:absolute;inset:0;pointer-events:none;z-index:3;background:radial-gradient(60% 50% at 8% 70%,rgba(255,200,110,.28),transparent 70%);
    mix-blend-mode:screen;opacity:0;transition:opacity 1s}
  .lamp.on{opacity:1}
  .tv{position:absolute;inset:0;opacity:0;transition:opacity .9s ease;z-index:1}
  .tv.on{opacity:1}
  .tv img{width:100%;height:100%;object-fit:cover;display:block}

  /* tap-to-enhance hint */
  .chip{position:absolute;right:10px;bottom:10px;z-index:7;font:600 12px/1 var(--ui);padding:7px 10px;border-radius:999px;
    background:rgba(20,12,50,.55);color:#fff;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    display:flex;gap:6px;align-items:center;pointer-events:none;opacity:.0;transition:opacity .6s}
  .slide.on .chip{opacity:.9}
  .chip svg{width:13px;height:13px}

  /* ---------- bottom ---------- */
  .bottom{min-height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:6px 16px 14px}
  .dots{display:flex;gap:10px;height:14px;align-items:center}
  .dots i{width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.85);transition:background .3s,transform .3s}
  .dots i.on{background:#fff;transform:scale(1.1)}
  .hint{font-family:var(--hand);font-size:24px;color:#fff;opacity:.9;text-align:center;line-height:1}
  .cta{font-family:var(--hand);font-weight:700;font-size:26px;color:var(--ink);background:var(--cream);border:0;border-radius:999px;
    padding:10px 26px 12px;box-shadow:0 6px 0 #c9b998,0 12px 26px rgba(0,0,0,.35);cursor:pointer;transition:transform .12s,box-shadow .12s;
    display:flex;gap:10px;align-items:center}
  .cta:active{transform:translateY(4px);box-shadow:0 2px 0 #c9b998,0 6px 14px rgba(0,0,0,.35)}
  .cta.ghost{background:rgba(255,255,255,.14);color:#fff;box-shadow:none;font-size:22px;padding:8px 20px 10px}
  .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .progress{width:min(520px,80vw);height:4px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden}
  .progress b{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffe7a8,#ffc6d9);border-radius:4px}
  .hidden{display:none!important}
  .fadein{animation:fi .7s ease both}
  @keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ---------- enhance lightbox ---------- */
  .lb{position:fixed;inset:0;z-index:50;background:rgba(10,6,28,.96);display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .35s}
  .lb.open{opacity:1;pointer-events:auto}
  .lbwrap{position:relative;width:100vw;height:100dvh;overflow:hidden;touch-action:manipulation}
  .lbwrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:transform .7s cubic-bezier(.2,.8,.2,1),filter .7s}
  .lbwrap.zoom img{filter:contrast(1.08) saturate(1.12)}
  .scan{position:absolute;inset:0;pointer-events:none;opacity:0;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 2px,transparent 2px 5px)}
  .scan.go{animation:scan .8s ease}
  @keyframes scan{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
  .lbtag{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 18px);transform:translateX(-50%);font:700 13px/1 var(--ui);letter-spacing:3px;
    padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.12);color:#ffe7a8}
  .lbclose{position:absolute;right:calc(env(safe-area-inset-right) + 16px);top:calc(env(safe-area-inset-top) + 12px)}
  .lbhelp{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translateX(-50%);font-family:var(--hand);font-size:22px;opacity:.85;white-space:nowrap}

  /* start veil (unlocks audio on iOS) */
  .veil{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:radial-gradient(120% 90% at 50% 40%,rgba(69,54,127,.75),rgba(30,22,60,.94));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    transition:opacity .6s}
  .veil.gone{opacity:0;pointer-events:none}
  .veil h1{font-family:var(--hand);font-weight:700;font-size:clamp(38px,9vw,64px);margin:0;text-align:center;line-height:1}
  .veil p{margin:0;font-family:var(--hand);font-size:24px;opacity:.85}
  .bowlicon{font-size:64px;animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

  @media (min-width:768px){ .stage{margin:10px 28px} .bottom{min-height:140px} }
  @media (prefers-reduced-motion:reduce){ .slide.on .kb.move{animation:none} }
</style>
</head>
<body>

<div class="top">
  <div class="brand">chicken soup ♡</div>
  <div class="tools">
    <button class="iconbtn" id="sndBtn" aria-label="Sound">
      <svg id="sndOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
      <svg id="sndOff" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="m17 9 5 6M22 9l-5 6"/></svg>
    </button>
  </div>
</div>

<div class="stage" id="stage"></div>

<div class="bottom" id="bottom">
  <div class="dots" id="dots"></div>
  <div class="hint" id="hint">pet the puppy 🐾</div>
  <button class="cta hidden" id="go">🍲 Make me chicken soup</button>
  <div class="progress hidden" id="prog"><b id="progb"></b></div>
  <div class="row hidden" id="endRow">
    <button class="cta" id="again">↺ Watch again</button>
    <button class="cta ghost" id="toPup">🐶 Puppy</button>
  </div>
</div>

<div class="veil" id="veil">
  <div class="bowlicon">🍲</div>
  <h1>Not feeling well?</h1>
  <p>tap to begin ♡</p>
</div>

<script>
(() => {
const IMG = '/assets/chickensoup/';
const R = {bowl:1.4448,chop:1.8626,cozy:1.3379,feel:2.0301,love:1.3734,p_chin:1.526,p_face:1.4659,p_pet:1.5115,p_real:1.208,p_roll:1.5184,p_roll2:1.8201,pot:1.4533,shark:1.0391,sorry:1.8002,stir:1.5284,stir_close:1.8131,tea:1.2748,tray:1.4923};

const PUPS = ['p_real','p_face','p_pet','p_roll','p_chin','p_roll2'];
// soup timeline (seconds) — about a minute end to end
const SCENES = [
  {id:'sorry', d:3, kind:'hall'},
  {id:'chop', d:3.5},
  {id:'love', d:6, sfx:'bubble'},
  {id:'tray', d:6},
  {id:'cozy', d:5},
  {id:'shark', d:15, kind:'shark'},
  {id:'feel', d:0, kind:'end'}
];
const TOTAL = SCENES.reduce((a,s)=>a+s.d,0);

const $ = s => document.querySelector(s);
const stage = $('#stage');
const heartSVG = c => `<svg viewBox="0 0 32 30"><path d="M16 28S2 19.5 2 10.2C2 5.6 5.5 2 9.8 2c2.7 0 5 1.4 6.2 3.6C17.2 3.4 19.5 2 22.2 2 26.5 2 30 5.6 30 10.2 30 19.5 16 28 16 28z" fill="${c}" stroke="#fff" stroke-width="1.6"/></svg>`;
const HC = ['#ffd3e0','#ffc0d3','#ffe3b8','#fff','#ffb3c9','#f7d6ff'];

/* ---------------- build slides ---------------- */
function makeSlide(id, ratio, opts={}){
  const s = document.createElement('div'); s.className='slide'; s.dataset.id=id;
  s.innerHTML = `<div class="frame" style="--r:${ratio}"><div class="kb ${opts.kb===false?'':'move'}"><img alt="" src="${IMG+(opts.src||id)}.jpg" decoding="async"></div></div>`;
  stage.appendChild(s); return s;
}
const slides = {};
PUPS.forEach(p => { const s = makeSlide(p, R[p], {kb:false}); s.classList.add('pup'); slides[p]=s; });
SCENES.forEach(sc => {
  if (sc.kind==='shark') return;
  slides[sc.id] = makeSlide(sc.id, R[sc.id], sc.id==='feel'?{src:'end'}:{});
});
// puppy ambient hearts layer
PUPS.forEach(p => slides[p].querySelector('.frame').insertAdjacentHTML('beforeend','<div class="ambient"></div>'));
// feel-better ambient hearts too
slides.feel.querySelector('.frame').insertAdjacentHTML('beforeend','<div class="ambient"></div>');

// cozy: real buttons over the painted ones
const cozyF = slides.cozy.querySelector('.kb');
cozyF.insertAdjacentHTML('beforeend',`<div class="say" style="left:5%;top:9%;width:52%;transform:rotate(-4deg);font-size:7.4cqw">Let’s get you cozy.</div>`);
slides.feel.querySelector('.kb').insertAdjacentHTML('beforeend',`<div class="say" style="left:5%;top:9%;font-size:7cqw;transform:rotate(-3deg)">Feel Better ♡</div>`);
// shark: base + TV channel layers + lights + buttons
const sh = makeSlide('shark', R.shark, {src:'shark2', kb:false});
slides.shark = sh;
const shKB = sh.querySelector('.kb');
['shark1','shark3','shark4','shark5'].forEach(n => shKB.insertAdjacentHTML('beforeend',`<div class="tv" data-ch="${n}"><img alt="" src="${IMG+n}.jpg"></div>`));
shKB.insertAdjacentHTML('beforeend',`<div class="say" style="left:14%;right:5%;top:9%;text-align:center;font-size:8.4cqw">How about you<br>enjoy a show?</div>`);
sh.querySelector('.frame').insertAdjacentHTML('beforeend','<div class="ambient"></div>');

// dots
const dots = $('#dots');
PUPS.forEach(()=>dots.insertAdjacentHTML('beforeend','<i></i>'));

let current = null;
function show(id){
  if (current===id) { restartKB(slides[id]); return; }
  Object.values(slides).forEach(s => s.classList.toggle('on', s.dataset.id===id));
  restartKB(slides[id]); current = id;
}
function restartKB(s){ const kb=s.querySelector('.kb.move'); if(kb){ kb.style.animation='none'; kb.offsetWidth; kb.style.animation=''; } }

/* ---------------- audio ---------------- */
let ac=null, muted=false;
function audio(){ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(ac&&ac.state==='suspended') ac.resume(); return ac; }
function out(g=1){ const a=audio(); const v=a.createGain(); v.gain.value=muted?0:g; v.connect(a.destination); return v; }

// Puppy squeal: short high, warbly yips that slide up then droop — like a squeaky pup
function squeal(){
  const a=audio(); if(!a||muted) return;
  const kind = Math.random();
  const n = kind<.45 ? 2+Math.floor(Math.random()*2) : 1;
  let t=a.currentTime+0.01;
  for(let i=0;i<n;i++){
    const long = (n===1);
    const dur = long ? 0.42+Math.random()*0.2 : 0.11+Math.random()*0.06;
    const base = 1050+Math.random()*350, peak = base*(1.55+Math.random()*0.35);
    const o=a.createOscillator(), o2=a.createOscillator(), g=a.createGain(), g2=a.createGain(), hp=a.createBiquadFilter(), lfo=a.createOscillator(), lg=a.createGain();
    o.type='sine'; o2.type='triangle'; hp.type='highpass'; hp.frequency.value=600;
    lfo.frequency.value = long ? 9+Math.random()*4 : 32; lg.gain.value = long ? base*0.06 : base*0.03;
    lfo.connect(lg); lg.connect(o.frequency); lg.connect(o2.frequency);
    o.frequency.setValueAtTime(base,t);
    o.frequency.exponentialRampToValueAtTime(peak,t+dur*0.35);
    o.frequency.exponentialRampToValueAtTime(base*(long?0.8:0.95),t+dur);
    o2.frequency.setValueAtTime(base*2,t);
    o2.frequency.exponentialRampToValueAtTime(peak*2,t+dur*0.35);
    o2.frequency.exponentialRampToValueAtTime(base*(long?1.6:1.9),t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.32,t+0.018);
    g.gain.setValueAtTime(0.3,t+dur*0.6); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    g2.gain.value=0.07;
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(hp); hp.connect(out(0.9));
    [o,o2,lfo].forEach(x=>{x.start(t);x.stop(t+dur+0.05);});
    t += dur + 0.05 + Math.random()*0.05;
  }
}
function noiseBuf(){ const a=audio(); const b=a.createBuffer(1,a.sampleRate*0.25,a.sampleRate); const d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,6); return b; }
let nb=null;
function chop(){ const a=audio(); if(!a||muted) return; nb=nb||noiseBuf(); const s=a.createBufferSource(); s.buffer=nb; const f=a.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1500+Math.random()*700; f.Q.value=1.2; s.connect(f); f.connect(out(0.35)); s.start();
  const o=a.createOscillator(), g=a.createGain(); o.frequency.value=170; g.gain.setValueAtTime(0.15,a.currentTime); g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+0.08); o.connect(g); g.connect(out(1)); o.start(); o.stop(a.currentTime+0.1); }
function blub(){ const a=audio(); if(!a||muted) return; const t=a.currentTime; const o=a.createOscillator(), g=a.createGain(); const f=180+Math.random()*160;
  o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(f*2.2,t+0.09); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.09,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.12); o.connect(g); g.connect(out(1)); o.start(t); o.stop(t+0.14); }
function chime(){ const a=audio(); if(!a||muted) return; const t=a.currentTime; [784,988,1175,1568].forEach((f,i)=>{ const o=a.createOscillator(), g=a.createGain(); o.type='sine'; o.frequency.value=f; const s=t+i*0.12; g.gain.setValueAtTime(0.0001,s); g.gain.exponentialRampToValueAtTime(0.12,s+0.02); g.gain.exponentialRampToValueAtTime(0.0001,s+1.4); o.connect(g); g.connect(out(1)); o.start(s); o.stop(s+1.5); }); }
function tick(){ const a=audio(); if(!a||muted) return; const t=a.currentTime; const o=a.createOscillator(), g=a.createGain(); o.frequency.value=1200; g.gain.setValueAtTime(0.06,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.06); o.connect(g); g.connect(out(1)); o.start(t); o.stop(t+0.07); }

$('#sndBtn').onclick = e => { e.stopPropagation(); muted=!muted; $('#sndOn').classList.toggle('hidden',muted); $('#sndOff').classList.toggle('hidden',!muted); if(!muted) audio(); };

/* ---------------- hearts ---------------- */
function heart(layer, x, y, o={}){
  const h=document.createElement('div'); h.className='heart';
  const s=o.size||(20+Math.random()*22);
  h.style.cssText=`left:${x}px;top:${y}px;--s:${s}px;--dx:${(Math.random()-.5)*(o.spread||120)}px;--dy:${(o.rise||110)+Math.random()*90}px;--rot:${(Math.random()-.5)*50}deg;--t:${(o.t||1.4)+Math.random()*0.8}s`;
  h.innerHTML=heartSVG(o.color||HC[Math.floor(Math.random()*HC.length)]);
  layer.appendChild(h); h.addEventListener('animationend',()=>h.remove());
}
function burst(slide, cx, cy, n=7){
  const layer=slide.querySelector('.ambient')||slide.querySelector('.frame');
  for(let i=0;i<n;i++) setTimeout(()=>heart(layer,cx+(Math.random()-.5)*40,cy+(Math.random()-.5)*30),i*45);
}
let ambientTimer=null;
function ambient(on, slideId, opts={}){
  clearInterval(ambientTimer); if(!on) return;
  ambientTimer=setInterval(()=>{
    const s=slides[slideId||current]; if(!s||!s.classList.contains('on')) return;
    const layer=s.querySelector('.ambient'); if(!layer) return;
    const r=layer.getBoundingClientRect();
    const x = opts.xs ? r.width*(opts.xs[0]+Math.random()*(opts.xs[1]-opts.xs[0])) : r.width*(Math.random()<.5?0.05+Math.random()*0.25:0.7+Math.random()*0.25);
    const y = r.height*(opts.ys ? opts.ys[0]+Math.random()*(opts.ys[1]-opts.ys[0]) : 0.45+Math.random()*0.45);
    heart(layer,x,y,{size:16+Math.random()*16,rise:70,spread:40,t:2.2,color:opts.color});
  }, opts.every||650);
}

/* ---------------- puppy play ---------------- */
let mode='pup', pupIdx=0, pets=0;
function setPup(i){
  pupIdx=(i+PUPS.length)%PUPS.length; show(PUPS[pupIdx]);
  [...dots.children].forEach((d,k)=>d.classList.toggle('on',k===pupIdx));
}
function enterPuppy(){
  mode='pup'; stopRun();
  $('#endRow').classList.add('hidden'); $('#prog').classList.add('hidden');
  $('#dots').classList.remove('hidden'); $('#hint').classList.remove('hidden');
  $('#hint').textContent = pets ? 'more pets? 🐾' : 'pet the puppy 🐾';
  if (pets>=2) $('#go').classList.remove('hidden');
  setPup(0); ambient(true);
}
PUPS.forEach(p => {
  const f = slides[p].querySelector('.frame');
  f.addEventListener('pointerdown', e => {
    if (mode!=='pup') return;
    const r=f.getBoundingClientRect();
    burst(slides[p], e.clientX-r.left, e.clientY-r.top, 6+Math.floor(Math.random()*4));
    squeal();
    const kb=slides[p].querySelector('.kb'); kb.classList.remove('wiggle'); kb.offsetWidth; kb.classList.add('wiggle');
    pets++;
    if (pets===2) { $('#go').classList.remove('hidden'); $('#go').classList.add('fadein'); $('#hint').textContent='keep petting, or…'; }
    // every couple of pets the pup switches up its pose (the carousel in the original)
    if (pets%2===0) setTimeout(()=>setPup(pupIdx+1), 380);
  });
});
// if they just sit there, gently invite them along
setTimeout(()=>{ if(mode==='pup'){ $('#go').classList.remove('hidden'); $('#go').classList.add('fadein'); } }, 9000);

/* ---------------- soup timeline ---------------- */
let idx=-1, t0=0, elapsed=0, sceneEl=0, paused=false, raf=null, lastT=0, sfxTimer=0, chan=0, lights=null;
function stopRun(){ clearInterval(raf); raf=null; }
function startSoup(){
  mode='soup'; ambient(false); audio();
  $('#go').classList.add('hidden'); $('#dots').classList.add('hidden'); $('#hint').classList.add('hidden');
  $('#endRow').classList.add('hidden'); $('#prog').classList.remove('hidden');
  idx=-1; elapsed=0; lights=null; resetShark(); next();
  lastT=performance.now(); paused=false; stopRun(); raf=setInterval(loop,50);
}
function next(){
  idx++; sceneEl=0; sfxTimer=0;
  const sc=SCENES[idx]; if(!sc) return;
  slides[sc.id].style.setProperty('--d', (sc.d+1.2)+'s');
  slides[sc.id].querySelector('.kb').style.setProperty('--d',(sc.d+1.2)+'s');
  show(sc.id); ambient(false);
  if (sc.kind==='shark'){ chan=0; setChannel(null); }
  if (sc.kind==='end'){ finish(); }
}
function loop(){
  // wall-clock timing (setInterval, not rAF) so iOS throttling can't stall the story
  const now=performance.now(), dt=Math.min(1,Math.max(0,(now-lastT)/1000)); lastT=now;
  if (paused) return;
  const sc=SCENES[idx]; if(!sc||sc.kind==='end') return;
  sceneEl+=dt; elapsed+=dt; sfxTimer+=dt;
  $('#progb').style.width = Math.min(100, elapsed/TOTAL*100)+'%';
  if (sc.sfx==='bubble' && sfxTimer>0.28){ sfxTimer=0; if(Math.random()<.7) blub(); }
  if (sc.kind==='shark'){
    // TV programme: great white → kelp → deep blue → reef → SHARK WEEK ♡
    const plan=[[0,'shark1'],[2.8,null],[5.4,'shark3'],[8,'shark4'],[11.4,'shark5']];
    let want=null; plan.forEach(([at,ch])=>{ if(sceneEl>=at) want=ch; });
    if (want!==chan){ chan=want; setChannel(want); if(want==='shark5'){ chime(); ambient(true,'shark',{xs:[.28,.9],ys:[.3,.8],every:180,color:'#fff'}); } }
  }
  if (sceneEl>=sc.d) next();
}
function setChannel(ch){ slides.shark.querySelectorAll('.tv').forEach(t=>t.classList.toggle('on',t.dataset.ch===ch)); }
function resetShark(){ setChannel(null); chan=0; }
function finish(){
  $('#progb').style.width='100%';
  setTimeout(()=>{ $('#prog').classList.add('hidden'); $('#endRow').classList.remove('hidden'); $('#endRow').classList.add('fadein'); }, 1200);
  chime();
  ambient(true,'feel',{xs:[.55,.95],ys:[.15,.6],every:420});
  setTimeout(()=>{ if(mode==='soup') squeal(); }, 1600);
}
$('#go').onclick = startSoup;
$('#again').onclick = startSoup;
$('#toPup').onclick = () => { setChannel(null); enterPuppy(); };

/* ---------------- hallway: tap to go to the kitchen ---------------- */
slides.sorry.querySelector('.frame').addEventListener('click', () => {
  if (mode!=='soup' || SCENES[idx].kind!=='hall') return;
  elapsed += Math.max(0, SCENES[idx].d - sceneEl); sceneEl = SCENES[idx].d;
});

/* ---------------- start ---------------- */
// preload everything so the minute plays smoothly
['p_real','p_face','p_pet','p_roll','p_chin','p_roll2','sorry','chop','love','tray','cozy','shark1','shark2','shark3','shark4','shark5','end']
  .forEach(n=>{ const i=new Image(); i.src=IMG+n+'.jpg'; });
setPup(0);
$('#veil').addEventListener('click', () => { audio(); $('#veil').classList.add('gone'); enterPuppy(); setTimeout(squeal,350); }, {once:true});
document.addEventListener('visibilitychange',()=>{ lastT=performance.now(); paused=false; });
})();
</script>
