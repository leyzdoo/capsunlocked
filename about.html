<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0c0a">
<title>Bio · James Leyba · Caps Unlocked</title>
<meta name="description" content="James Leyba: a systems-minded problem solver in housing finance, urban planning and applied AI who starts every redesign by listening to the people inside the system.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Caveat:wght@600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0d0c0a; --ink2:#16130f; --line:#2b261e;
    --paper:#ece4d3; --paper-hi:#f6f0e2; --paper-dim:#bdb3a0; --faded:#8d8471;
    --brass:#c9a46a; --rust:#c24f36; --sage:#8fae79;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--paper);}
  body{font-family:'Source Serif 4',Georgia,serif;-webkit-font-smoothing:antialiased;}
  a{color:inherit;}
  button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  :focus-visible{outline:2px solid var(--brass);outline-offset:3px;}

  /* ---------- top bar ---------- */
  .top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:18px;padding:16px 26px;padding-top:max(16px, env(safe-area-inset-top));}
  .brand{font-family:'Special Elite',monospace;font-size:1.05rem;letter-spacing:0.08em;text-decoration:none;color:var(--paper);}
  .brand span{color:var(--rust);}
  .top nav{margin-left:auto;display:flex;gap:18px;}
  .top nav a{font-family:'IBM Plex Mono',monospace;font-size:0.72rem;letter-spacing:0.14em;text-transform:uppercase;text-decoration:none;color:var(--faded);}
  .top nav a:hover,.top nav a[aria-current]{color:var(--paper);}

  /* ---------- deck ---------- */
  .deck{position:fixed;inset:0;}
  .deck::before{ /* faint paper grain + vignette */
    content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(ellipse 70% 60% at 50% 45%, rgba(201,164,106,0.07), rgba(0,0,0,0) 70%),
      radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);
  }
  .ghost{
    position:absolute;right:-2vw;bottom:6vh;z-index:0;pointer-events:none;
    font-family:'Special Elite',monospace;font-size:clamp(7rem,24vw,22rem);line-height:0.8;color:rgba(236,228,211,0.035);
    transition:transform 700ms cubic-bezier(.2,.7,.2,1), opacity 500ms ease;white-space:nowrap;
  }
  .slide{
    position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;
    padding:76px 9vw 112px;visibility:hidden;overflow-y:auto;
  }
  .slide.active{visibility:visible;}
  .slide.leaving{visibility:visible;}
  .inner{width:min(1080px,100%);margin:auto 0;}

  /* everything that animates */
  .fx{opacity:0;transition:opacity 520ms ease, transform 640ms cubic-bezier(.2,.75,.2,1);transition-delay:calc(var(--d, 0) * 70ms);}
  .slide.active .fx{opacity:1;transform:none;}
  /* default: come from the direction of travel */
  .deck[data-dir="fwd"] .slide:not(.active) .fx{transform:translateX(70px);}
  .deck[data-dir="back"] .slide:not(.active) .fx{transform:translateX(-70px);}
  .deck[data-dir="fwd"] .slide.leaving .fx{transform:translateX(-70px);transition-delay:0ms;transition-duration:260ms;}
  .deck[data-dir="back"] .slide.leaving .fx{transform:translateX(70px);transition-delay:0ms;transition-duration:260ms;}
  /* listened-to cards always arrive from the left, builds from the right: they meet in the middle */
  .slide:not(.active) .fx.from-left{transform:translateX(-140px)!important;}
  .slide:not(.active) .fx.from-right{transform:translateX(140px)!important;}
  .slide:not(.active) .fx.from-below{transform:translateY(30px)!important;}

  /* ---------- chapter layout ---------- */
  .stamp{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;font-family:'IBM Plex Mono',monospace;font-size:0.76rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--brass);}
  .stamp .yrs{color:var(--paper);background:rgba(194,79,54,0.18);border:1px solid rgba(194,79,54,0.5);padding:3px 8px;}
  .role{font-family:'IBM Plex Mono',monospace;font-size:0.82rem;color:var(--paper-dim);margin-top:10px;}
  h2{font-family:'Special Elite',monospace;font-weight:400;font-size:clamp(1.7rem,min(3.6vw,5.4vh),3.3rem);line-height:1.05;margin:1.4vh 0 1.4vh;max-width:24ch;}
  .lede{font-size:clamp(1rem,min(1.5vw,2.3vh),1.25rem);line-height:1.55;color:var(--paper-dim);max-width:62ch;margin:0;}

  .meet{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:stretch;margin-top:min(30px,3vh);}
  .col{padding:16px 18px;border:1px solid var(--line);background:rgba(22,19,15,0.86);}
  .col h3{margin:0 0 10px;font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:0.7rem;letter-spacing:0.18em;text-transform:uppercase;}
  .col.listen h3{color:var(--sage);}
  .col.build h3{color:var(--rust);}
  .col ul{list-style:none;margin:0;padding:0;display:grid;gap:7px;}
  .col li{font-size:clamp(0.9rem,1.9vh,0.98rem);line-height:1.4;padding-left:16px;position:relative;}
  .col li::before{content:"";position:absolute;left:0;top:0.62em;width:7px;height:2px;}
  .col.listen li::before{background:var(--sage);}
  .col.build li::before{background:var(--rust);}
  .arrow{display:flex;align-items:center;justify-content:center;font-family:'Caveat',cursive;font-weight:700;font-size:1.5rem;color:var(--brass);writing-mode:horizontal-tb;text-align:center;line-height:1;}
  .arrow b{display:block;font-size:2rem;}
  .insight{
    margin-top:min(26px,2.6vh);font-family:'Caveat',cursive;font-weight:600;font-size:clamp(1.35rem,min(2.2vw,3.4vh),1.85rem);line-height:1.2;color:var(--paper-hi);
    max-width:46ch;padding-left:16px;border-left:3px solid var(--rust);
  }
  .stats{display:flex;gap:26px;flex-wrap:wrap;margin-top:min(20px,2vh);}
  .stat b{display:block;font-family:'Special Elite',monospace;font-weight:400;font-size:clamp(1.4rem,min(2.6vw,4vh),2.3rem);color:var(--paper-hi);line-height:1;}
  .stat span{font-family:'IBM Plex Mono',monospace;font-size:0.7rem;letter-spacing:0.08em;color:var(--faded);text-transform:uppercase;}

  /* the loop indicator */
  .loop{display:flex;gap:6px;align-items:center;margin-bottom:min(18px,1.8vh);flex-wrap:wrap;}
  .loop span{font-family:'IBM Plex Mono',monospace;font-size:0.66rem;letter-spacing:0.14em;text-transform:uppercase;padding:4px 9px;border:1px solid var(--line);color:#5e574b;}
  .loop i{color:#3c362c;font-style:normal;font-size:0.8rem;}
  .loop span.on{color:var(--ink);background:var(--brass);border-color:var(--brass);}

  /* cover */
  .cover h1{font-family:'Special Elite',monospace;font-weight:400;font-size:clamp(3rem,9vw,7.5rem);line-height:0.95;margin:10px 0 18px;}
  .cover h1 em{font-style:normal;color:var(--rust);}
  .cover .tag{font-size:clamp(1.25rem,2.6vw,2rem);line-height:1.35;max-width:30ch;color:var(--paper);margin:0 0 22px;}
  .cover .fields{display:flex;gap:10px;flex-wrap:wrap;}
  .cover .fields span{font-family:'IBM Plex Mono',monospace;font-size:0.78rem;letter-spacing:0.08em;padding:6px 11px;border:1px solid var(--line);color:var(--paper-dim);}
  .begin{margin-top:40px;font-family:'Caveat',cursive;font-size:1.6rem;color:var(--brass);}

  /* method slide */
  .method{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:30px;}
  .step{padding:18px 16px 20px;border:1px solid var(--line);background:rgba(22,19,15,0.86);position:relative;}
  .step b{font-family:'Special Elite',monospace;font-weight:400;font-size:2.2rem;color:var(--brass);display:block;line-height:1;}
  .step h3{margin:10px 0 6px;font-family:'Special Elite',monospace;font-weight:400;font-size:1.35rem;}
  .step p{margin:0;font-size:0.98rem;line-height:1.45;color:var(--paper-dim);}
  .step:not(:last-child)::after{content:"→";position:absolute;right:-13px;top:50%;transform:translateY(-50%);color:var(--brass);font-size:1.2rem;z-index:2;}

  /* closing */
  .close-links{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px;}
  .cta{display:inline-flex;align-items:center;gap:8px;padding:13px 20px;font-family:'IBM Plex Mono',monospace;font-size:0.82rem;letter-spacing:0.06em;text-decoration:none;border:1px solid var(--brass);color:var(--paper);}
  .cta.primary{background:var(--rust);border-color:var(--rust);}
  .cta:hover{filter:brightness(1.15);}

  /* ---------- controls ---------- */
  .nav-btn{
    position:fixed;top:50%;z-index:15;transform:translateY(-50%);
    width:54px;height:54px;border-radius:50%;border:1px solid var(--line);background:rgba(13,12,10,0.7);
    font-size:1.3rem;color:var(--paper-dim);display:flex;align-items:center;justify-content:center;
  }
  .nav-btn:hover{color:var(--paper);border-color:var(--brass);}
  .nav-btn:disabled{opacity:0.15;cursor:default;}
  #prev{left:max(14px, env(safe-area-inset-left));}
  #next{right:max(14px, env(safe-area-inset-right));}
  .rail{
    position:fixed;left:0;right:0;bottom:0;z-index:15;
    padding:14px 26px calc(16px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg, var(--ink) 55%, rgba(13,12,10,0));
  }
  .rail-track{position:relative;display:flex;justify-content:space-between;align-items:flex-end;max-width:1100px;margin:0 auto;}
  .rail-track::before{content:"";position:absolute;left:6px;right:6px;bottom:5px;height:1px;background:var(--line);}
  .rail-fill{position:absolute;left:6px;bottom:5px;height:1px;background:var(--brass);transition:width 600ms cubic-bezier(.2,.7,.2,1);}
  .tick{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;padding:0;min-width:12px;}
  .tick i{display:block;width:11px;height:11px;border-radius:50%;border:1px solid #4a4337;background:var(--ink);transition:all 300ms ease;}
  .tick em{font-style:normal;font-family:'IBM Plex Mono',monospace;font-size:0.62rem;letter-spacing:0.06em;color:#5e574b;white-space:nowrap;}
  .tick.done i{background:var(--brass);border-color:var(--brass);}
  .tick.now i{background:var(--rust);border-color:var(--rust);transform:scale(1.35);}
  .tick.now em{color:var(--paper);}
  .tick:hover em{color:var(--paper-dim);}
  .count{position:fixed;right:26px;bottom:62px;z-index:15;font-family:'IBM Plex Mono',monospace;font-size:0.7rem;color:var(--faded);}
  .keyhint{position:fixed;left:26px;bottom:62px;z-index:15;font-family:'IBM Plex Mono',monospace;font-size:0.68rem;color:#5e574b;}

  @media (max-width: 900px){
    .slide{padding:76px 22px 112px;align-items:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch;}
    .inner{padding-bottom:20px;}
    .meet{grid-template-columns:1fr;gap:10px;}
    .arrow{transform:rotate(90deg);padding:2px 0;}
    .method{grid-template-columns:1fr 1fr;}
    .step:nth-child(2)::after{display:none;}
    .nav-btn{display:none;}
    .tick em{display:none;}
    .tick.now em{display:block;position:absolute;bottom:18px;}
    .keyhint{display:none;}
    .top nav{gap:12px;}
    .top nav a{font-size:0.64rem;letter-spacing:0.08em;}
    .top{padding:12px 16px;}
    .count{display:none;}
  }
  @media (max-width: 520px){
    .brand{display:none;}
    .top nav{margin-left:0;}
    .method{grid-template-columns:1fr;}
    .step::after{display:none;}
  }
  @media (prefers-reduced-motion: reduce){
    .fx,.ghost,.rail-fill{transition:none!important;}
    .slide:not(.active) .fx{transform:none!important;}
  }
</style>
</head>

<main class="deck" id="deck" data-dir="fwd" aria-roledescription="slideshow" aria-label="James Leyba, a story in chapters">
  <div class="ghost" id="ghost" aria-hidden="true"></div>
</main>

<button class="nav-btn" id="prev" type="button" aria-label="Previous chapter">←</button>
<button class="nav-btn" id="next" type="button" aria-label="Next chapter">→</button>
<div class="keyhint">← → keys or swipe</div>
<div class="count" id="count" aria-live="polite"></div>
<div class="rail"><div class="rail-track" id="rail"><span class="rail-fill" id="fill"></span></div></div>

<script>
(function(){
'use strict';

var LOOP = ['Listen','Map','Build','Hand off'];

/* Each chapter: who I listened to (enters from the left), what that let me build
   (enters from the right), and what it taught me. Facts from my resume and LinkedIn. */
var SLIDES = [
  {id:'hello', tick:'Hi', ghost:'J.L.', kind:'cover'},
  {id:'method', tick:'Method', ghost:'loop', kind:'method'},

  {id:'roots', tick:'Denton', ghost:'UNT', place:'Denton, Texas', years:'The beginning', role:'BA, Sociology · University of North Texas',
   title:'First lesson: outcomes come from structures.',
   lede:'Sociology gave me the lens I still use. When something keeps going wrong for people, look past the individual moment to the rules, incentives and institutions producing it.',
   loop:[0,1],
   insight:'Every chapter after this is that same question, asked inside a different system.'},

  {id:'gmac', tick:'Chicago', ghost:'2003', place:'Chicago and across the U.S.', years:'2003–2010', role:'District Manager · GMAC ResCap',
   title:'The foreclosure crisis, one kitchen table at a time.',
   lede:'During the financial crisis I worked face to face with homeowners, and alongside the city and community partners trying to slow foreclosures in Chicago.',
   listen:['Homeowners, in on-the-ground outreach interviews across the U.S.','City, Federal Reserve and nonprofit partners in Chicago\'s foreclosure task force','National policy task forces: HAMP, HARP and HOPE Now'],
   build:['2,000+ loan modifications executed','Homeowner education programs to improve loan resolution','Task-force work on national interventions'],
   loop:[0,2],
   insight:'The fix for a failing loan was rarely in the file. It was in the conversation.'},

  {id:'fnma1', tick:'Fannie Mae', ghost:'2010', place:'Chicago', years:'2010–2012', role:'Senior Portfolio Manager · Fannie Mae',
   title:'From one homeowner to 510,000 mortgages.',
   lede:'Same problem, bigger lens: the performance of 450 banks and servicers, and the operations behind every number.',
   stats:[['450','banks & servicers'],['510K','mortgages'],['$80B','portfolio']],
   listen:['Servicer executives and their front-line staff','Operations teams, during audits of how the work actually got done'],
   build:['Process maps and operational improvement plans that fixed performance and compliance issues','A servicer KPI tracking system and a live portfolio site','A monthly webinar series supporting servicers'],
   loop:[0,1,2],
   insight:'Audit findings stick when the people who run the process help map it.'},

  {id:'nationstar', tick:'Dallas', ghost:'2012', place:'Dallas', years:'2012–2013', role:'Assistant Vice President, Government Relations · Nationstar Mortgage',
   title:'Growth that fast breaks accountability, unless someone rebuilds it.',
   lede:'I led a government relations and field outreach team of 40 through 400% portfolio growth.',
   listen:['Local, state and federal agencies and nonprofits','Hardest Hit Fund and HAMP partners, state mediators, the courts'],
   build:['Updated corporate accountability: legal requirements, timelines, best practices','A rebuilt team data warehouse and reporting'],
   loop:[0,1,3],
   insight:'When a system scales, the handoffs are where people fall through.'},

  {id:'nyu', tick:'NYU', ghost:'NYU', place:'New York · Cape Town · Brussels', years:'2013–2015', role:'Master of Urban Planning · NYU Wagner',
   title:'Stepping back to study the whole system.',
   lede:'Planning school named what I had been doing all along: treating a neighborhood, a market or a program as interacting parts. Then I took the lens abroad.',
   listen:['Building owners after Superstorm Sandy (NYU Furman Center research)','Community and legal advocates in Cape Town working on land and inequality','Twenty global foundations investing in underrepresented communities'],
   build:['Research on retrofit financing for NYC multifamily owners','The People\'s Law Journal edition on land use and inequality, and the first Urban Land Colloquium (100+ strategists)','A co-written report for the European Foundation Centre\'s Funders Forum for Sustainable Cities'],
   loop:[0,1],
   insight:'Inequality is designed into land, money and rules, which means it can be redesigned.'},

  {id:'cnt', tick:'Chicago', ghost:'2016', place:'Chicago', years:'2016', role:'Transit-Oriented Development Project Manager · Center for Neighborhood Technology',
   title:'Housing, transit and health are one system.',
   lede:'Technical assistance so that affordable housing, clinics, childcare and good jobs could be built near transit.',
   listen:['Chicago nonprofits and residents, through a HUD Section 4 grant','A new regional coalition: I was an original member of Elevated Chicago'],
   build:['Site acquisition and financing support for equitable TOD projects','The coalition\'s response to the national SPARCC funding call (racial equity, public health, climate)'],
   loop:[0,2],
   insight:'Where a home sits decides how much opportunity comes with it.'},

  {id:'hpd', tick:'NYC', ghost:'NYC', place:'New York City', years:'2016–2018', role:'Director of Disposition · NYC Dept. of Housing Preservation & Development',
   title:'When people already live there, the strategy starts with them.',
   lede:'I led strategy for 100+ city-owned homes and buildings, many occupied by long-term residents, and built new programs from concept to launch.',
   stats:[['100+','city-owned properties'],['$12M','Habitat deal, 20 homes'],['30 yrs','affordability terms']],
   listen:['Residents, community boards and City Council','The Mayor\'s Office, nonprofits and funders shaping Community Land Trusts'],
   build:['The City\'s Community Land Trust RFEI (co-author)','HomeFix and the Basement Conversion Pilot, from lending terms to RFP','A $12M Habitat for Humanity homeownership deal for households up to 70% AMI'],
   loop:[0,1,2,3],
   insight:'Ownership models only last when the community helped design them.'},

  {id:'oregon', tick:'Salem', ghost:'2019', place:'Salem, Oregon', years:'2019–2020', role:'Senior Policy & Program Advisor, OHCS · Policy Analyst, Oregon Legislature',
   title:'Sometimes the system to redesign is the engagement itself.',
   lede:'At the state housing agency I worked on homeownership for Oregon\'s communities of color. Then I moved to the Legislature just as COVID-19 pushed its emergency session online.',
   listen:['Funders, providers and policymakers in homeless services','Oregonians who needed to testify without being in the room'],
   build:['Policy design to raise homeownership rates for communities of color, under the Statewide Housing Plan','Analysis behind 15 bills passed in the emergency session','The Legislature\'s first digital public testimony platform, live across every committee'],
   loop:[0,2,3],
   insight:'If people can\'t be heard, the policy can\'t be right.'},

  {id:'paradise', tick:'Paradise', ghost:'2020', place:'Paradise, California', years:'2020–2022', role:'Volunteer Product Manager · Rebuild Paradise Foundation',
   title:'Rebuilding after the fire, with tools and with hammers.',
   lede:'After the Camp Fire, I volunteered with the town\'s rebuild effort, on the systems side and on the job site.',
   listen:['Residents and volunteers coordinating a town rebuild'],
   build:['An online member and volunteer registration database, moved to the cloud','Hands-on reconstruction of fire-impacted housing, including a tiny home'],
   loop:[0,2],
   insight:'A recovery runs on coordination as much as on lumber.'},

  {id:'fnma2', tick:'Portland', ghost:'NOW', place:'Portland, Oregon', years:'2020–today', role:'Advisor & Designated AI Champion · Fannie Mae',
   title:'Risk, crisis and now AI: same method, new tools.',
   lede:'I lead oversight of the nation\'s largest mortgage servicer portfolio: M&A assessments, cybersecurity incident response, investor reporting and risk. And I help my colleagues adopt generative AI.',
   listen:['Servicer leadership and operations teams, and FHFA as regulator','200+ servicers working through COVID-19 forbearance','Business teams figuring out what AI could actually do for their work'],
   build:['COVID forbearance and deferral execution that preserved homeownership for thousands','The Mortgage Reserve Account Program (MRAP) pilot, aligned with FHFA governance','Fannie Mae\'s first Copilot Studio chatbot agents, an AI Governance & Adoption Framework, and a 14-week AI learning series'],
   loop:[0,1,2,3],
   insight:'AI adoption is a change in how people work, so it starts the same way: listen first.'},

  {id:'caps', tick:'Now', ghost:'⇪', place:'Here', years:'Today', role:'Caps Unlocked',
   title:'Now I can prototype the fix, not just recommend it.',
   lede:'Generative AI closed the gap between noticing the broken part and building its replacement. This site is where those builds live: small, working answers to specific problems.',
   listen:['The people around me, and the specific things getting in their way'],
   build:['Working apps on this site, from household logistics to games and learning tools','Each one aimed at a specific problem, not a demo'],
   loop:[0,1,2],
   insight:'Ask what\'s locked up. Then build the key.'},

  {id:'talk', tick:'Talk', ghost:'hello', kind:'close'}
];

var deck = document.getElementById('deck'), rail = document.getElementById('rail');
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function loopHTML(on, d){
  return '<div class="loop fx" style="--d:' + d + '" aria-label="Method: ' + on.map(function(i){ return LOOP[i]; }).join(', ') + '">' +
    LOOP.map(function(l, i){ return '<span class="' + (on.indexOf(i) > -1 ? 'on' : '') + '">' + l + '</span>'; }).join('<i>→</i>') + '</div>';
}
function chapterHTML(s){
  var d = 0, h = '<div class="inner">';
  h += loopHTML(s.loop || [], d++);
  h += '<div class="stamp fx" style="--d:' + (d++) + '"><span class="yrs">' + esc(s.years) + '</span><span>' + esc(s.place) + '</span></div>';
  h += '<div class="role fx" style="--d:' + (d++) + '">' + esc(s.role) + '</div>';
  h += '<h2 class="fx" style="--d:' + (d++) + '">' + esc(s.title) + '</h2>';
  h += '<p class="lede fx" style="--d:' + (d++) + '">' + esc(s.lede) + '</p>';
  if (s.stats) h += '<div class="stats">' + s.stats.map(function(st){ return '<div class="stat fx from-below" style="--d:' + (d++) + '"><b>' + esc(st[0]) + '</b><span>' + esc(st[1]) + '</span></div>'; }).join('') + '</div>';
  if (s.listen || s.build){
    h += '<div class="meet">' +
      '<div class="col listen fx from-left" style="--d:' + (d + 1) + '"><h3>I listened to</h3><ul>' + (s.listen || []).map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>' +
      '<div class="arrow fx from-below" style="--d:' + (d + 3) + '"><span>so<b>→</b>I built</span></div>' +
      '<div class="col build fx from-right" style="--d:' + (d + 2) + '"><h3>What it let me build</h3><ul>' + (s.build || []).map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>' +
    '</div>';
    d += 4;
  }
  if (s.insight) h += '<div class="insight fx from-below" style="--d:' + (d + 1) + '">' + esc(s.insight) + '</div>';
  return h + '</div>';
}
function coverHTML(){
  return '<div class="inner cover">' +
    '<div class="stamp fx" style="--d:0"><span class="yrs">Bio</span><span>Portland, Oregon</span></div>' +
    '<h1 class="fx" style="--d:1">James<br><em>Leyba</em></h1>' +
    '<p class="tag fx" style="--d:2">I figure out how systems really work by listening to the people inside them. Then I build the piece that\'s missing.</p>' +
    '<div class="fields fx" style="--d:3"><span>Housing finance</span><span>Urban planning &amp; policy</span><span>AI adoption &amp; governance</span><span>25 years</span></div>' +

  return '<div class="inner">' +

  '</div>';

/* build slides + timeline */
SLIDES.forEach(function(s, i){
  var el = document.createElement('section');
  el.className = 'slide'; el.id = 's-' + s.id;
  el.setAttribute('aria-roledescription','slide'); el.setAttribute('aria-label', (i + 1) + ' of ' + SLIDES.length);
  el.innerHTML = s.kind === 'cover' ? coverHTML() : s.kind === 'method' ? methodHTML() : s.kind === 'close' ? closeHTML() : chapterHTML(s);
  deck.appendChild(el);
  var t = document.createElement('button');
  t.className = 'tick'; t.type = 'button'; t.setAttribute('aria-label', 'Go to ' + (s.title || s.tick));
  t.innerHTML = '<em>' + esc(s.tick) + '</em><i></i>';
  t.addEventListener('click', function(){ go(i); });
  rail.appendChild(t);
});
var slides = deck.querySelectorAll('.slide'), ticks = rail.querySelectorAll('.tick');
var cur = -1, ghost = document.getElementById('ghost');

function go(n){
  n = Math.max(0, Math.min(SLIDES.length - 1, n));
  if (n === cur) return;
  deck.setAttribute('data-dir', n > cur ? 'fwd' : 'back');
  var old = slides[cur];
  if (old){ old.classList.remove('active'); old.classList.add('leaving'); setTimeout(function(){ old.classList.remove('leaving'); }, 300); }
  cur = n;
  var s = slides[n];
  s.scrollTop = 0;
  // restart transitions on the incoming slide
  void s.offsetWidth;
  s.classList.add('active');
  ghost.style.opacity = 0;
  setTimeout(function(){ ghost.textContent = SLIDES[n].ghost || ''; ghost.style.opacity = 1; ghost.style.transform = 'translateX(' + (-n * 0.6) + 'vw)'; }, 180);
  ticks.forEach(function(t, i){ t.classList.toggle('now', i === n); t.classList.toggle('done', i < n); });
  document.getElementById('fill').style.width = 'calc(' + (n / (SLIDES.length - 1) * 100) + '% - 12px)';
  document.getElementById('prev').disabled = n === 0;
  document.getElementById('next').disabled = n === SLIDES.length - 1;
  document.getElementById('count').textContent = String(n + 1).padStart(2,'0') + ' / ' + SLIDES.length;
  if (history.replaceState) history.replaceState(null, '', '#' + SLIDES[n].id);
}
document.getElementById('prev').addEventListener('click', function(){ go(cur - 1); });
document.getElementById('next').addEventListener('click', function(){ go(cur + 1); });
document.addEventListener('keydown', function(e){
  if (e.altKey || e.metaKey || e.ctrlKey) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || (e.key === ' ' && !e.shiftKey)){ e.preventDefault(); go(cur + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || (e.key === ' ' && e.shiftKey)){ e.preventDefault(); go(cur - 1); }
  else if (e.key === 'Home') go(0);
  else if (e.key === 'End') go(SLIDES.length - 1);
});
deck.addEventListener('click', function(e){ var g = e.target.closest('[data-go]'); if (g){ e.preventDefault(); go(+g.getAttribute('data-go')); } });
var sx = null, sy = null;
deck.addEventListener('touchstart', function(e){ sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
deck.addEventListener('touchend', function(e){
  if (sx === null) return;
  var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.4) go(cur + (dx < 0 ? 1 : -1));
  sx = null;
}, {passive:true});
// wheel / trackpad: one chapter per gesture (only when the slide itself isn't scrolling)
var wheelLock = 0;
deck.addEventListener('wheel', function(e){
  var s = slides[cur], scrollable = s.scrollHeight > s.clientHeight + 4;
  if (scrollable) return;
  if (Date.now() < wheelLock || Math.abs(e.deltaX) + Math.abs(e.deltaY) < 30) return;
  wheelLock = Date.now() + 750;
  go(cur + ((Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY) > 0 ? 1 : -1));
}, {passive:true});

var start = SLIDES.findIndex(function(s){ return '#' + s.id === location.hash; });
go(start > -1 ? start : 0);
window.addEventListener('hashchange', function(){ var i = SLIDES.findIndex(function(s){ return '#' + s.id === location.hash; }); if (i > -1) go(i); });
})();
</script>
