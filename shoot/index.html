<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Shoot · Caps Unlocked</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": { "three": "/mindworks/vendor/three.module.min.js", "three/addons/": "/mindworks/vendor/addons/" } }
</script>
<style>
:root{--bg:#0f2e1c;--panel:#173f28;--panel2:#1f5236;--line:rgba(255,255,255,.16);--ink:#fdfbf2;--muted:#bcd2bf;--acc:#ff6b3d;--gold:#ffd447;--blue:#3a6fd8;--bad:#ff5d73;--shadow:0 10px 30px rgba(0,0,0,.45)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:#0b2214;color:var(--ink);font-family:Nunito,system-ui,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
h1,h2,h3,.btn,.brand,.chip{font-family:Fredoka,Nunito,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hide{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:16px;font-size:19px;font-weight:600;background:var(--panel2);box-shadow:inset 0 -4px 0 rgba(0,0,0,.25);transition:transform .08s}
.btn:active{transform:translateY(2px)}
.btn.go{background:linear-gradient(180deg,#ff8a5b,#ff6b3d);color:#2a0d02}
.btn.gold{background:linear-gradient(180deg,#ffe27a,#ffd447);color:#3a2a00}
.btn.ghost{background:rgba(255,255,255,.06);box-shadow:none;border:2px solid var(--line)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
kbd{display:inline-block;min-width:1.6em;text-align:center;background:#fdfbf2;color:#10301e;border-radius:6px;padding:0 6px;font:800 14px/1.6 Nunito,sans-serif;box-shadow:0 2px 0 #0007}

/* login */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:40;padding:16px;background:radial-gradient(1100px 700px at 10% -10%,#2f7d36 0%,transparent 60%),radial-gradient(900px 600px at 110% 110%,#7a2e12 0%,transparent 55%),var(--bg);overflow:auto}
#login .card{max-width:440px;width:100%;background:var(--panel);border-radius:28px;padding:26px 22px;box-shadow:var(--shadow)}
.brand{font-size:58px;font-weight:700;text-align:center;margin:0;color:var(--gold);letter-spacing:1px;text-shadow:0 4px 0 #0006}
.tag{text-align:center;color:var(--muted);margin:4px 0 18px}
.tabs{display:flex;background:var(--bg);border-radius:16px;padding:5px;margin:16px 0}
.tabs button{flex:1;min-height:44px;border-radius:12px;font-family:Fredoka;font-size:17px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--panel2);color:var(--ink)}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:14px;font-weight:800;color:var(--muted);margin:0 0 6px 4px}
.field input{width:100%;height:54px;border-radius:15px;border:2px solid var(--line);background:var(--bg);color:var(--ink);padding:0 16px;font-size:20px;outline:none;-webkit-user-select:text;user-select:text}
.field input:focus{border-color:var(--gold)}
.swatches{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.swatches button{width:44px;height:44px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.swatches button.on{border-color:#fff}
.err{color:var(--bad);min-height:22px;font-weight:800;text-align:center;margin:4px 0 8px}
.note{font-size:14px;color:var(--muted);text-align:center;margin:12px 0 0}
.wide{width:100%}
#loading{position:fixed;inset:0;z-index:39;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);font-family:Fredoka;font-size:22px}
#loading .bar{width:240px;height:10px;border-radius:99px;background:var(--panel);overflow:hidden}
#loading .bar i{display:block;height:100%;width:10%;background:linear-gradient(90deg,var(--acc),var(--gold));transition:width .3s}

/* HUD */
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(11,34,20,.8);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-weight:600;font-size:16px;white-space:nowrap}
.chip b{color:var(--gold);font-weight:700}
#stats{position:fixed;top:max(10px,env(safe-area-inset-top));right:10px;z-index:10;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;max-width:56vw}
#menuBtn{min-height:40px;padding:0 14px;border-radius:999px;background:var(--gold);color:#2a1d00;font-family:Fredoka;font-weight:600;font-size:16px}
#chat{position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;z-index:10;width:min(320px,42vw);background:rgba(11,34,20,.82);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:14px;padding:8px;font-size:14px;line-height:1.35}
#chat .who{display:flex;justify-content:space-between;gap:6px;font-size:13px;color:var(--muted);margin-bottom:4px}
#chat .who a{color:var(--gold);cursor:pointer;text-decoration:underline}
#chatLog{max-height:120px;overflow-y:auto;display:flex;flex-direction:column-reverse;gap:2px;margin-bottom:6px;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
#chatLog b{margin-right:4px}
#chat form{display:flex;gap:6px}
#chat input{flex:1;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 10px;font-size:16px;-webkit-user-select:text;user-select:text}
#chat form button{height:38px;padding:0 12px;border-radius:10px;background:var(--acc);color:#2a0d02;font-weight:800}
#chat.mini #chatLog,#chat.mini form{display:none}
#board{position:fixed;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:9;background:rgba(11,34,20,.86);border:1px solid var(--line);border-radius:14px;padding:6px 14px;text-align:center;font-family:Fredoka;white-space:nowrap}
#board .sc{font-size:24px;color:var(--gold)}
#board small{display:block;font-size:13px;color:var(--muted)}
#msg{position:fixed;left:50%;transform:translateX(-50%);top:calc(max(10px,env(safe-area-inset-top)) + 64px);z-index:9;max-width:min(620px,92vw);background:rgba(11,34,20,.86);border:1px solid var(--line);border-radius:14px;padding:9px 14px;font-size:16px;text-align:center}
#msg:empty{display:none}
#pitchBox{position:fixed;right:10px;top:calc(max(10px,env(safe-area-inset-top)) + 96px);z-index:11;background:rgba(11,34,20,.9);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;gap:8px;align-items:center;font-family:Fredoka}
#pitchBox input{width:140px;height:40px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);padding:0 10px;font-size:16px;-webkit-user-select:text;user-select:text}
#prompt{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(14px,env(safe-area-inset-bottom)) + 18px);z-index:12}
#prompt .btn{min-width:230px}

/* on-screen controls */
#joy{position:fixed;left:max(18px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:128px;height:128px;border-radius:50%;background:rgba(11,34,20,.45);border:2px solid var(--line);z-index:11;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(253,251,242,.85);box-shadow:0 4px 10px #0006}
#acts{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));z-index:11;display:grid;grid-template-columns:repeat(3,auto);gap:8px;justify-items:end;align-items:end}
#acts button{min-width:64px;min-height:58px;padding:4px 8px;border-radius:16px;background:rgba(255,107,61,.92);color:#2a0d02;font-family:Fredoka;font-weight:700;font-size:13px;line-height:1.1;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none}
#acts button b{font-size:22px}
#acts button.num{background:rgba(255,212,71,.95);color:#2a1d00;min-width:52px}
#acts button.on{transform:translateY(2px);filter:brightness(1.15)}
body.ingame #stats .chip{display:none}
#esc{position:fixed;left:max(14px,env(safe-area-inset-left));top:calc(max(10px,env(safe-area-inset-top)) + 64px);z-index:11;min-height:40px;padding:0 12px;border-radius:12px;background:rgba(11,34,20,.85);border:1px solid var(--line);font-family:Fredoka;font-weight:600}

/* modal */
#overlay{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:14px}
#modal{background:var(--panel);border-radius:24px;padding:20px;width:min(460px,100%);max-height:92vh;overflow:auto;box-shadow:var(--shadow)}
#modal h2{font-size:28px;margin:0 0 8px;color:var(--gold)}
#modal p{margin:0 0 10px;font-size:16px}
#modal .big{font-family:Fredoka;font-size:24px;color:var(--acc)}
#modal .acts{display:grid;gap:8px;margin-top:12px}
#modal .acts .btn{justify-content:flex-start}
#modal .players{display:grid;gap:4px;margin:6px 0}
#modal .players div{display:flex;justify-content:space-between;gap:8px;background:var(--bg);border-radius:10px;padding:6px 10px}
#modal .keys{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;margin:8px 0}
#toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.9);z-index:31;background:rgba(11,34,20,.92);border:2px solid var(--gold);border-radius:16px;padding:12px 18px;font-family:Fredoka;font-size:20px;opacity:0;pointer-events:none;transition:.25s}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
@media (max-width:640px){#chat{width:min(260px,52vw)}#chatLog{max-height:72px}#stats{max-width:44vw}.chip{font-size:13px;padding:5px 9px}#board .sc{font-size:19px}#msg{font-size:14px;top:calc(max(10px,env(safe-area-inset-top)) + 104px)}#joy{width:112px;height:112px}#acts button{min-width:56px;min-height:52px}}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="loading"><div>Building the town…</div><div class="bar"><i id="loadBar"></i></div></div>

<div id="login" class="hide">
  <div class="card">
    <h1 class="brand">SHOOT</h1>
    <p class="tag">A sports town. Win games, earn tokens, get strong, build your house.</p>
    <button class="btn go wide" id="guestBtn">Play now</button>
    <p class="note">No account needed. Sign in to join the shared town, see real players' houses and chat.</p>
    <div class="tabs"><button id="tabIn" class="on">Sign in</button><button id="tabNew">New player</button></div>
    <form id="loginForm">
      <label class="field"><span>Name</span><input id="lName" maxlength="16" autocomplete="username" autocapitalize="words" spellcheck="false"></label>
      <label class="field"><span>4-number PIN</span><input id="lPin" inputmode="numeric" pattern="\d{4}" maxlength="4" autocomplete="current-password" type="password"></label>
      <div id="newBits" class="hide"><span style="font-weight:800;color:var(--muted);font-size:14px;margin-left:4px">Shirt colour</span><div class="swatches" id="lSw"></div></div>
      <div class="err" id="lErr"></div>
      <button class="btn gold wide" id="lGo">Sign in</button>
    </form>
  </div>
</div>

<div id="chat" class="hide">
  <div class="who"><span id="me">Guest</span><a id="chatToggle">hide</a></div>
  <div id="chatLog"></div>
  <form id="chatForm"><input id="chatIn" maxlength="140" placeholder="Say something… (C)" autocomplete="off" aria-label="Chat message"><button>Send</button></form>
</div>
<div id="stats" class="hide">
  <span class="chip">Tokens <b id="sTok">0</b></span><span class="chip">Strength <b id="sStr">5</b></span><span class="chip">Gym <b id="sGym">1</b></span>
  <button id="menuBtn">Menu</button>
</div>
<div id="board" class="hide"><div class="sc" id="bScore"></div><small id="bInfo"></small></div>
<div id="msg"></div>
<div id="pitchBox" class="hide"><label for="pitchIn">Pitch</label><input id="pitchIn" value="fastball" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
<div id="prompt" class="hide"><button class="btn go" id="promptBtn">Go in</button></div>
<button id="esc" class="hide">Leave game</button>
<div id="joy" class="hide"><div id="knob"></div></div>
<div id="acts" class="hide"></div>
<div id="overlay" class="hide"><div id="modal"></div></div>
<div id="toast"></div>

<script type="module" src="/shoot/js/main.js"></script>
</body>
</html>
