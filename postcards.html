<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#121212">
  <title>Postcards</title>
  <style>
    :root {
      color-scheme: dark;
      background: #121212;
      color: #eee5d7;
      font-family: system-ui, sans-serif;
    }

    body { margin: 0; }

    main {
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      place-items: center;
      position: relative;
      overflow: hidden;
    }

    button { font: inherit; cursor: pointer; }
    button:disabled { cursor: default; }
    button:focus-visible { outline: 2px solid #e9d8bd; outline-offset: 5px; }
    [hidden] { display: none !important; }

    .stage {
      display: grid;
      justify-items: center;
      padding-bottom: 4rem;
      position: relative;
      width: 100%;
    }

    .postcard {
      appearance: none;
      position: relative;
      width: min(72vw, 50rem, calc((100svh - 7rem) * 1.15));
      aspect-ratio: 1.51;
      padding: 0;
      border: 0;
      border-radius: 1.1% / 1.66%;
      background: transparent;
      perspective: 1600px;
      transform-origin: center;
      transition: transform 550ms cubic-bezier(.2, .75, .25, 1);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      z-index: 2;
    }

    .postcard.is-close { transform: scale(1.3); }

    .postcard-body {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      box-shadow: 0 18px 44px #000a, 0 2px 6px #0008;
      transform: rotateY(var(--turn, 0deg));
      transform-style: preserve-3d;
    }

    .postcard.is-close .postcard-body {
      transition: transform 680ms cubic-bezier(.45, .05, .22, .99);
    }

    .face {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border-radius: inherit;
      object-fit: fill;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      transform: rotateY(0deg);
    }

    .back {
      border-radius: 2.15% / 3.25%;
      transform: rotateY(180deg);
    }

    .mail-actions {
      position: absolute;
      top: calc(100% - 2rem);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .65rem;
      width: 100%;
      z-index: 2;
    }

    .hint, .basket-label { color: #c8bfb2; font-size: .875rem; }
    .action {
      border: 1px solid #766650;
      border-radius: 2rem;
      background: #25211c;
      color: #f1e7d6;
      padding: .5rem .85rem;
      font-size: .875rem;
    }

    .action:hover { background: #392e23; }

    .basket {
      position: absolute;
      right: max(1rem, env(safe-area-inset-right));
      bottom: max(.8rem, env(safe-area-inset-bottom));
      width: clamp(5.5rem, 15vw, 11.5rem);
      display: grid;
      justify-items: center;
      gap: .2rem;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
    }

    .basket img {
      position: relative;
      z-index: 1;
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 10px 14px #0009);
      transition: transform 180ms ease;
    }

    .basket .basket-rim {
      position: absolute;
      inset: 0 auto auto 0;
      z-index: 3;
      clip-path: polygon(0 39%, 13% 46%, 39% 45%, 66% 44%, 88% 43%, 100% 35%, 100% 100%, 0 100%);
      filter: none;
      pointer-events: none;
    }

    .basket-label { position: relative; z-index: 3; }

    .basket:hover img { transform: translateY(-3px); }
    .basket:disabled img { transform: none; }

    .status {
      text-align: center;
      margin: 0;
      padding: 0 1rem 4rem;
      color: #c8bfb2;
      font-size: 1rem;
    }

    dialog {
      color: #f1e7d6;
      background: #201c18;
      border: 1px solid #63513d;
      border-radius: 1rem;
      box-shadow: 0 18px 75px #000b;
      padding: 0;
      max-height: 76svh;
      overflow: auto;
    }

    dialog::backdrop { background: #080706a8; }

    .archive {
      width: min(28rem, calc(100% - 2rem));
      margin: 0;
      inset: auto max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) auto;
    }

    .dialog-header {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #201c18;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.1rem;
      border-bottom: 1px solid #44372a;
    }

    .dialog-header h1 { margin: 0; font: 1.4rem Georgia, serif; }
    .archive-content { padding: .7rem 1rem 1rem; }
    .empty { color: #c8bfb2; margin: .65rem 0; }

    .mail-list {
      display: grid;
      gap: .5rem;
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .mail-row {
      width: 100%;
      display: grid;
      grid-template-columns: 5rem 1fr auto;
      align-items: center;
      gap: .75rem;
      text-align: left;
      color: inherit;
      background: #2a241e;
      border: 1px solid transparent;
      border-radius: .5rem;
      padding: .5rem;
    }

    .mail-row:hover { border-color: #766650; }
    .mail-row img { width: 100%; aspect-ratio: 1.51; object-fit: cover; border-radius: .2rem; }
    .mail-row strong, .mail-row time, .mail-row .location { display: block; }
    .mail-row time, .mail-row .location, .open-label { color: #d4c3ab; font-size: .8rem; }

    .envelope {
      background: linear-gradient(155deg, #eee2c6, #d0b992);
      box-shadow: inset 0 0 0 1px #836c4f;
      border-radius: .5rem;
    }

    .envelope img { position: absolute; width: 40%; left: 32%; top: 39%; }
    .envelope .envelope-postmark { width: 24%; left: auto; right: 7%; top: 10%; }

    .photos { width: min(46rem, calc(100% - 2rem)); }
    .photo-list { display: grid; gap: 1rem; padding: 1rem; }
    .photo-list img {
      display: block;
      width: 100%;
      box-sizing: border-box;
      border: .55rem solid #f2ebdb;
      background: #f2ebdb;
      animation: lift-photo 380ms ease both;
    }

    @keyframes lift-photo {
      from { opacity: 0; transform: translateY(1.2rem); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 560px) {
      .stage { padding-bottom: 7rem; }
      .mail-actions { top: calc(100% - 3.4rem); }
      .basket { width: 6.2rem; }
    }

    @media (max-height: 480px) and (orientation: landscape) {
      .stage { padding-bottom: 3rem; }
      .mail-actions { top: calc(100% - 1.5rem); }
      .basket { width: 5.5rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .postcard, .postcard.is-close .postcard-body, .basket img { transition: none; }
      .photo-list img { animation: none; }
    }
  </style>
</head>
<body>
  <main aria-label="Postcards">
    <section class="stage" aria-label="Current mail" hidden>
      <button class="postcard" type="button" aria-describedby="hint">
        <span class="postcard-body">
          <img class="face front" alt="" draggable="false">
          <img class="face back" alt="" draggable="false" aria-hidden="true">
          <span class="face envelope" aria-hidden="true" hidden>
            <img class="envelope-recipient" alt="" draggable="false">
            <img class="envelope-postmark" alt="" draggable="false" hidden>
          </span>
        </span>
      </button>
      <div class="mail-actions">
        <span class="hint" id="hint">Bring closer</span>
        <button class="action deposit" type="button" hidden>Put in basket</button>
      </div>
    </section>
    <p class="status" role="status" hidden>Open the basket to read your mail.</p>
    <button class="basket" type="button" aria-haspopup="dialog">
      <img src="/assets/postcards/wicker-basket.webp" alt="" draggable="false">
      <img class="basket-rim" src="/assets/postcards/wicker-basket.webp" alt="" draggable="false">
      <span class="basket-label">Open basket</span>
    </button>
  </main>

  <dialog class="archive" aria-labelledby="archive-title">
    <header class="dialog-header">
      <h1 id="archive-title">Wicker basket</h1>
      <form method="dialog"><button class="action">Close</button></form>
    </header>
    <div class="archive-content">
      <p class="empty">Your basket is empty.</p>
      <ul class="mail-list"></ul>
    </div>
  </dialog>

  <dialog class="photos" aria-labelledby="photos-title">
    <header class="dialog-header">
      <h1 id="photos-title">Photos</h1>
      <form method="dialog"><button class="action">Close</button></form>
    </header>
    <div class="photo-list"></div>
  </dialog>

  <script>
    // Place new mail here. Photo envelopes use kind: 'envelope', a cover thumbnail,
    // and photos: [{src, alt}]. They reuse the original handwritten address.
    const mail = [
      {
        id: 'washington-nov-22-2026',
        kind: 'postcard',
        title: 'Greetings from Washington',
        date: '2026-11-22',
        location: 'Pacific Beach, WA',
        backAlt: 'Handwritten postcard with a puppy stamp and Pacific Beach, WA postmark',
        cover: '/assets/postcards/washington-front.webp',
        back: '/assets/postcards/washington-back.webp',
      },
    ].sort((a, b) => b.date.localeCompare(a.date));
    const recipient = '/assets/postcards/recipient.webp';
    const storageKey = 'capsunlocked.postcards.basket';
    const formatter = new Intl.DateTimeFormat('en-US', { dateStyle: 'medium', timeZone: 'UTC' });
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

    const stage = document.querySelector('.stage');
    const card = stage.querySelector('.postcard');
    const front = card.querySelector('.front');
    const back = card.querySelector('.back');
    const envelope = card.querySelector('.envelope');
    const envelopeRecipient = card.querySelector('.envelope-recipient');
    const envelopePostmark = card.querySelector('.envelope-postmark');
    const hint = stage.querySelector('.hint');
    const deposit = stage.querySelector('.deposit');
    const status = document.querySelector('.status');
    const basket = document.querySelector('.basket');
    const basketImage = basket.querySelector('img');
    const archive = document.querySelector('.archive');
    const empty = archive.querySelector('.empty');
    const list = archive.querySelector('.mail-list');
    const photos = document.querySelector('.photos');
    const photoList = photos.querySelector('.photo-list');

    let saved = new Set();
    try {
      const ids = JSON.parse(localStorage.getItem(storageKey) || '[]');
      if (Array.isArray(ids)) saved = new Set(ids);
    } catch {
      // The basket still works during this visit if storage is unavailable.
    }

    let current;
    let turns = 0;
    let filing = false;

    function renderMail(item) {
      current = item;
      stage.hidden = !item;
      status.hidden = Boolean(item);
      status.textContent = 'Open the basket to read your mail.';
      if (!item) return;

      const isEnvelope = item.kind === 'envelope';
      turns = 0;
      card.classList.remove('is-close');
      card.style.removeProperty('--turn');
      card.setAttribute('aria-label', item.title + '. Bring closer');
      front.hidden = isEnvelope;
      front.setAttribute('aria-hidden', String(isEnvelope));
      front.alt = item.title;
      if (!isEnvelope) front.src = item.cover;
      back.hidden = isEnvelope;
      back.setAttribute('aria-hidden', 'true');
      back.alt = item.backAlt || 'Handwritten postcard from ' + item.location;
      if (!isEnvelope) back.src = item.back;
      envelope.hidden = !isEnvelope;
      if (isEnvelope) {
        envelopeRecipient.src = recipient;
        envelopePostmark.hidden = !item.postmark;
        if (item.postmark) envelopePostmark.src = item.postmark;
      }
      hint.textContent = 'Bring closer';
      deposit.hidden = true;
      deposit.textContent = saved.has(item.id) ? 'Put back' : 'Put in basket';
    }

    function openPhotos(item) {
      photoList.replaceChildren(...item.photos.map(photo => {
        const image = new Image();
        image.src = photo.src;
        image.alt = photo.alt;
        return image;
      }));
      photos.showModal();
    }

    card.addEventListener('click', () => {
      if (filing || !current) return;
      const isEnvelope = current.kind === 'envelope';
      if (!card.classList.contains('is-close')) {
        card.classList.add('is-close');
        hint.textContent = isEnvelope ? 'Open envelope' : 'Flip to read';
        card.setAttribute('aria-label', current.title + '. ' + hint.textContent);
        deposit.hidden = false;
        return;
      }

      if (isEnvelope) {
        openPhotos(current);
        return;
      }

      turns += 1;
      const showBack = turns % 2 === 1;
      card.style.setProperty('--turn', `${180 * turns}deg`);
      front.setAttribute('aria-hidden', String(showBack));
      back.setAttribute('aria-hidden', String(!showBack));
      hint.textContent = showBack ? 'Flip to front' : 'Flip to read';
      card.setAttribute('aria-label', (showBack ? 'Postcard back. ' : 'Postcard front. ') + hint.textContent);
    });

    async function flyToBasket() {
      if (reduceMotion.matches || !card.animate) return;
      const from = card.getBoundingClientRect();
      const target = basketImage.getBoundingClientRect();
      const dx = target.left + target.width * .5 - (from.left + from.width * .5);
      const dy = target.top + target.height * .52 - (from.top + from.height * .5);
      const scale = Math.min(.3, target.width * .65 / card.offsetWidth);
      const movement = card.animate([
        { transform: getComputedStyle(card).transform, opacity: 1 },
        { transform: `translate(${dx * .8}px, ${dy - target.height * .34}px) rotate(-11deg) scale(${scale * 1.25})`,
          opacity: 1, offset: .75 },
        { transform: `translate(${dx}px, ${dy + target.height * .17}px) rotate(-7deg) scale(${scale})`, opacity: 0 },
      ], { duration: 790, easing: 'cubic-bezier(.27,.65,.36,1)', fill: 'forwards' });
      try {
        await movement.finished;
      } catch {
        // Filing is already recorded if the browser interrupts the animation.
      } finally {
        stage.hidden = true;
        movement.cancel();
      }
    }

    deposit.addEventListener('click', async () => {
      if (filing || !current) return;
      filing = true;
      saved.add(current.id);
      try {
        localStorage.setItem(storageKey, JSON.stringify([...saved]));
      } catch {
        // Keep the newly filed item in memory for this visit.
      }

      deposit.disabled = true;
      basket.disabled = true;
      try {
        await flyToBasket();
      } finally {
        filing = false;
        deposit.disabled = false;
        basket.disabled = false;
        renderMail(mail.find(item => !saved.has(item.id)));
        if (current) {
          card.focus();
        } else {
          status.textContent = 'Filed in the basket.';
          basket.focus();
        }
      }
    });

    function archiveRow(item) {
      const row = document.createElement('li');
      const button = document.createElement('button');
      button.className = 'mail-row';
      button.type = 'button';
      const image = new Image();
      image.src = item.cover;
      image.alt = '';
      image.loading = 'lazy';
      const details = document.createElement('span');
      const title = document.createElement('strong');
      title.textContent = item.title;
      const date = document.createElement('time');
      date.dateTime = item.date;
      date.textContent = formatter.format(new Date(item.date));
      const location = document.createElement('span');
      location.className = 'location';
      location.textContent = item.location;
      const open = document.createElement('span');
      open.className = 'open-label';
      open.textContent = 'Open';
      details.append(title, date, location);
      button.append(image, details, open);
      button.addEventListener('click', () => {
        archive.close();
        renderMail(item);
        card.focus();
      });
      row.append(button);
      return row;
    }

    basket.addEventListener('click', () => {
      const filed = mail.filter(item => saved.has(item.id));
      empty.hidden = filed.length !== 0;
      list.replaceChildren(...filed.map(archiveRow));
      archive.showModal();
    });

    const requested = new URLSearchParams(location.search).get('mail');
    renderMail(mail.find(item => item.id === requested) || mail.find(item => !saved.has(item.id)));
  </script>
</body>
</html>
