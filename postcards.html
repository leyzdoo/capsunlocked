<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#121212">
  <title>Postcards</title>
  <style>
    :root {
      color-scheme: dark;
      background: #121212;
      font-family: system-ui, sans-serif;
    }

    body { margin: 0; }

    main {
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      place-items: center;
      position: relative;
    }

    .postcard {
      appearance: none;
      position: relative;
      width: min(72vw, 50rem, calc((100svh - 4.75rem) * 1.15));
      aspect-ratio: 1.51;
      padding: 0;
      border: 0;
      border-radius: 1.1% / 1.66%;
      background: transparent;
      perspective: 1600px;
      transform-origin: center;
      transition: transform 550ms cubic-bezier(.2, .75, .25, 1);
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .postcard.is-close { transform: scale(1.3); }

    .postcard:focus-visible {
      outline: 2px solid #e9d8bd;
      outline-offset: 7px;
    }

    .postcard-body {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      box-shadow: 0 18px 44px #000a, 0 2px 6px #0008;
      transform: rotateY(var(--turn, 0deg));
      transform-style: preserve-3d;
      transition: transform 680ms cubic-bezier(.45, .05, .22, .99);
    }

    .face {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border-radius: inherit;
      object-fit: fill;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      transform: rotateY(0deg);
    }

    .back {
      border-radius: 2.15% / 3.25%;
      transform: rotateY(180deg);
    }

    .hint {
      position: absolute;
      bottom: max(1rem, env(safe-area-inset-bottom));
      margin: 0;
      color: #b9b6b1;
      font-size: .875rem;
      letter-spacing: .035em;
      pointer-events: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .postcard, .postcard-body { transition: none; }
    }
  </style>
</head>
<body>
  <main aria-label="Postcards">
    <button class="postcard" type="button" aria-label="Postcard front. Bring closer" aria-describedby="hint">
      <span class="postcard-body">
        <img class="face" src="/assets/postcards/washington-front.webp" alt="Vintage Greetings from Washington postcard" draggable="false">
        <img class="face back" src="/assets/postcards/washington-back.webp" alt="Handwritten postcard with a puppy stamp and Pacific Beach, WA postmark" draggable="false" aria-hidden="true">
      </span>
    </button>
    <p class="hint" id="hint">Bring closer</p>
  </main>
  <script>
    const card = document.querySelector('.postcard');
    const front = card.querySelector('.face');
    const back = card.querySelector('.back');
    const hint = document.querySelector('#hint');
    let turns = 0;

    card.addEventListener('click', () => {
      if (!card.classList.contains('is-close')) {
        card.classList.add('is-close');
        card.setAttribute('aria-label', 'Postcard front. Flip to read');
        hint.textContent = 'Flip to read';
        return;
      }

      turns += 1;
      const showBack = turns % 2 === 1;
      card.style.setProperty('--turn', `${180 * turns}deg`);
      front.setAttribute('aria-hidden', String(showBack));
      back.setAttribute('aria-hidden', String(!showBack));
      card.setAttribute('aria-label', showBack ? 'Postcard back. Flip to front' : 'Postcard front. Flip to read');
      hint.textContent = showBack ? 'Flip to front' : 'Flip to read';
    });
  </script>
</body>
</html>
